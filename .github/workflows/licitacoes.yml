name: Coletor de licitações

# Todo dia às 07:00 (horário de Brasília) e também sob demanda (botão "Run workflow").
# Lê as condições gravadas no OrçaRede, busca no PNCP e grava os editais no Supabase.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar editais no PNCP
        env:
          SUPABASE_URL: https://qphayphqrwyvhesykpmb.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python licitacoes/coletor.py
