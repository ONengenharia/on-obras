<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lixeira · ON Engenharia</title>
<link rel="icon" href="assets/on-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#1e2f40; --muted:#5a6f83; --line:#d6e1ea;
  --accent:#2f6f9f; --accent-soft:#e8f1f9; --navy:#1e2f40; --navy2:#2b4157; --onblue:#62a8dc;
  --ok:#1f8a4c; --ok-soft:#e2f4e9; --warn:#b7791f; --warn-soft:#fbf0dc; --idle-soft:#edf1f5; --map:#ffffff; --danger:#b3261e; --danger-soft:#fbe9e7;
  --f-body:Montserrat,system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101b26; --panel:#172534; --ink:#e8f1f9; --muted:#9fb8cc; --line:#2b4157;
  --accent:#62a8dc; --accent-soft:#1d3a52; --navy:#0b141d; --navy2:#1e2f40;
  --ok:#52c47f; --ok-soft:#173326; --warn:#e3a94b; --warn-soft:#3a2d16; --idle-soft:#1e2f40; --map:#e9edf0; --danger:#f2867d; --danger-soft:#3a1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101b26; --panel:#172534; --ink:#e8f1f9; --muted:#9fb8cc; --line:#2b4157;
  --accent:#62a8dc; --accent-soft:#1d3a52; --navy:#0b141d; --navy2:#1e2f40;
  --ok:#52c47f; --ok-soft:#173326; --warn:#e3a94b; --warn-soft:#3a2d16; --idle-soft:#1e2f40; --map:#e9edf0; --danger:#f2867d; --danger-soft:#3a1d1b; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.del{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:4px 9px;font-size:12px}
header .btn{background:var(--navy2);border-color:#3b5670;color:#e8f1f9}
header .btn.pri{background:var(--onblue);border-color:var(--onblue);color:#0f1c28}
.lnk{background:none;border:0;color:var(--accent);padding:0;font-size:12.5px;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:0;line-height:1.45}
.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.erro{max-width:440px;margin:12vh auto;padding:24px;text-align:center}
.erro img{height:56px;border-radius:6px}.erro a{color:var(--accent);font-weight:600}
.inp{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-size:13.5px}
.fld{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:13.5px;width:100%}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.03em;background:var(--idle-soft);color:var(--muted);white-space:nowrap}
.chip.andamento{background:var(--warn-soft);color:var(--warn)}.chip.finalizado{background:var(--ok-soft);color:var(--ok)}
.chip.vig{background:var(--accent-soft);color:var(--accent)}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--navy);color:#e8f1f9;border-radius:12px;padding:12px 16px}
header.top img{height:44px;border-radius:4px;display:block}
.ttl{min-width:0;flex:1 1 260px}
.eye{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9fb8cc}
.eye a{color:#9fb8cc;text-decoration:none}.eye a:hover{color:#fff}
.ttl h1{font-weight:700;font-size:19px;line-height:1.2;margin:3px 0 1px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttl h1 .chip{font-size:10px}.ttl h1{flex-wrap:nowrap}#hT{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ttl .sub,.ttl .eye{overflow-wrap:anywhere}
.ttl .sub{color:#9fb8cc;font-size:12.5px}
.tot{text-align:right}
.tot .v{font-family:var(--f-mono);font-size:22px;font-weight:500;color:#fff;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.steps{display:flex;gap:4px;flex-wrap:wrap;width:100%}
.steps button{border:1px solid #3b5670;background:transparent;color:#9fb8cc;border-radius:999px;padding:6px 14px;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:7px}
.steps button b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#2b4157;color:#e8f1f9;font-size:11px}
.steps button.on{background:#e8f1f9;color:#1e2f40;border-color:#e8f1f9}.steps button.on b{background:#2f6f9f;color:#fff}
.steps button:disabled{opacity:.45;cursor:default}
.page{max-width:1180px;margin:0 auto;padding:16px;display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.kpi .k{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.kpi .kx{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.dash2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.rec{display:grid;gap:2px}
.rec button{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;border:0;background:none;padding:8px 6px;border-radius:8px;text-align:left}
.rec button:hover{background:var(--accent-soft)}
.rec .t b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rec .t small,.rec .r small{display:block;font-size:11.5px;color:var(--muted)}
.rec .r{text-align:right;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}.rec .r b{font-weight:500}
.sit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}.sit .k{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.sitb{height:8px;margin-top:4px}
.bar{height:6px;border-radius:3px;background:var(--idle-soft);overflow:hidden}.bar>b{display:block;height:100%;background:var(--ok);border-radius:3px}
.bc{display:flex;gap:6px;align-items:center;font-size:13px;flex-wrap:wrap}
.bc button{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--bg)}
.tbl tr.go{cursor:pointer}.tbl tr.go:hover td{background:var(--accent-soft)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .sm{display:block;font-size:11.5px;color:var(--muted);font-weight:400;font-family:var(--f-body)}
.ico{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--accent-soft);color:var(--accent);margin-right:10px;font-size:15px;flex:none}
.ico.f{background:var(--warn-soft);color:var(--warn)}
.nm{display:flex;align-items:center}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px))}
.app header.top{grid-column:1/-1}
.app.maxed{padding:0;gap:0}.app.maxed header.top{display:none}
.proj{display:grid;grid-template-columns:var(--listw,330px) 12px minmax(0,1fr) auto auto;min-height:0}
.proj.max{grid-template-columns:minmax(0,1fr) auto}.proj.max #side,.proj.max .split{display:none}
.app.maxed .mapwrap,.app.maxed #ptpanel{border-radius:0}
.split{cursor:col-resize;display:grid;place-items:center;touch-action:none}
.split::after{content:"";width:4px;height:44px;border-radius:2px;background:var(--line)}
.split:hover::after,.split.on::after{background:var(--accent)}
#ptpanel{width:var(--pw,410px);min-width:0;overflow-x:hidden;container-type:inline-size}
#ptpanel .x{border:0;background:none;font-size:20px;line-height:1;color:var(--muted);padding:0 4px}
.pl.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.resumo{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.resumo>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:12.5px;font-weight:600}
.resumo>summary::-webkit-details-marker{display:none}
.resumo .segbars{padding:2px 10px 10px;gap:6px;max-height:150px;overflow:auto}.resumo .sb{grid-template-columns:110px minmax(0,1fr) 78px;font-size:11.5px}.resumo .sb .bar{height:7px}
.pin .lp{position:absolute;top:-11px;right:-11px;width:17px;height:17px;border-radius:50%;background:#ffd54f;border:1.5px solid #fff;display:grid;place-items:center;font-size:10px;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.pin .tr{position:absolute;bottom:-12px;right:-10px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid #d32f2f;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.pin .lp.no{background:#cfd8dc;filter:grayscale(1);opacity:.85}
.ipbox{border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:grid;gap:8px;background:var(--bg)}
.ipbox .row b{font-size:13px}
.pl .ec{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.pl .ec i{font-style:normal;font-family:var(--f-mono);font-size:10.5px;font-weight:500;background:var(--idle-soft);color:var(--ink);border-radius:4px;padding:0 5px;line-height:17px}
.pl .ec i.ip{background:#fff3c4;color:#7a5a00}.pl .ec i.nada{background:none;color:var(--muted);font-family:var(--f-body)}
.kvwarn{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:7px 10px;font-size:12px;display:grid;gap:2px}
.kvtag{font-size:10px;font-weight:700;color:#fff;background:var(--danger);border-radius:6px;padding:0 5px;vertical-align:middle;font-family:var(--f-body)}
tr.fc td{background:var(--danger-soft)}
.vt{width:100%;border-collapse:collapse;font-size:12.5px}.vt th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:4px}
.vt td{padding:5px 4px;border-top:1px solid var(--line)}.vt select{width:100%;padding:5px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.st{font-size:10.5px;font-weight:700;border-radius:8px;padding:1px 7px;white-space:nowrap}.st.ok{background:var(--ok-soft);color:var(--ok)}.st.no{background:var(--danger-soft);color:var(--danger)}.st.m{background:var(--accent-soft);color:var(--accent)}
.leg{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;display:grid;gap:4px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.leg div{display:flex;align-items:center;gap:6px}.leg b{font-family:var(--f-mono);font-weight:500;margin-left:auto;padding-left:12px}
.trl{display:grid;gap:6px}.trl label{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px;font-weight:600}
.trl label small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}.trl label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.painel{grid-template-columns:auto minmax(0,1fr) minmax(220px,.8fr);gap:18px;align-items:center}
.pp1{display:flex;gap:14px;align-items:center}.pp1 svg{color:var(--ink);flex:none}
.pp1 .lg{display:grid;gap:4px;font-size:12px;min-width:150px}.pp1 .lg div{display:grid;grid-template-columns:10px 1fr auto;gap:6px;align-items:center}.pp1 .lg i{width:10px;height:10px;border-radius:3px}.pp1 .lg b{font-family:var(--f-mono);font-weight:500}
.pp2{display:grid;gap:7px}.gb{display:grid;grid-template-columns:96px minmax(0,1fr) 110px;gap:8px;align-items:center;font-size:12px}.gb .bar{height:9px}.gb .mono{text-align:right}
.pp3{display:grid;gap:6px;border-left:1px solid var(--line);padding-left:16px}.pp3 div{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}.pp3 span{color:var(--muted)}.pp3 b{font-family:var(--f-mono);font-weight:500}
.extra{border:1px dashed var(--line);border-radius:8px;padding:8px}
.sug{background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:12px;display:grid;gap:6px}
.sug code{font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere}
.full-pane{overflow:auto;min-height:0}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ah{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.pane{overflow:auto;padding:12px 14px;display:grid;gap:12px;align-content:start;grid-auto-rows:max-content;flex:1;min-height:0}
.plist{display:grid;gap:1px}
.pl{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 6px;border-radius:7px;cursor:pointer}
.pl:hover{background:var(--accent-soft)}
.pl .n{font-family:var(--f-mono);font-size:11.5px;font-weight:600;min-width:28px;height:22px;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:#fff;padding:0 6px}
.pl .n.v{background:var(--warn)}
.pl .t{font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.pl .t small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.pl .r{text-align:right;font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.pl .r small{display:block;font-family:var(--f-body);font-size:10.5px;color:var(--muted)}
.pl input[type=checkbox]{width:16px;height:16px;margin:0}
.segtag{display:inline-block;font-size:10px;font-weight:700;border-radius:8px;padding:1px 6px;margin-left:4px;color:#fff;vertical-align:middle}
.bulk{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:8px;padding:7px 9px;font-size:12.5px}
.est{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.est>summary{list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;background:var(--bg);cursor:pointer;font-weight:600;font-size:13px}
.est>summary::-webkit-details-marker{display:none}
.est .ed{font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:1px 6px;margin-left:6px}
.est .seg{font-size:11.5px;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--panel);max-width:120px}
.its{width:100%;border-collapse:collapse;font-size:12px}
.its td{padding:4px 8px;border-top:1px solid var(--line);vertical-align:middle}
.its td.q{width:74px}.its td.v{width:86px;text-align:right}.its td.x{width:22px}
.its input{width:66px;padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-family:var(--f-mono);font-size:12px;text-align:right}
.its .m{line-height:1.3}.its .m small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.xb{border:0;background:none;color:var(--muted);font-size:15px;padding:0 2px;line-height:1}
.xb:hover{color:var(--danger)}
.seq{display:flex;gap:6px}.seq input{flex:1;min-width:0;font-family:var(--f-mono);font-size:12.5px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px}.kv b{font-family:var(--f-mono);font-weight:500}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--map);min-height:0;touch-action:none;cursor:grab}
.mapwrap.drag{cursor:grabbing}.mapwrap.place,.mapwrap.trace,.mapwrap.calib{cursor:crosshair}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stage img{display:block;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.stage .blank{background-color:#fff;background-image:linear-gradient(#e7edf3 1px,transparent 1px),linear-gradient(90deg,#e7edf3 1px,transparent 1px);background-size:100px 100px}
.pin{position:absolute;min-width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:13px;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);background:#2f6f9f;color:#fff;padding:0 4px;font:600 11px/21px var(--f-mono);transform:scale(var(--inv,1))}
.pin.vazio{background:#b7791f}
.pin.sel{outline:3px solid #c2185b;outline-offset:2px;z-index:2;cursor:move}
.pin.anchor{outline:3px dashed #c2185b;outline-offset:3px}
svg.net{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.net line{pointer-events:stroke;cursor:pointer;stroke-linecap:round}
svg.net line.hit{stroke:transparent}
svg.net text{font-family:var(--f-mono);font-weight:600;paint-order:stroke;stroke:#fff;pointer-events:none}
.mapbar{position:absolute;left:10px;top:10px;right:56px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.mapbar>*{pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mapui{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapui button{width:36px;height:36px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-size:18px;font-weight:600}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--navy);color:#e8f1f9;padding:7px 12px;border-radius:7px;font-size:12.5px;max-width:calc(100% - 20px);text-align:center}
.esc{position:absolute;right:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11.5px;color:var(--muted)}
.dot{display:inline-block;width:14px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px;align-content:start}
.card h2{margin:0;font-size:15px}
.wrap2{max-width:1400px;margin:0 auto;display:grid;gap:12px;padding-bottom:20px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
.wrap2.wide3{max-width:none;padding-left:12px;padding-right:12px}.cols3{display:grid;grid-template-columns:280px minmax(0,1fr) 340px;gap:12px;align-items:start}
.stk{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
@media (max-width:1280px){.cols3{grid-template-columns:minmax(0,1fr) 320px}.cols3>aside:first-child{grid-column:2;grid-row:1}.cols3>.card{grid-row:1/span 2;grid-column:1}}

   <div id="full"><div class="wrap2"><div class="card"><div class="row"><input class="inp" id="q" placeholder="Buscar" value="${esc(q)}" style="width:260px"><label class="note"><input type="checkbox" id="td" ${todos_?"checked":""}> mostrar também exclusões pequenas (itens internos)</label></div>
   <table class="tbl"><thead><tr><th>Excluído</th><th>O quê</th><th class="hm">Por</th><th class="n">Registros</th><th></th></tr></thead><tbody>
   ${F.map(l=>`<tr><td>${new Date(l.quando).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}</td><td><b>${esc(l.descricao||"")}</b><span class="sm">${esc(NOMES[l.tabela]||l.tabela)}${l.tabelas&&l.tabelas.length>1?` + ${l.tabelas.length-1} tipo(s) de dado ligado(s)`:""}</span></td><td class="hm">${esc(l.quem_nome||"—")}</td><td class="n">${l.linhas}</td><td class="n"><button class="btn sm pri" data-r="${l.lote}">↺ Restaurar</button></td></tr>`).join("")||'<tr><td colspan="5" class="note">Nada na lixeira.</td></tr>'}
   </tbody></table><p class="note" style="margin-top:8px">Arquivos (plantas, fotos, PDFs) não ficam aqui: eles estão no backup diário do Google Drive.</p></div></div></div></div>`;
  $("#q").oninput=e=>{q=e.target.value;const p=e.target.selectionStart;draw();const i=$("#q");i.focus();i.setSelectionRange(p,p)};
  $("#td").onchange=e=>{todos_=e.target.checked;draw()};
  $$("[data-r]").forEach(b=>b.onclick=()=>{const l=L.find(x=>String(x.lote)===b.dataset.r);modal(`<h2>Restaurar “${esc(l.descricao||"")}”?</h2><p class="note">Volta ${l.linhas} registro(s) do jeito que estavam quando foram excluídos. O que já existe não é sobrescrito.</p>`,async()=>{
    const r=await sb.rpc("lixeira_restaurar",{p_lote:l.lote});if(r.error){toast("Erro: "+r.error.message);return false}toast(`Restaurado: ${r.data} registro(s).`);L=await carregar();draw()},"Restaurar")})}
draw();

})();
</script>
</body>
</html>
