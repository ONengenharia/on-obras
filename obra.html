<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Obra · ON Engenharia</title>
<link rel="icon" href="assets/on-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.erro{max-width:420px;margin:12vh auto;padding:24px;text-align:center;font-family:Montserrat,system-ui,sans-serif;color:var(--ink)}
.erro img{height:56px;border-radius:6px}.erro h1{font-size:20px}.erro a{color:var(--accent);font-weight:600}

/* Layout: faixa navy com logos, indicadores da obra, régua de etapas; abaixo, painel com abas à esquerda e a planta navegável ocupando o resto */
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#1e2f40; --muted:#5a6f83; --line:#d6e1ea;
  --accent:#2f6f9f; --accent-soft:#e8f1f9; --navy:#1e2f40; --navy2:#2b4157; --onblue:#62a8dc;
  --ok:#1f8a4c; --ok-soft:#e2f4e9; --warn:#b7791f; --warn-soft:#fbf0dc; --idle:#8a96a3; --idle-soft:#edf1f5; --map:#ffffff;
  --f-body:Montserrat,system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101b26; --panel:#172534; --ink:#e8f1f9; --muted:#9fb8cc; --line:#2b4157;
  --accent:#62a8dc; --accent-soft:#1d3a52; --navy:#0b141d; --navy2:#1e2f40; --onblue:#62a8dc;
  --ok:#52c47f; --ok-soft:#173326; --warn:#e3a94b; --warn-soft:#3a2d16; --idle:#7c8996; --idle-soft:#1e2f40; --map:#e9edf0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101b26; --panel:#172534; --ink:#e8f1f9; --muted:#9fb8cc; --line:#2b4157;
  --accent:#62a8dc; --accent-soft:#1d3a52; --navy:#0b141d; --navy2:#1e2f40; --onblue:#62a8dc;
  --ok:#52c47f; --ok-soft:#173326; --warn:#e3a94b; --warn-soft:#3a2d16; --idle:#7c8996; --idle-soft:#1e2f40; --map:#e9edf0; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:var(--sidew,360px) minmax(0,1fr);grid-template-rows:auto auto auto var(--maph,640px);min-height:100%;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* topo */
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--navy);color:#e8f1f9;border-radius:12px;padding:12px 16px}
.logos{display:flex;align-items:center;gap:12px}
.logos img{height:44px;width:auto;display:block;border-radius:4px}
.logos .sep{width:1px;height:36px;background:#3b5670}
.clogo{height:44px;max-width:150px;object-fit:contain;background:#fff;padding:4px 8px}
.slot{height:44px;min-width:120px;border:1.5px dashed #4f6c88;border-radius:6px;display:grid;place-items:center;color:#9fb8cc;font-size:12px;padding:0 10px;cursor:pointer}
.ttl{min-width:0;flex:1 1 280px}
.eye{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9fb8cc}
.ttl h1{font-weight:700;font-size:19px;line-height:1.2;margin:3px 0 1px;text-wrap:balance;letter-spacing:-.01em}
.ttl .sub{color:#9fb8cc;font-size:12.5px}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
header .btn{background:var(--navy2);border-color:#3b5670;color:#e8f1f9}
header .btn.pri{background:var(--onblue);border-color:var(--onblue);color:#0f1c28}
header .btn.on{background:#e8f1f9;color:#1e2f40}
.dirty{font-size:12px;color:#f2c46d;font-weight:500}
/* indicadores */
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.kpi .k{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.kpi .v small{font-size:12px;font-weight:500;color:var(--muted)}
.kpi.main{background:var(--accent);border-color:var(--accent);color:#fff}
.kpi.main .k,.kpi.main .v small{color:#e8f1f9}
.kpi.main .bar{background:rgba(255,255,255,.25)} .kpi.main .bar>b{background:#fff}
.bar{height:6px;border-radius:3px;background:var(--idle-soft);overflow:hidden}
.bar>b{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.full>b{background:var(--ok)}
/* etapas */
.etapas{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.track{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px}
.et{flex:1 0 140px;min-width:140px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px;text-align:left;display:grid;gap:5px}
.et .n{font-weight:600;font-size:12.5px;line-height:1.25}
.et .r{display:flex;align-items:center;gap:6px}
.et .r .bar{flex:1}
.et .p{font-family:var(--f-mono);font-size:12px;font-weight:500;min-width:36px;text-align:right}
.et .d{font-size:11px;color:var(--muted)}
.et.done{border-color:var(--ok)} .et.done .p{color:var(--ok)}
.et.doing .bar>b{background:var(--warn)}
.et.add{flex:0 0 auto;min-width:0;place-items:center;color:var(--accent);border-style:dashed;font-weight:600}
/* lateral com abas */
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tabs button{flex:1 0 auto;border:0;background:none;padding:10px 10px;font-weight:600;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.pane{overflow:auto;padding:14px;display:grid;gap:14px;align-content:start;min-height:0;flex:1}
.q{display:grid;gap:5px}
.q .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.q .nm{font-weight:600;font-size:13px;min-width:0}
.q .spec{font-size:11.5px;color:var(--muted);line-height:1.35}
.q .val{font-family:var(--f-mono);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{font-size:10.5px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:1px 7px;margin-left:4px;white-space:nowrap}
.qe{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.qe input{width:80px;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-family:var(--f-mono);font-size:12px}
.lnk{background:none;border:0;color:var(--accent);padding:0;font-size:12.5px;font-weight:600}
.lnk.del{color:var(--muted);font-weight:500}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0;font-size:12.5px}
dl.info dt{color:var(--muted)} dl.info dd{margin:0;min-width:0}
.log{display:grid;gap:14px}
.log>div{display:grid;gap:6px;font-size:13px;line-height:1.45;border-left:3px solid var(--accent);padding-left:10px}
.log time{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-size:12.5px;margin:0;line-height:1.45}
.note{font-size:11.5px;color:var(--muted);margin:0;line-height:1.4}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.gal button{aspect-ratio:1;max-width:100%;padding:0;border:0;border-radius:6px;overflow:hidden;background:var(--idle-soft)}
.gal img{width:100%;height:100%;object-fit:contain;display:block;background:var(--idle-soft)}
/* fotos */
.ph{display:flex;gap:6px;flex-wrap:wrap}
.ph button.t{width:64px;height:64px;padding:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--idle-soft);position:relative}
.ph button.t img{width:100%;height:100%;object-fit:contain;display:block;background:var(--idle-soft)}
.ph .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:13px;line-height:20px;text-align:center}
.ph label.up{width:64px;height:64px;border:1.5px dashed var(--line);border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--accent);cursor:pointer;text-align:center;line-height:1.2;position:relative;overflow:hidden}
.ph label.up input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
/* redimensionar */
.rz{position:absolute;z-index:6;background:transparent;touch-action:none}
.rz.l{left:-7px;top:0;bottom:0;width:12px;cursor:ew-resize}
.rz.b{left:0;right:0;bottom:-7px;height:12px;cursor:ns-resize}
.rz.c{left:-8px;bottom:-8px;width:20px;height:20px;cursor:nesw-resize}
.rz.b::after{content:"";position:absolute;left:50%;top:3px;width:46px;height:5px;margin-left:-23px;border-radius:3px;background:var(--line)}
.rz.l::after{content:"";position:absolute;top:50%;left:3px;height:46px;width:5px;margin-top:-23px;border-radius:3px;background:var(--line)}
.rz:hover::after,.rz.on::after{background:var(--accent)}
.viewsw{display:inline-flex;border:1px solid #3b5670;border-radius:7px;overflow:hidden}
.viewsw button{border:0;background:transparent;color:#9fb8cc;padding:6px 10px;font-weight:600;font-size:12px}
.viewsw button.on{background:#e8f1f9;color:#1e2f40}
.kpi .v .pc{float:right;font-size:14px;font-weight:700;color:var(--accent)}
.kpi.main .v .pc{display:none}
.et .lk{font-size:10.5px;color:var(--accent);font-weight:600}
.pfab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:10px;background:#1e2f40;color:#e8f1f9;text-decoration:none;border:1px solid #3b5670;border-radius:12px;padding:8px 14px 8px 8px;box-shadow:0 6px 20px rgba(0,0,0,.3);font-size:12.5px;line-height:1.25;max-width:calc(100% - 32px)}
.pfab img{height:34px;width:auto;border-radius:6px;display:block}
.pfab b{display:block;font-size:13px;color:#62a8dc}
.pfab:hover{border-color:#62a8dc}
.pfab .x{margin-left:4px;background:none;border:0;color:#9fb8cc;font-size:16px;padding:0 2px}
.pfmini{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;width:44px;height:44px;border-radius:50%;border:1px solid #3b5670;background:#1e2f40;padding:0;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.pfmini img{width:100%;height:100%;object-fit:cover}
.pflink{display:flex;align-items:center;gap:8px;text-decoration:none;color:#e8f1f9;border:1px solid #3b5670;border-radius:8px;padding:6px 10px;font-size:12px;line-height:1.2;background:var(--navy2)}
.pflink b{display:block;color:#62a8dc;font-size:12.5px}
.pflink:hover{border-color:#62a8dc}
.et.dragging{opacity:.35}
.et.ghost{position:fixed;z-index:60;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.3);opacity:.95;margin:0}
.et .grip{font-size:11px;color:var(--muted);letter-spacing:-2px;user-select:none}
.app.editing .et[data-id]{cursor:grab}
.sortable-fallback{opacity:.95!important;box-shadow:0 10px 24px rgba(0,0,0,.3)}
.composer{display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.composer textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:7px;padding:8px;background:var(--panel);color:var(--ink);font-size:13.5px}
.composer .row input[type=date]{border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--panel);color:var(--ink);font-size:12.5px}
.msg{display:grid;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
.msg .mt{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.msg .mt b{color:var(--accent);font-weight:600}
.mat{width:100%;border-collapse:collapse;font-size:12.5px}
.mat th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
.mat td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.mat td.n{font-family:var(--f-mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.mat .cd{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.mat input{width:68px;padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-family:var(--f-mono);font-size:12px;text-align:right}
.matwrap{overflow-x:auto}
.search{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-size:13px}
.maplink{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:12.5px;color:var(--accent);border:1px solid var(--line);border-radius:7px;padding:7px 10px;background:var(--bg)}
.axl{display:grid;gap:6px}
.ax{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--bg);min-width:0}
.axi{flex:none;width:34px;height:34px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:700 10.5px/34px var(--f-mono);text-align:center}
.axn{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;font-weight:600;font-size:12.5px;color:var(--ink);overflow-wrap:anywhere}
.axn small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.prevt{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px}
/* mapa */
.mapwrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:visible;background:var(--map);min-height:0;touch-action:none;cursor:grab}
.mapwrap.drag{cursor:grabbing} .mapwrap.place,.mapwrap.trace .pin{cursor:crosshair}
.clip{position:absolute;inset:0;overflow:hidden;border-radius:10px}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stage img{display:block;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);background:#7b8794;padding:0;transform:scale(var(--inv,1))}
.pin.executado{background:#1f8a4c}.pin.andamento{background:#d18b16}
.pin.sel{outline:3px solid #2f6f9f;outline-offset:2px;cursor:move;z-index:2}
.pin.anchor{outline:3px dashed #c2185b;outline-offset:3px}
.pin .bd{position:absolute;top:-9px;min-width:13px;height:13px;border-radius:7px;font:700 8.5px/13px var(--f-mono);color:#fff;text-align:center;padding:0 2px;pointer-events:none}
.pin .bd.l{left:-9px;background:#e0a800;color:#1b1b1b}.pin .bd.t{right:-9px;background:#2f6f9f}
.pin .bd.f{top:auto;bottom:-9px;right:-9px;background:#1e2f40}
svg.net{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.net line{pointer-events:stroke;cursor:pointer;stroke-linecap:round}
svg.net line.hit{stroke:transparent}
.mapbar{position:absolute;left:10px;top:10px;right:56px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.mapbar>*{pointer-events:auto}
.mapbar .btn{box-shadow:0 1px 4px rgba(0,0,0,.12)}
.mapui{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:10px;display:flex;flex-direction:column;gap:6px}
.mapui button{width:36px;height:36px;border-radius:7px;border:1px solid var(--line);background:var(--panel);font-size:18px;font-weight:600;display:grid;place-items:center}
.legend{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px;display:flex;gap:10px 12px;font-size:11.5px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.seg{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle}
.hint{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);background:var(--navy);color:#e8f1f9;padding:7px 12px;border-radius:7px;font-size:12.5px;max-width:calc(100% - 20px);text-align:center}
.card{position:absolute;right:56px;top:56px;width:min(310px,calc(100% - 76px));max-height:calc(100% - 110px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:grid;gap:9px;cursor:default}
.card h3{margin:0;font-size:16px;font-weight:700}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
.chip.executado{background:var(--ok-soft);color:var(--ok)}.chip.andamento{background:var(--warn-soft);color:var(--warn)}.chip.previsto{background:var(--idle-soft);color:var(--muted)}
.card p{margin:0;font-size:13px;line-height:1.45;white-space:pre-wrap}
.meta{font-size:12px;color:var(--muted)}
.eq{display:flex;gap:6px;flex-wrap:wrap}
.eq span{font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font-weight:600}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,22,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal form,.modal .box{background:var(--panel);border-radius:12px;padding:18px;width:min(440px,100%);display:grid;gap:12px;max-height:100%;overflow:auto}
.modal .box.wide{width:min(1100px,100%)}
.modal h2{margin:0;font-size:18px;font-weight:700}
.fld{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:14px}
.fld.ck{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:13.5px}
.fld.ck input{width:18px;height:18px;padding:0}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.crop{position:relative;overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none}
.crop canvas{display:block;max-width:100%;height:auto}
.crop .sel{position:absolute;border:2px solid #2f6f9f;background:rgba(98,168,220,.15);pointer-events:none}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#e8f1f9;padding:9px 14px;border-radius:7px;font-size:13px;z-index:50;max-width:calc(100% - 32px);text-align:center}

<script>
(async()=>{
let S,role="cliente",TOKEN=null;
try{const r=await DB.carregarObra();S=r.S;role=r.role;TOKEN=r.token;if(role!=="cliente"){try{const oid=new URLSearchParams(location.search).get("id");const n=await DB.sb.from("negocios").select("id").eq("obra_id",oid).limit(1);if(n.data&&n.data[0])window.__NEG=n.data[0].id}catch(_){}}}
catch(e){if(e.message!=="login")document.getElementById("root").innerHTML=`<div class="erro"><img src="assets/on-logo.png" alt="ON Engenharia"><h1>Não foi possível abrir a obra</h1><p>${String(e.message||e).replace(/</g,"&lt;")}</p><a href="index.html">Ir para o início</a></div>`;return}
document.title=S.obra.titulo+" · ON Engenharia";
S.onLogo="assets/on-logo.jpg";
/* migração de versões anteriores */
const AUTO0={q1:"MT",q2:"BT50",q3:"BT70",q4:"postes",q5:"trafo",q6:"lum"};
S.quant.forEach(q=>{if(q.auto===undefined)q.auto=AUTO0[q.id]||""});
S.marcos.forEach(m=>{if(m.pct==null||m.pct==="")m.pct=m.status==="done"?100:0});
S.redes.forEach(g=>{if(g.tipo==="BT"&&!g.bt)g.bt=/70/.test(g.cabo||"")?"70":"50"});
if(!S.pxm)S.pxm=150/25.4;
if(!S.linkMig){S.linkMig=1;const L={m4:"q4",m5:"q1",m6:"BT",m7:"q5",m8:"q6"};S.marcos.forEach(m=>{if(L[m.id]&&!m.link&&(!m.pct||+m.pct===0))m.link=L[m.id]})}

let edit=false,canEdit=false,dirty=false,placing=false,selId=null,selSeg=null,tracing=null,anchor=null,tab="quant";
let artifactNs=null,assetsNs=null;
const admEd=()=>edit&&role==="admin";
let draft={txt:"",fotos:[],data:""},matQ="";
const lsGet=k=>{try{return localStorage.getItem("obra."+k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem("obra."+k,v)}catch(e){}};
let view=lsGet("view")||(innerWidth<820?"mob":"desk");
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>Number(n||0).toLocaleString("pt-BR",{maximumFractionDigits:1});
const fmt0=n=>Number(n||0).toLocaleString("pt-BR",{maximumFractionDigits:0});
const fdate=d=>{if(!d)return"";const[y,m,dd]=d.split("-");return dd&&m?`${dd}/${m}/${y}`:d};
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const PST={previsto:"Previsto",andamento:"Em andamento",executado:"Executado"};
const TIPOS=["Poste","Transformador","Luminária","Ocorrência","Outro"];
const NETC={MT:"#c2185b",BT50:"#1565c0",BT70:"#00897b"};
const netKey=g=>g.tipo==="MT"?"MT":"BT"+(g.bt||"50");
const NETN={MT:"Rede MT",BT50:"Rede BT 3×50",BT70:"Rede BT 3×70"};
const AUTON={"":"Lançamento manual",postes:"Postes executados no mapa",lum:"Luminárias executadas no mapa",trafo:"Transformadores executados no mapa",MT:"Metros de rede MT executada no mapa",BT50:"Metros de BT 3×50 executada no mapa",BT70:"Metros de BT 3×70 executada no mapa"};
const ptById=id=>S.pontos.find(p=>p.id===id);
const segLen=g=>{const a=ptById(g.a),b=ptById(g.b);return a&&b?Math.hypot(a.x-b.x,a.y-b.y)/S.pxm:0};
const exP=p=>p.status==="executado";
const isPoste=p=>p.tipo==="Poste";
const hasLum=p=>p.lum||p.tipo==="Luminária";
const hasTr=p=>p.trafo||p.tipo==="Transformador";
// executado conta 100%, em andamento conta 50%
const peso=x=>x.status==="executado"?1:x.status==="andamento"?.5:0;
function mapCount(key,all,modo){
  const w=x=>all?1:modo==="exec"?(x.status==="executado"?1:0):modo==="and"?(x.status==="andamento"?1:0):peso(x),soma=L=>L.reduce((t,x)=>t+w(x),0);
  if(key==="postes")return soma(S.pontos.filter(isPoste));
  if(key==="lum")return soma(S.pontos.filter(hasLum));
  if(key==="trafo")return soma(S.pontos.filter(hasTr));
  return S.redes.filter(g=>netKey(g)===key).reduce((t,g)=>t+segLen(g)*w(g),0);
}
const qExec=q=>q.auto?mapCount(q.auto):(+q.exec||0);
/* contadores mostram só o executado (inteiro); o andamento aparece à parte e só pesa 50% no avanço */
const qConta=q=>q.auto?mapCount(q.auto,false,"exec"):(+q.exec||0);
const qAnd=q=>q.auto?mapCount(q.auto,false,"and"):0;
const andTxt=(n,un)=>n>0?` <span class="andm" title="Em andamento (conta 50% no avanço)">+${un==="m"?fmt0(n):fmt(n)} em andamento</span>`:"";
const qPct=q=>q.prev>0?Math.min(100,qExec(q)/q.prev*100):0;
const overall=()=>S.quant.length?S.quant.reduce((a,q)=>a+qPct(q),0)/S.quant.length:0;
function linkPct(l){
  const Q=l==="BT"?kpiItens("BT"):S.quant.filter(q=>q.id===l);
  const prev=Q.reduce((s,q)=>s+(+q.prev||0),0);return prev?Math.min(100,Q.reduce((s,q)=>s+qExec(q),0)/prev*100):0}
const mpct=m=>m.link?linkPct(m.link):Math.max(0,Math.min(100,+m.pct||0));
const linkName=l=>l==="BT"?"Rede BT (todas)":((S.quant.find(q=>q.id===l)||{}).nome||"");
const allPhotos=()=>{const out=[];S.pontos.forEach(p=>(p.fotos||[]).forEach(u=>out.push({u,cap:(p.titulo||p.tipo)+(p.data?" · "+fdate(p.data):"")})));S.log.forEach(l=>(l.fotos||[]).forEach(u=>out.push({u,cap:fdate(l.data)+" · "+l.texto})));return out};

const mapsUrl=()=>{const l=(S.obra.mapsLink||"").trim();return /^https:\/\//i.test(l)?l:"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(S.obra.coord||S.obra.local||"")};
const root=$("#root");
root.innerHTML=`<div class="app">
<header class="top"><div class="logos" id="logos"></div><div class="ttl"><div class="eye" id="eye"></div><h1 id="h1"></h1><div class="sub" id="sub"></div></div><div class="tools" id="tools"></div></header>
<section class="kpis" id="kpis"></section>
<section class="etapas"><div class="mh"><span class="lbl">Etapas da obra<span id="dragHint"></span></span><span class="lbl" id="mcount"></span></div><div class="track" id="track"></div></section>
<aside><div class="tabs" id="tabs"></div><div class="pane" id="pane"></div></aside>
<div class="mapwrap" id="map"><div class="clip"><div class="stage" id="stage"><img id="img" alt="Planta do loteamento"><svg class="net" id="net"></svg><div id="pins"></div></div></div>
 <div class="rz l" id="rzL" title="Arraste para ajustar a largura"></div><div class="rz b" id="rzB" title="Arraste para ajustar a altura"></div><div class="rz c" id="rzC" title="Arraste para ajustar"></div>
 <div class="mapbar" id="mapbar"></div>
 <div class="mapui"><button id="zin" aria-label="Aproximar">+</button><button id="zout" aria-label="Afastar">−</button><button id="zfit" aria-label="Ajustar à tela" style="font-size:14px">⤢</button></div>
 <div class="legend"><span><i style="background:#1f8a4c"></i>Executado</span><span><i style="background:#d18b16"></i>Em andamento</span><span><i style="background:#7b8794"></i>Previsto</span><span><b class="seg" style="border-color:#c2185b"></b>MT</span><span><b class="seg" style="border-color:#1565c0"></b>BT 3×50</span><span><b class="seg" style="border-color:#00897b"></b>BT 3×70</span></div>
 <div class="hint" id="hint" hidden></div>
 <div class="card" id="card" hidden></div>
</div></div>`;
const PF_URL="portfolio.html";

/* ---------- topo ---------- */
function renderHeader(){
  const lg=$("#logos");
  lg.innerHTML=(S.onLogo?`<img src="${esc(S.onLogo)}" alt="ON Engenharia">`:"")
    +(S.clienteLogo||admEd()?'<span class="sep"></span>':"")
    +(S.clienteLogo?`<img class="clogo" src="${esc(S.clienteLogo)}" alt="Logo do cliente">`:"")
    +`<a class="pflink" href="${PF_URL}" target="_blank" rel="noopener"><span><b>Portfólio ON</b>Conheça a empresa ↗</span></a>`
    +(admEd()?`<label class="slot" title="Carregar logo do cliente">${S.clienteLogo?"Trocar logo":"+ Logo do cliente"}<input type="file" accept="image/*" id="fLogo" hidden></label>${S.clienteLogo?'<button class="btn" id="bLogoX" style="padding:5px 8px">Remover</button>':""}`:"");
  if(admEd()){$("#fLogo").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const u=await upImage(f,700,true);if(u){S.clienteLogo=u;touch();renderHeader()}};
    $("#bLogoX")&&($("#bLogoX").onclick=()=>{S.clienteLogo="";touch();renderHeader()})}
  $("#eye").textContent=S.obra.projeto+" · "+(S.atualizado?"Atualizado em "+fdate(S.atualizado):"Sem medições ainda");
  $("#h1").textContent=S.obra.titulo;
  $("#sub").innerHTML=esc(S.obra.cliente)+` · <a href="${mapsUrl()}" target="_blank" rel="noopener" style="color:#9fb8cc">${esc(S.obra.local)} ↗</a>`;
  const t=$("#tools");
  const vs=`<span class="viewsw"><button class="${view==="desk"?"on":""}" data-v="desk">Desktop</button><button class="${view==="mob"?"on":""}" data-v="mob">Celular</button></span>`;
  const voltar=role!=="cliente"?`<a class="btn" href="index.html">← Obras</a>`+(window.__NEG?`<a class="btn" href="negocios.html?n=${window.__NEG}">🎫 Ticket</a>`:""):"";
  if(!canEdit){t.innerHTML=vs;bindView();return}
  t.innerHTML=voltar+vs+(role==="admin"?`<button class="btn" id="bLink">Link do cliente</button>`:"")+(edit?`${role==="admin"?'<button class="btn" id="bObra">Dados da obra</button><button class="btn" id="bPlanta">Trocar planta</button>':""}${dirty?'<span class="dirty">Alterações não salvas</span>':""}<button class="btn pri" id="bSave" ${dirty?"":"disabled"}>Salvar</button><button class="btn" id="bView">Ver como cliente</button>`:`<button class="btn pri" id="bEdit">Editar</button>`);
  bindView();
  $("#bEdit")&&($("#bEdit").onclick=()=>{edit=true;renderAll()});
  $("#bView")&&($("#bView").onclick=()=>{edit=false;placing=false;tracing=null;anchor=null;renderAll()});
  $("#bSave")&&($("#bSave").onclick=save);
  $("#bObra")&&($("#bObra").onclick=editObra);
  $("#bPlanta")&&($("#bPlanta").onclick=plantaDialog);
  $("#bLink")&&($("#bLink").onclick=()=>linkDialog());
}
function bindView(){$("#tools").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{view=b.dataset.v;lsSet("view",view);applyView()})}
function applyView(){$(".app").classList.toggle("mob",view==="mob");renderHeader();setTimeout(fit,30)}
/* Os cartões do topo somam os itens dos quantitativos de cada categoria (pelo vínculo com o mapa ou pelo nome),
   assim batem sempre com a aba Quantitativos, seja o item contado no mapa ou lançado à mão. */
const KPI_CAT={
  postes:{nome:"Postes",un:"un",autos:["postes"],re:/poste/i},
  lum:{nome:"Luminárias",un:"un",autos:["lum"],re:/lumin|ilumina/i},
  trafo:{nome:"Transformadores",un:"un",autos:["trafo"],re:/transf|trafo/i},
  MT:{nome:"Rede MT",un:"m",autos:["MT"],re:/\bMT\b|m[ée]dia tens/i},
  BT:{nome:"Rede BT",un:"m",autos:["BT50","BT70"],re:/\bBT\b|baixa tens/i}
};
function kpiItens(c){
  const cat=KPI_CAT[c];
  return S.quant.filter(q=>q.auto?cat.autos.includes(q.auto):cat.re.test(q.nome||""));
}
function renderKpis(){
  const p=overall();
  const card=c=>{const cat=KPI_CAT[c],Q=kpiItens(c);
    const v=Q.length?Q.reduce((a,q)=>a+qExec(q),0):cat.autos.reduce((a,k)=>a+mapCount(k),0);
    const vc=Q.length?Q.reduce((a,q)=>a+qConta(q),0):cat.autos.reduce((a,k)=>a+mapCount(k,false,"exec"),0),va=Q.length?Q.reduce((a,q)=>a+qAnd(q),0):cat.autos.reduce((a,k)=>a+mapCount(k,false,"and"),0);
    const prev=Q.reduce((a,q)=>a+(+q.prev||0),0);
    const pc=prev?Math.min(100,v/prev*100):0;
    return `<div class="kpi"><span class="k">${cat.nome}</span><span class="v">${cat.un==="m"?fmt0(vc):fmt(vc)}<small> / ${fmt0(prev)} ${cat.un}${andTxt(va,cat.un)}</small><span class="pc">${Math.round(pc)}%</span></span><div class="bar ${pc>=100?"full":""}"><b style="width:${pc}%"></b></div></div>`};
  $("#kpis").innerHTML=`<div class="kpi main"><span class="k">Avanço físico</span><span class="v">${Math.round(p)}<small>%</small></span><div class="bar"><b style="width:${p}%"></b></div></div>`
    +["postes","lum","trafo","MT","BT"].map(card).join("");
}
function renderEtapas(){
  const edit=admEd();
  const done=S.marcos.filter(m=>mpct(m)>=100).length;
  $("#mcount").textContent=done+" de "+S.marcos.length+" concluídas";
  $("#track").innerHTML=S.marcos.map(m=>{const pc=mpct(m),st=pc>=100?"done":pc>0?"doing":"todo";
    return `<button class="et ${st}" data-id="${m.id}" ${edit?"":'tabindex="-1" style="cursor:default"'}><span class="n">${edit?'<span class="grip" aria-hidden="true">⋮⋮ </span>':""}${esc(m.nome)}</span><span class="r"><span class="bar ${pc>=100?"full":""}"><b style="width:${pc}%"></b></span><span class="p">${Math.round(pc)}%</span></span><span class="d">${m.data?fdate(m.data):"Sem data"}${m.link?` · <span class="lk">auto: ${esc(linkName(m.link))}</span>`:""}</span></button>`}).join("")+(edit?'<button class="et add" id="mAdd">+ Etapa</button>':"");
  if(edit){$("#track").querySelectorAll(".et[data-id]").forEach(b=>{b.onclick=()=>editMarco(b.dataset.id)});$("#mAdd").onclick=()=>editMarco(null)}
  $(".app").classList.toggle("editing",edit);
  enableSort();
}
let sortReady=null,sortInst=null;
function sortLib(){if(!sortReady)sortReady=loadScript("vendor/Sortable.min.js").then(()=>window.Sortable);return sortReady}
async function enableSort(){
  if(sortInst){sortInst.destroy();sortInst=null}
  if(!admEd())return;
  try{const Sortable=await sortLib();if(!admEd())return;
    sortInst=Sortable.create($("#track"),{animation:160,draggable:".et[data-id]",filter:".add",delay:180,delayOnTouchOnly:true,forceFallback:true,fallbackOnBody:true,ghostClass:"dragging",scroll:true,scrollSensitivity:60,scrollSpeed:14,
      onEnd:()=>{const order=[...$("#track").querySelectorAll(".et[data-id]")].map(x=>x.dataset.id);const before=S.marcos.map(m=>m.id).join();
        S.marcos.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));if(S.marcos.map(m=>m.id).join()!==before){touch();toast("Ordem alterada. Clique em Salvar.")}}});
  }catch(e){toast("Não consegui ativar o arrastar das etapas.")}
}

const APR_MOD=[
 {a:"Locação e abertura de cavas",r:["Queda no mesmo nível","Esforço físico / postura","Interferências subterrâneas (cabos, água, gás)","Projeção de partículas"],m:["Sinalizar e isolar a área","Consultar a concessionária sobre redes enterradas","Usar ferramentas adequadas e em bom estado","Revezar a equipe no esforço"]},
 {a:"Implantação de postes (caminhão guindauto)",r:["Queda do poste / carga suspensa","Tombamento do equipamento","Prensamento de membros","Rede energizada próxima"],m:["Isolar o raio de giro do guindauto","Patolas/sapatas niveladas em solo firme","Sinaleiro dedicado à manobra","Manter distância segura da rede energizada"]},
 {a:"Lançamento de rede MT/BT",r:["Choque elétrico","Queda de altura","Tráfego de veículos","Rompimento de cabo sob tração"],m:["Desenergizar com bloqueio e etiquetagem","Testar ausência de tensão","Instalar aterramento temporário","Cinto paraquedista com talabarte duplo","Sinalização viária"]},
 {a:"Instalação de transformador",r:["Carga suspensa","Choque elétrico","Queda de altura"],m:["Plano de içamento","Área isolada sob a carga","Desenergizar o circuito"]},
 {a:"Iluminação pública",r:["Queda de altura","Choque elétrico"],m:["Cesto aéreo ou escada amarrada","Desenergizar o circuito de IP"]}];
const APR_EPI=["Capacete com jugular","Luva isolante (classe adequada)","Luva de vaqueta","Botina de segurança","Óculos de proteção","Cinto paraquedista","Talabarte duplo","Vestimenta antichama","Protetor auricular","Protetor solar","Colete refletivo"];
const APR_CHK=["Equipe com NR-10 em dia","Equipe com NR-35 em dia","Ferramentas e EPIs inspecionados","Previsão do tempo verificada (sem chuva/raios para trabalho em altura)","Área sinalizada e isolada","Procedimento de bloqueio disponível","Kit de primeiros socorros no local"];
let APRS=null,COLAB=null,APR_OK=null;
async function aprCarregar(){const sb=DB.sb,oid=new URLSearchParams(location.search).get("id");
  const r=await sb.from("obra_aprs").select("*").eq("obra_id",oid).order("data",{ascending:false});APR_OK=!r.error;APRS=r.data||[];
  try{const pf=await DB.meuPerfil();window.__perfilNome=pf&&(pf.nome||pf.email)||""}catch(e){}
  if(APR_OK){const c=await sb.from("colaboradores").select("*").eq("ativo",true).order("nome");COLAB=c.data||[]}}
function renderApr(pane){

function rowsToMats(rows){

  const norm=x=>String(x??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  const h=rows[0].map(norm);
  const find=re=>h.findIndex(x=>re.test(x));

  if(id<0)id=h.findIndex((x,i)=>i!==ic&&i!==iu&&i!==iq&&i!==ia);
  return body.map(r=>({id:uid(),cod:ic>=0?String(r[ic]??"").trim():"",desc:String(r[id]??"").trim(),un:iu>=0?String(r[iu]??"").trim():"",prev:iq>=0?numBR(r[iq]):0,apl:ia>=0?numBR(r[ia]):0})).filter(m=>m.desc);

/* ---------- rascunho automático ----------
   Tudo que é alterado e ainda não foi salvo fica guardado neste aparelho.
   Se a página fechar ou a internet cair, o rascunho é oferecido ao abrir a obra de novo. */
const RKEY="on.rascunho."+((DB.ctx()||{}).obraId||"x");
let rTimer=null;
function gravarRascunho(){try{localStorage.setItem(RKEY,JSON.stringify({em:Date.now(),role,S}))}catch(e){}}
function limparRascunho(){try{localStorage.removeItem(RKEY)}catch(e){}}

const uniao=(srv,loc)=>{srv=srv||[];if(!loc)return srv;const m=new Map(srv.map(x=>[x.id,x]));loc.forEach(x=>m.set(x.id,x));return[...m.values()]};
function ofertarRascunho(){
  let r=null;try{r=JSON.parse(localStorage.getItem(RKEY)||"null")}catch(e){}
  if(!r||!r.S||!canEdit)return;
  const quando=new Date(r.em).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box"><h2>Alterações não salvas</h2><p class="note">Encontramos alterações feitas neste aparelho em ${quando} que não chegaram a ser salvas (a página fechou ou a internet caiu).</p><p class="note">Recuperar coloca essas alterações de volta na tela; depois é só tocar em Salvar.</p><div class="row"><button class="btn" id="rgD">Descartar</button><button class="btn pri" id="rgR">Recuperar</button></div></div>`;
  document.body.appendChild(m);
  $("#rgD",m).onclick=()=>{limparRascunho();m.remove();toast("Rascunho descartado.")};
  $("#rgR",m).onclick=()=>{
    const R=r.S;
    const logSrv=S.log,ptSrv=S.pontos,rdSrv=S.redes;
    if(role==="admin"){Object.assign(S,R);S.pontos=uniao(ptSrv,R.pontos);S.redes=uniao(rdSrv,R.redes);S.log=logSrv}
    else{S.pontos=uniao(S.pontos,R.pontos);S.redes=uniao(S.redes,R.redes)}

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>res({im,u});im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("decode"))};im.src=u})}
async function shrink(file,max,q,png){
  const {im,u}=await loadImg(file);
  const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
  const c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
  const x=c.getContext("2d");if(!png){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  const type=png?"image/png":"image/jpeg";
  const blob=await new Promise(r=>c.toBlob(r,type,q));
  return {blob,dataUrl:()=>c.toDataURL(type,q)};
}
async function upImage(file,max,keepAlpha){
  /* Envia a foto original, sem recomprimir nem redimensionar.
     Só converte quando o navegador não exibe o formato (ex.: HEIC) ou o arquivo passa de 15 MB. */
  if(!assetsNs){toast("Envio de arquivos indisponível.");return null}
  const nativo=/^image\/(jpeg|png|webp|gif)$/.test(file.type);
  let blob=file,nome=file.name;
  if(!nativo||file.size>15*1024*1024){
    try{const s=await shrink(file,4096,.92,keepAlpha&&/png|svg|webp/.test(file.type));blob=s.blob;nome=(file.name||"foto").replace(/\.[^.]+$/,"")+".jpg"}
    catch(e){toast("Não consegui abrir essa imagem. Use JPG ou PNG (no iPhone, escolha pela galeria para converter as fotos HEIC).");return null}
  }
  try{const r=await assetsNs.upload(blob,nome);return r.url}
  catch(e){toast("Não foi possível enviar a foto: "+(e&&e.message||"tente de novo")+".");return null}
}

  const dx=e.clientX-p.x,dy=e.clientY-p.y;moved+=Math.abs(dx)+Math.abs(dy);T.x+=dx;T.y+=dy;p.x=e.clientX;p.y=e.clientY;apply()});

    if(placing&&edit&&x>=0&&y>=0&&x<=S.mapW&&y<=S.mapH){placing=false;renderMapbar();updHint();editPonto({id:uid(),x:Math.round(x),y:Math.round(y),tipo:"Poste",titulo:"",status:"executado",data:today(),nota:""},true)}
    else if(tracing&&anchor){anchor=null;renderPins();updHint()}
    else if(selId||selSeg){selId=null;selSeg=null;renderPins();showCard()}}};
wrap.addEventListener("pointerup",up);wrap.addEventListener("pointercancel",up);
function updHint(){wrap.classList.toggle("place",placing);wrap.classList.toggle("trace",!!tracing);const h=$("#hint");
  h.hidden=!(placing||tracing);h.textContent=placing?"Toque no mapa onde fica o ponto":tracing?(anchor?`${NETN[tracing]}: toque no próximo poste · toque no vazio para começar outro ramal`:`${NETN[tracing]}: toque no poste de início`):""}
new ResizeObserver(()=>{if(!wrap._fitted&&wrap.clientWidth){wrap._fitted=1;fit()}}).observe(wrap);
const appEl=$(".app");
const sw=lsGet("sidew"),mh=lsGet("maph"),mhm=lsGet("maphm");
if(sw)appEl.style.setProperty("--sidew",sw+"px");if(mh)appEl.style.setProperty("--maph",mh+"px");if(mhm)appEl.style.setProperty("--maphm",mhm+"px");
appEl.classList.toggle("mob",view==="mob");
function resizer(el,mode){
  el.addEventListener("pointerdown",e=>{e.stopPropagation();e.preventDefault();el.setPointerCapture(e.pointerId);el.classList.add("on");
    const sx=e.clientX,sy=e.clientY,mob=view==="mob";
    const w0=$("aside").getBoundingClientRect().width,h0=wrap.getBoundingClientRect().height;
    const mv=ev=>{
      if(mode!=="b"&&!mob){const w=Math.max(220,Math.min(innerWidth*.6,w0+(ev.clientX-sx)));appEl.style.setProperty("--sidew",Math.round(w)+"px");lsSet("sidew",Math.round(w))}
      if(mode!=="l"){const h=Math.max(280,Math.min(2400,h0+(ev.clientY-sy)));appEl.style.setProperty(mob?"--maphm":"--maph",Math.round(h)+"px");lsSet(mob?"maphm":"maph",Math.round(h))}};
    const end=()=>{el.classList.remove("on");el.removeEventListener("pointermove",mv);el.removeEventListener("pointerup",end);el.removeEventListener("pointercancel",end)};
    el.addEventListener("pointermove",mv);el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
  });
  el.addEventListener("dblclick",()=>{["sidew","maph","maphm"].forEach(k=>{appEl.style.removeProperty("--"+k);lsSet(k,"")});setTimeout(fit,30)});
}
resizer($("#rzL"),"l");resizer($("#rzB"),"b");resizer($("#rzC"),"c");
if(S.mapUrl)img.src=S.mapUrl;img.width=S.mapW;img.height=S.mapH;

/* ---------- salvar ---------- */
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}
async function save(){
  if(!canEdit){toast("Sem permissão para salvar.");return}
  S.atualizado=today();
  S.quant.forEach(q=>{if(q.auto)q.exec=+qExec(q).toFixed(1)});
  const b=$("#bSave");if(b){b.disabled=true;b.textContent="Salvando…"}
  try{await DB.salvar(S,Math.round(overall()*10)/10);dirty=false;limparRascunho();toast("Salvo. O link do cliente já mostra esta versão.");renderHeader()}
  catch(e){gravarRascunho();toast((navigator.onLine?"Não foi possível salvar: "+(e&&e.message||"tente novamente"):"Sem internet")+". As alterações ficaram guardadas neste aparelho; tente salvar de novo.");if(b){b.disabled=false;b.textContent="Salvar"}}
}
function linkDialog(){
  const url=DB.linkCliente(TOKEN);
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box"><h2>Link do cliente</h2><p class="note">Qualquer pessoa com este link vê a obra, sem login e sem poder alterar nada.</p><input class="search" id="lkU" readonly value="${esc(url)}"><div class="row"><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Abrir ↗</a><span style="display:flex;gap:8px"><button class="btn" id="lkX">Fechar</button><button class="btn pri" id="lkC">Copiar link</button></span></div></div>`;
  document.body.appendChild(m);$("#lkX",m).onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};
  $("#lkC",m).onclick=async()=>{try{await navigator.clipboard.writeText(url);toast("Link copiado.")}catch(e){const i=$("#lkU",m);i.select();toast("Selecione e copie o link.")}};
}
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});
canEdit=role!=="cliente";
if(canEdit)assetsNs={upload:async(blob,nome)=>({url:await DB.upload(blob,nome)})};
renderAll();
ofertarRascunho();
})();
</script>
</body>
