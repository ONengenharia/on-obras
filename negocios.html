<style>
/* Layout: faixa navy com seletor de quadro (Elétrica / Solar), quadro kanban horizontal, gaveta lateral do card com abas */
:root{
  --bg:#eef2f6;--panel:#fff;--ink:#1e2f40;--muted:#5a6f83;--line:#d6e1ea;--accent:#2f6f9f;--accent-soft:#e8f1f9;
  --navy:#1e2f40;--navy2:#2b4157;--onblue:#62a8dc;--solar:#e0a800;--solar-soft:#fff5d6;--ok:#1f8a4c;--bad:#b3261e;--warn:#b7791f;
  --f:Montserrat,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101b26;--panel:#172534;--ink:#e8f1f9;--muted:#9fb8cc;--line:#2b4157;--accent:#62a8dc;--accent-soft:#1d3a52;--navy:#0b141d;--navy2:#1e2f40;--solar-soft:#3a2f0d;--ok:#52c47f;--bad:#f2867c;--warn:#e3a94b;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px var(--f)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:flex;flex-direction:column;height:100%;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.proto{background:#fbf0dc;color:#7a5410;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:500}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--navy);color:#e8f1f9;border-radius:12px;padding:10px 14px}
.logo{width:40px;height:40px;border-radius:8px;background:var(--onblue);color:#0f1c28;display:grid;place-items:center;font-weight:800;font-size:15px}
header h1{margin:0;font-size:17px;flex:1 1 180px}header h1 small{display:block;font-size:10.5px;color:#9fb8cc;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.seg{display:inline-flex;background:var(--navy2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:#9fb8cc;font-weight:600;font-size:13px;padding:7px 13px;border-radius:7px;display:flex;gap:6px;align-items:center}
.seg button.on{background:#e8f1f9;color:#1e2f40}
.seg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.who{display:flex;gap:6px;align-items:center;font-size:12px;color:#9fb8cc}
.who select{background:var(--navy2);border:1px solid #3b5670;color:#e8f1f9;border-radius:7px;padding:6px 8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 11px;font-weight:600;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
header .btn{background:var(--navy2);border-color:#3b5670;color:#e8f1f9}header .btn.pri{background:var(--onblue);border-color:var(--onblue);color:#0f1c28}
.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input{padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);min-width:220px;flex:0 1 320px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:4px 10px;font-size:12px;font-weight:600;display:inline-flex;gap:5px;align-items:center}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.note{font-size:12px;color:var(--muted)}
.board{flex:1;min-height:0;display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;align-items:flex-start}
.col{flex:0 0 268px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:12px;display:flex;flex-direction:column;max-height:100%}
.colh{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:3px}
.colh .t{display:flex;justify-content:space-between;align-items:center;gap:6px}
.colh b{font-size:13px}.colh .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);background:var(--bg);border-radius:10px;padding:1px 7px}
.colh .resp{font-size:11px;color:var(--muted);display:flex;gap:4px;align-items:center}
.lock{font-size:10.5px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.04em}
.list{padding:8px;display:grid;gap:8px;overflow-y:auto;min-height:60px;align-content:start}
.list.over{background:var(--accent-soft)}
.card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;display:grid;gap:6px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--accent)}
.card[draggable=true]{cursor:grab}
.card h3{margin:0;font-size:13px;line-height:1.3}
.card .c{font-size:11.5px;color:var(--muted)}
.lbls{display:flex;gap:4px;flex-wrap:wrap}
.lbl{font-size:10px;font-weight:700;color:#fff;border-radius:6px;padding:2px 6px;letter-spacing:.02em}
.cf{display:flex;justify-content:space-between;align-items:center;gap:6px}
.av{display:flex}.av span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;border:2px solid var(--panel);margin-left:-6px}
.av span:first-child{margin-left:0}
.meta{display:flex;gap:8px;font-size:11px;color:var(--muted);align-items:center}
.val{font-family:var(--mono);font-size:11.5px;font-weight:500}
.tipo{font-size:10px;font-weight:700;border-radius:6px;padding:1px 6px}
.tipo.solar{background:var(--solar-soft);color:#8c6d1f}.tipo.eletrica{background:var(--accent-soft);color:var(--accent)}
.atr{color:var(--bad);font-weight:600}
/* gaveta */
.gv{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end}
.gvf{position:absolute;inset:0;background:rgba(10,16,22,.45)}
.gvp{position:relative;width:min(620px,100%);height:100%;background:var(--panel);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.25)}
.gvh{padding:14px 18px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.gvh h2{margin:0;font-size:18px}
.gvh .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.flow{display:flex;gap:3px;flex-wrap:wrap}
.flow span{font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:5px;background:var(--bg);color:var(--muted)}
.flow span.feito{background:var(--accent-soft);color:var(--accent)}.flow span.aqui{background:var(--accent);color:#fff}
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 12px}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.gvb{flex:1;overflow:auto;padding:14px 18px;display:grid;gap:14px;align-content:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{display:grid;gap:3px;font-size:11.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-size:13.5px}
.fld input:disabled,.fld select:disabled,.fld textarea:disabled{opacity:.7}
.sec{display:grid;gap:8px}.sec h4{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:4px 10px 4px 4px;font-size:12px;display:flex;gap:6px;align-items:center}
.pick button.on{border-color:var(--accent);background:var(--accent-soft)}
.pick .lb{padding:4px 10px;color:#fff;border:0;opacity:.45}.pick .lb.on{opacity:1;outline:2px solid var(--ink)}
.dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff}
.chat{display:grid;gap:10px}
.msg{display:grid;grid-template-columns:30px 1fr;gap:8px}
.msg .b{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.45}
.msg .b small{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}.msg .b small b{color:var(--ink)}
.msg.eu .b{background:var(--accent-soft);border-color:transparent}
.mention{color:var(--accent);font-weight:600}
.comp{display:flex;gap:8px;padding:10px 18px;border-top:1px solid var(--line)}
.comp textarea{flex:1;resize:none;height:44px;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.hist{display:grid;gap:8px}.hist div{font-size:12.5px;display:grid;grid-template-columns:110px 1fr;gap:8px}.hist time{font-family:var(--mono);font-size:11px;color:var(--muted)}
.anx{display:grid;gap:6px}.anx div{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px}

.banner{border-radius:8px;padding:8px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center}
.banner.ro{background:#fbf0dc;color:#7a5410}

.next{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:10px}
/* permissões */
.modal{position:fixed;inset:0;z-index:30;background:rgba(10,16,22,.55);display:grid;place-items:center;padding:16px}
.box{background:var(--panel);border-radius:12px;padding:18px;width:min(980px,100%);max-height:100%;overflow:auto;display:grid;gap:12px}
.box h2{margin:0;font-size:18px}
.mtx{overflow-x:auto}

.mtx th:first-child,.mtx td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
.mtx th{font-size:11px;color:var(--muted);font-weight:600}
.mtx select{border:1px solid var(--line);border-radius:6px;padding:3px 5px;background:var(--bg);font-size:12px}
.lv-editar{color:var(--ok);font-weight:700}.lv-ver{color:var(--muted)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mapa{height:min(64vh,620px);min-height:360px;border-radius:10px;border:1px solid var(--line);position:relative;z-index:0;isolation:isolate}
.leg{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--muted)}.leg span{display:flex;align-items:center;gap:4px}
.pinx{filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}.pinx.fraco{opacity:.75}
.pop{display:grid;gap:4px;min-width:230px;font-family:var(--f)}.pop small{color:#5a6f83}.pop .tipo{justify-self:start}
.leaflet-popup-content{margin:12px 14px}
.areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.areas a,.areas button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 12px;text-align:left;display:grid;gap:2px}
.areas a b,.areas button b{font-size:14px}.areas a small,.areas button small{font-size:11.5px;color:var(--muted)}
.areas a.on,.areas button.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 -3px 0 var(--accent)}
.outra{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.outra h2{margin:0;font-size:18px}
.og{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ocard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px;background:var(--bg)}
.gv{justify-content:center;align-items:center}
.gvp.win{position:fixed;border-radius:14px;overflow:hidden;resize:both;min-width:360px;min-height:320px;max-width:100vw;max-height:100vh;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.gvh{cursor:move;user-select:none}.gvh.arr{cursor:grabbing}
.grab{font-size:10.5px;color:var(--muted);text-align:center;letter-spacing:.02em;margin:-6px 0 -2px}
.next.go2{border-style:solid;border-color:var(--accent);background:var(--accent-soft);justify-content:space-between}
.obs textarea{min-height:90px;resize:vertical;line-height:1.5}

.rec{color:var(--bad);font-weight:700;font-size:12.5px;align-self:center;animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.35}}
.nlb{border:1px dashed var(--accent);background:none;color:var(--accent);border-radius:14px;padding:4px 10px;font-size:12px;font-weight:600}
.mwrap{flex:1;position:relative;display:flex}.mwrap textarea{flex:1}
.ment[hidden]{display:none}
.ment{position:absolute;left:0;bottom:calc(100% + 6px);width:min(320px,100%);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:4px;display:grid;gap:2px;z-index:5}

.tl li.atual::before{background:#2f6f9f;box-shadow:0 0 0 4px rgba(47,111,159,.25)}.tl li.atual b{color:#2f6f9f}.tl-de{color:var(--muted);font-size:11.5px}.tl-dt{color:var(--muted);font-size:11.5px}.tl-dur{font-size:11.5px;font-weight:600}
.fxm svg .fn rect,.fxm svg .fn polygon{fill:var(--panel);stroke:var(--line);stroke-width:1.5}.fxm svg .fn .ft{font:600 12.5px Montserrat,sans-serif;fill:var(--muted);text-anchor:middle}.fxm svg .fn .fs{font:400 10.5px Montserrat,sans-serif;fill:var(--muted);text-anchor:middle}
.fxm svg .fn.feito rect,.fxm svg .fn.feito polygon{fill:var(--ok-soft,#e2f4e9);stroke:var(--ok,#1f8a4c)}.fxm svg .fn.feito .ft{fill:var(--ok,#1f8a4c)}
.fxm svg .fn.aqui rect,.fxm svg .fn.aqui polygon{fill:#2f6f9f;stroke:#62a8dc;stroke-width:3;animation:fxp 1.6s ease-in-out infinite}.fxm svg .fn.aqui .ft,.fxm svg .fn.aqui .fs{fill:#fff}
.fxm svg .fn.aqui.perd rect{fill:#b3261e;stroke:#f2867d}.fxm svg .fh{font:700 11px Montserrat,sans-serif;fill:#2f6f9f;letter-spacing:.04em}
.fxm svg .fa{fill:none;stroke:var(--line,#d6e1ea);stroke-width:1.8}.fxm svg .fa.on{stroke:var(--ok,#1f8a4c);stroke-width:2.4}.fxm svg .fl{font:600 10.5px Montserrat,sans-serif;fill:var(--muted)}.fxm svg .fl.on{fill:var(--ok,#1f8a4c)}
@keyframes fxp{50%{stroke-width:6}}@media (prefers-reduced-motion:reduce){.fxm svg .fn.aqui rect,.fxm svg .fn.aqui polygon{animation:none}}
.card.mencao{animation:cardPisca 1.2s ease-in-out infinite;border-color:#d32f2f!important}
@keyframes cardPisca{0%,100%{box-shadow:0 0 0 0 rgba(211,47,47,.0);background-color:var(--bg)}50%{box-shadow:0 0 0 3px rgba(211,47,47,.85),0 0 18px rgba(211,47,47,.55);background-color:rgba(211,47,47,.28)}}
@media (prefers-reduced-motion:reduce){.card.mencao{animation:none;box-shadow:0 0 0 3px rgba(211,47,47,.85)}}
</style>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/global.js?v=10" defer></script>

<body>
<div class="app" id="app"><p class="note" style="padding:20px">Carregando…</p></div>
<script>
(async()=>{
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>+v?Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0}):"—";
const hojeISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fd=d=>d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}):"";
const fdt=d=>new Date(d).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3600)}
const sb=DB.sb;
const PAL=["#2f6f9f","#6a4fb3","#00897b","#c2185b","#d18b16","#5d6b78","#1f8a4c","#8c6d1f","#1565c0","#ad1457"];
const corDe=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const sigla=n=>String(n||"?").trim().split(/\s+/).filter(Boolean).slice(0,2).map(p=>p[0].toUpperCase()).join("")||"?";

/* ---------- sessão ---------- */
const sess=await DB.sessao();
if(!sess){location.href="index.html?volta="+encodeURIComponent(location.pathname);return}
const perfil=await DB.meuPerfil();
if(!perfil||perfil.papel==="pendente"){location.href="index.html";return}
const eu=perfil.id,ADM=perfil.papel==="admin";let ORCN=ADM?"admin":null;try{const r0=await sb.schema("orcarede").rpc("meu_nivel");ORCN=r0.data||null}catch(e){}let COMPRAS=ADM;try{const r=await sb.schema("orcarede").rpc("pode_compras");COMPRAS=!!r.data}catch(e){}

/* ---------- dados ---------- */
let VT=new Set(),ORCA={};let verFiltros=false,LEMB=[],verSaidos=(()=>{try{return localStorage.getItem("neg.saidos")!=="0"}catch(e){return true}})(),AREAS=[],ACESSO={},fArea="",U=[],QUADROS={},COLS=[],ETQ=[],LISTAS={tipo:[],origem:[],pagto:[],conc:[]},CARDS=[],PERM={},CRIA={},INBOX=[];
let quadro=(()=>{try{return localStorage.getItem("neg.quadro")||"eletrica"}catch(e){return"eletrica"}})();
{const qq=new URLSearchParams(location.search).get("q");if(qq==="eletrica"||qq==="solar")quadro=qq;}
let busca="",fEtq="",soMeus=false,aberto=null,abaCard="resumo",win=null,gravando=null;
const uById=id=>U.find(u=>u.id===id)||{id,nome:"(removido)",sig:"?",cor:"#999",setor:""};
const colsDe=q=>COLS.filter(c=>c.quadro===q).sort((a,b)=>a.ordem-b.ordem);
const areaDe=id=>AREAS.find(a=>a.id===id);
const veArea=(uid,area)=>{const u=uById(uid);return u.papel==="admin"||!area||!!(ACESSO[uid]&&ACESSO[uid].has(area))};
const veCol=col=>ADM||veArea(eu,(COLS.find(c=>c.id===col)||{}).area);
const fantasma=c=>{if(!ADM&&!veCol(c.coluna))return true;if(fArea){const k=COLS.find(x=>x.id===c.coluna);return!!k&&k.area!==fArea}return false};
const naoLidasCard=id=>{const L=INBOX.filter(n=>!n.lido&&n.negocio_id===id&&(n.tipo==="mencao"||n.tipo==="msg"));return{n:L.length,men:L.some(n=>n.tipo==="mencao")}};
const fimDoDia=()=>{const d=new Date();d.setHours(23,59,59,999);return d};
const lembCard=id=>LEMB.filter(l=>l.negocio_id===id&&new Date(l.quando)<=fimDoDia());
const minhasAreas=()=>AREAS.filter(a=>ADM||veArea(eu,a.id));
const etqDe=(q,id)=>ETQ.find(e=>e.id===id&&e.quadro===q);
const nivelU=(uid,col)=>{const u=uById(uid);if(u.papel==="admin")return"editar";return(PERM[uid]||{})[col]||"ver"};
const nivel=col=>ADM?"editar":!veCol(col)?"nenhum":(PERM[eu]||{})[col]||"ver";
const ehEditor=c=>!!(c&&(c.editores||[]).includes(eu));
const podeEditar=c=>ehEditor(c)||nivel(c.coluna)==="editar";
const podeMover=c=>ehEditor(c)||["editar","mover"].includes(nivel(c.coluna));
const podeCriar=q=>ADM||!!(CRIA[eu]||{})[q];

async function carregarTudo(){
  const [ra,rac]=await Promise.all([sb.from("neg_areas").select("*").order("ordem"),sb.from("neg_area_acesso").select("*")]);
  AREAS=ra.data||[];ACESSO={};(rac.data||[]).forEach(x=>{(ACESSO[x.user_id]||(ACESSO[x.user_id]=new Set())).add(x.area_id)});
  const [rp,rq,rc,re,rl,rn,rpe,rcr]=await Promise.all([
    sb.from("perfis").select("id,nome,email,papel,setor").order("nome"),
    sb.from("neg_quadros").select("*").order("ordem"),
    sb.from("neg_colunas").select("*").order("ordem"),
    sb.from("neg_etiquetas").select("*").order("nome"),
    sb.from("neg_listas").select("*").order("valor"),
    sb.from("negocios").select("*").order("ordem",{ascending:false}),
    sb.from("neg_permissoes").select("*"),
    sb.from("neg_criadores").select("*")]);
  try{const rv=await sb.from("neg_ver_todos").select("user_id");VT=new Set((rv.data||[]).map(x=>x.user_id))}catch(e){}
  if(ADM)try{const ra=await sb.schema("orcarede").from("acesso").select("user_id,nivel");ORCA={};(ra.data||[]).forEach(x=>ORCA[x.user_id]=x.nivel)}catch(e){}
  const err=[rp,rq,rc,re,rl,rn,rpe,rcr].find(r=>r.error);if(err)throw err.error;
  U=(rp.data||[]).filter(u=>u.papel!=="pendente").map(u=>({...u,nome:u.nome||u.email,sig:sigla(u.nome||u.email),cor:corDe(u.id)}));
  QUADROS={};(rq.data||[]).forEach(q=>QUADROS[q.id]=q);
  COLS=rc.data||[];ETQ=re.data||[];
  LISTAS={tipo:[],origem:[],pagto:[],conc:[]};(rl.data||[]).forEach(l=>(LISTAS[l.lista]||(LISTAS[l.lista]=[])).push(l.valor));
  CARDS=rn.data||[];
  {const {data}=await sb.from("neg_lembretes").select("id,negocio_id,para,quando,texto,feito").eq("feito",false);LEMB=data||[]}
  PERM={};(rpe.data||[]).forEach(p=>{(PERM[p.user_id]||(PERM[p.user_id]={}))[p.coluna_id]=p.nivel});
  CRIA={};(rcr.data||[]).forEach(p=>{(CRIA[p.user_id]||(CRIA[p.user_id]={}))[p.quadro]=true});
  if(!QUADROS[quadro])quadro=Object.keys(QUADROS)[0];
}
async function carregarAvisos(){const {data}=await sb.from("notificacoes").select("*").order("criado_em",{ascending:false}).limit(100);INBOX=data||[]}
async function recarregar(){await Promise.all([carregarTudo(),carregarAvisos()]);render();if(aberto&&CARDS.find(c=>c.id===aberto))abrir(aberto,true)}

/* ---------- gravação ---------- */
async function salvarCampos(c,campos){
  Object.assign(c,campos);
  const {data,error}=await sb.from("negocios").update(campos).eq("id",c.id).select().single();
  if(error){toast("Não foi possível salvar: "+error.message);await recarregar();return false}
  Object.assign(c,data);return true;
}

/* ---------- tela ---------- */
function navHtml(){return `<nav class="areas"><a href="index.html#painel"><b>🏠 Início</b><small>Painel geral</small></a><a class="on" href="negocios.html"><b>💼 Negócios</b><small>Elétrica e Solar · do comercial às compras</small></a><a href="index.html#kanban" data-aba="kanban"><b>🏗️ Obras</b><small>Obras elétricas · postes, rede, fotos, diário</small></a><a href="index.html#inicio" data-aba="inicio"><b>📍 Mapa</b><small>Todas as obras e instalações</small></a>${ADM?'<a href="orcarede.html"><b>🧮 OrçaRede</b><small>Orçamentos de rede por ponto</small></a>':""}${COMPRAS?'<a href="compras.html"><b>🛒 Compras</b><small>Previsto × realizado</small></a>':""}</nav>`}
function render(){
  const Q=QUADROS[quadro]||{nome:"",cor:"#999"},todas=colsDe(quadro),cols=todas.filter(c=>veCol(c.id)&&(!fArea||c.area===fArea));
  const mAreas=minhasAreas().filter(a=>todas.some(c=>c.area===a.id));
  const f=busca.toLowerCase();
  const vis=CARDS.filter(c=>c.quadro===quadro&&(!f||(c.titulo+" "+c.cliente+" "+c.cidade+" "+c.tipo).toLowerCase().includes(f))&&(!fEtq||c.etiquetas.includes(fEtq))&&(!soMeus||c.membros.includes(eu)||c.resp===eu));
  const nl=INBOX.filter(n=>!n.lido).length;
  const etqs=ETQ.filter(e=>e.quadro===quadro);
  $("#app").innerHTML=`${navHtml()}
  <header><img class="logo" src="assets/on-logo.jpg" alt="ON Engenharia"><h1><small>Negócios</small>Fluxo comercial e administrativo</h1>
   <div class="seg">${Object.values(QUADROS).sort((a,b)=>a.ordem-b.ordem).map(v=>`<button class="${quadro===v.id?"on":""}" data-q="${v.id}"><i style="background:${v.cor}"></i>${esc(v.nome)}</button>`).join("")}</div>
   <span class="who">${esc(perfil.nome||perfil.email)}${perfil.setor?" · "+esc(perfil.setor):""}</span>
   <button class="btn sino" id="bIn" title="Caixa de entrada">🔔 Caixa de entrada${nl?`<b class="badge ${INBOX.some(n=>!n.lido&&n.tipo==="mencao")?"pisca":""}">${nl}</b>`:""}</button>
   ${ADM?'<button class="btn" id="bCols">Colunas e etiquetas</button><button class="btn" id="bPerm">Permissões</button>':""}
   <button class="btn pri" id="bNovo" ${podeCriar(quadro)?"":"disabled title='Você não tem permissão para criar negócios neste quadro'"}>+ Novo negócio</button></header>
  <button class="btn fbtn" id="bFil">🔎 Filtros${(fArea?1:0)+(fEtq?1:0)+(soMeus?1:0)+(busca?1:0)?` <b class="badge">${(fArea?1:0)+(fEtq?1:0)+(soMeus?1:0)+(busca?1:0)}</b>`:""} <span class="note" style="margin-left:auto">${vis.filter(c=>!fantasma(c)).length} negócios</span></button>
  <div class="filtros ${verFiltros?"abre":""}">
  ${mAreas.length>1?`<div class="bar"><span class="note">Área:</span><button class="chip ${!fArea?"on":""}" data-ar="">${ADM?"Todas":"Todas as minhas"}</button>${mAreas.map(a=>`<button class="chip ${fArea===a.id?"on":""}" data-ar="${a.id}"><i style="width:9px;height:9px;border-radius:50%;background:${a.cor};display:inline-block"></i>${esc(a.nome)}</button>`).join("")}</div>`:""}
  <div class="bar"><input id="q" placeholder="Buscar negócio, cliente, cidade ou tipo" value="${esc(busca)}">
   <button class="chip ${soMeus?"on":""}" id="meus">Só os meus</button>${ADM&&!fArea?"":`<button class="chip ${verSaidos?"on":""}" id="saidos" title="Negócios que já passaram pela sua área e estão em outra">🔒 Mostrar os que já saíram</button>`}
   ${etqs.map(e=>`<button class="chip ${fEtq===e.id?"on":""}" data-e="${e.id}"><i style="width:9px;height:9px;border-radius:50%;background:${e.cor};display:inline-block"></i>${esc(e.nome)}</button>`).join("")}
   ${(()=>{const nv=vis.filter(c=>!fantasma(c));return `<span class="note" style="margin-left:auto">${nv.length} negócio${nv.length===1?"":"s"} · ${brl(nv.reduce((a,c)=>a+(+c.valor||0),0))} em carteira</span>`})()}</div></div>
  <div class="board">${cols.map(col=>{const L=vis.filter(c=>c.coluna===col.id);const nv=nivel(col.id);
    const G=verSaidos?vis.filter(c=>fantasma(c)&&c.ultima_col&&c.ultima_col[col.area]===col.id):[];
    return `<section class="col" style="--c:${col.cor}"><div class="colh"><div class="t"><b>${col.area&&areaDe(col.area)?`<span class="atag" style="--a:${areaDe(col.area).cor}">${esc(areaDe(col.area).nome)}</span>`:""}${esc(col.nome)}${col.gatilho?' <span title="Ao entrar aqui, o negócio vai para o Gerenciador de obras (Elétrica) ou para o mapa (Solar)">⚡</span>':""}</b><span class="n">${L.length}</span></div>
     <div class="resp">${brl(L.reduce((a,c)=>a+(+c.valor||0),0))}${nv==="ver"?' · <span class="lock">só leitura</span>':nv==="mover"?' · <span class="lock" style="color:var(--accent)">pode mover</span>':""}</div></div>
     <div class="list" data-col="${col.id}">${L.map(cardHtml).join("")}${G.map(cardHtml).join("")}</div></section>`}).join("")||(ADM?'<p class="note">Nenhuma coluna neste quadro. Crie em "Colunas e etiquetas".</p>':'<p class="note">Você ainda não tem acesso a nenhuma área deste quadro. Peça ao administrador para liberar.</p>')}</div>`;
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{quadro=b.dataset.q;fEtq="";try{localStorage.setItem("neg.quadro",quadro)}catch(e){}render()});
  $("#q").oninput=e=>{busca=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
  $("#bFil").onclick=()=>{verFiltros=!verFiltros;render()};
  $("#meus").onclick=()=>{soMeus=!soMeus;render()};
  if($("#saidos"))$("#saidos").onclick=()=>{verSaidos=!verSaidos;try{localStorage.setItem("neg.saidos",verSaidos?"1":"0")}catch(e){}render()};
  document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{fEtq=fEtq===b.dataset.e?"":b.dataset.e;render()});
  document.querySelectorAll("[data-ar]").forEach(b=>b.onclick=()=>{fArea=b.dataset.ar;render()});
  $("#bNovo").onclick=novo;
  $("#bIn").onclick=caixa;
  if(ADM){$("#bPerm").onclick=permissoes;$("#bCols").onclick=gerirColunas}
  document.querySelectorAll(".card").forEach(el=>{
    el.onclick=()=>{abaCard="resumo";abrir(el.dataset.id)};
    el.onkeydown=e=>{if(e.key==="Enter")el.click()};
    el.ondragstart=e=>{e.dataTransfer.setData("text/plain",el.dataset.id)};
  });
  document.querySelectorAll(".list").forEach(l=>{
    l.ondragover=e=>{e.preventDefault();l.classList.add("over")};l.ondragleave=()=>l.classList.remove("over");
    l.ondrop=e=>{e.preventDefault();l.classList.remove("over");mover(e.dataTransfer.getData("text/plain"),l.dataset.col)};
  });
}
function cardHtml(c){
  const atr=c.prazo&&new Date(c.prazo+"T23:59:00")<new Date();
  const nl=naoLidasCard(c.id),lb=lembCard(c.id),fant=fantasma(c);
  const onde=fant?(()=>{const col=COLS.find(x=>x.id===c.coluna);const a=col&&areaDe(col.area);return(a?a.nome+" · ":"")+(col?col.nome:"outra etapa")})():"";
  return `<article class="card ${fant?"fantasma":""} ${nl.men?"mencao":""}" data-id="${c.id}" draggable="${!fant&&podeMover(c)}" tabindex="0">${nl.n?`<span class="cdot ${nl.men?"men":""}" title="${nl.n} mensagem(ns) não lida(s)${nl.men?" · você foi mencionado":""}">${nl.n}</span>`:""}
   ${fant?`<span class="onde">🔒 Em ${esc(onde)}</span>`:""}
   ${c.etiquetas.length?`<div class="lbls">${c.etiquetas.map(i=>{const e=etqDe(c.quadro,i);return e?`<span class="lbl" style="background:${e.cor}">${esc(e.nome)}</span>`:""}).join("")}</div>`:""}
   <h3>${esc(c.titulo)}</h3><div class="c">${esc(c.cliente||"Sem cliente")}${c.cidade?" · "+esc(c.cidade):""}${c.tipo?` · ${esc(c.tipo)}`:""}${c.pot?` · ${esc(c.pot)} ${esc(c.un||"")}`:""}</div>
   <div class="cf"><span class="val">${brl(c.valor)}</span><div class="meta">${lb.length?`<span class="lbadge ${lb.some(l=>new Date(l.quando)<new Date())?"atr2":""}" title="${esc(lb.map(l=>l.texto).join(" · "))}">⏰ ${lb.length}</span>`:""}${c.prazo?`<span class="${atr?"atr":""}">📅 ${fd(c.prazo)}</span>`:""}</div></div>
   <div class="cf"><div class="av">${c.membros.map(m=>{const u=uById(m);return `<span style="background:${u.cor}" title="${esc(u.nome)}">${u.sig}</span>`}).join("")}</div>${c.obra_id?'<span class="tipo eletrica">⚡ No Gerenciador</span>':c.no_mapa?'<span class="tipo solar">📍 No mapa</span>':""}</div></article>`;
}

/* ---------- mover e enviar ao Gerenciador ---------- */
async function mover(id,col,ok){
  const c=CARDS.find(x=>x.id===id);if(!c||c.coluna===col)return;
  if(!podeMover(c)){toast("Você só visualiza esta etapa. Peça a quem é responsável por ela para mover.");return}
  const alvo=COLS.find(x=>x.id===col);
  const jaFoi=c.quadro==="solar"?c.no_mapa:!!c.obra_id;
  if(alvo.gatilho&&!ok&&!jaFoi){
    const m=document.createElement("div");m.className="modal";
    m.innerHTML=`<div class="box" style="width:min(520px,100%)"><h2>${c.quadro==="solar"?"Adicionar ao mapa de obras?":"Enviar para o Gerenciador de obras?"}</h2>
     <p style="margin:0;line-height:1.5">${c.quadro==="solar"?`<b>${esc(c.titulo)}</b> vai para <b>${esc(alvo.nome)}</b> e passará a aparecer como ponto no mapa de obras.`:`<b>${esc(c.titulo)}</b> vai para <b>${esc(alvo.nome)}</b> e será criada como <b>obra nova no Gerenciador de obras</b>, com cliente, cidade, tipo, concessionária e link do Maps do card.`}</p>
     <p class="note" style="margin:0">Faça isso só com o negócio fechado. Use as etiquetas <b>Liberado para comprar</b> ou <b>Aguardando recurso</b> para indicar se já pode comprar material.</p>
     <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn" id="n0">Cancelar</button><button class="btn" id="n2">Só mover, sem enviar</button><button class="btn pri" id="n1">${c.quadro==="solar"?"Mover e adicionar":"Mover e enviar"}</button></div></div>`;
    document.body.appendChild(m);
    $("#n0",m).onclick=()=>{m.remove();render()};
    $("#n2",m).onclick=()=>{m.remove();mover(id,col,"so")};
    $("#n1",m).onclick=()=>{m.remove();mover(id,col,"envia")};return;
  }
  const antes=c.coluna;c.coluna=col;render();
  const {error}=await sb.from("negocios").update({coluna:col}).eq("id",id);
  if(error){c.coluna=antes;render();toast("Não foi possível mover: "+error.message);return}
  if(ok==="envia"){

async function subirArquivo(negId,blob,nome){
  const ext=(/\.[a-z0-9]{1,5}$/i.test(nome)?nome.split(".").pop():"bin").toLowerCase();
  const path=negId+"/"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+"."+ext;
  const {error}=await sb.storage.from("negocios").upload(path,blob,{contentType:blob.type||"application/octet-stream"});
  if(error)throw error;
  return sb.storage.from("negocios").getPublicUrl(path).data.publicUrl;
}

function coordsDe(txt){
  if(!txt)return null;const pats=[/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/,/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,/[?&](?:q|query|ll|center|destination)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i,/^\s*(-?\d{1,2}\.\d+)\s*[,;]\s*(-?\d{1,3}\.\d+)\s*$/];
  for(const p of pats){const m=String(txt).match(p);if(m)return{lat:+m[1],lng:+m[2]}}return null;
}
async function resolverLink(url){try{const {data}=await sb.functions.invoke("resolver-link",{body:{url}});return data&&data.lat!=null?{lat:+data.lat,lng:+data.lng}:null}catch(e){return null}}

function janela(el){
  const vw=innerWidth,vh=innerHeight;
  if(!win){const w=Math.min(820,vw-16),h=Math.min(Math.round(vh*.9),vh-16);win={w,h,x:Math.round((vw-w)/2),y:Math.round((vh-h)/2)}}
  win.w=Math.min(win.w,vw);win.h=Math.min(win.h,vh);
  win.x=Math.max(0,Math.min(win.x,vw-80));win.y=Math.max(0,Math.min(win.y,vh-60));
  Object.assign(el.style,{left:win.x+"px",top:win.y+"px",width:win.w+"px",height:win.h+"px"});
  new ResizeObserver(()=>{if(el.isConnected&&el.offsetWidth>100){win.w=el.offsetWidth;win.h=el.offsetHeight}}).observe(el);
  const h=$(".gvh",el);
  h.onpointerdown=e=>{if(e.target.closest("button,select,input,textarea,a,label"))return;e.preventDefault();const sx=e.clientX-win.x,sy=e.clientY-win.y;h.setPointerCapture(e.pointerId);h.classList.add("arr");
    h.onpointermove=ev=>{win.x=Math.max(0,Math.min(ev.clientX-sx,innerWidth-80));win.y=Math.max(0,Math.min(ev.clientY-sy,innerHeight-60));el.style.left=win.x+"px";el.style.top=win.y+"px"};
    h.onpointerup=()=>{h.onpointermove=null;h.classList.remove("arr")}};
  h.ondblclick=e=>{if(e.target.closest("button,select,input,textarea,a"))return;win=null;janela(el)};
}

  const pick=k=>{const a=alvo();if(!a)return;const u=lista[k];const fim=tx.selectionStart;tx.value=tx.value.slice(0,a.ini)+"@"+u.nome+" "+tx.value.slice(fim);const p=a.ini+u.nome.length+2;tx.setSelectionRange(p,p);box.hidden=true;tx.focus()};
  tx.addEventListener("input",()=>{sel=0;draw()});tx.addEventListener("click",draw);
  tx.addEventListener("keydown",e=>{if(box.hidden)return;if(e.key==="ArrowDown"){sel=(sel+1)%lista.length;draw();e.preventDefault()}else if(e.key==="ArrowUp"){sel=(sel-1+lista.length)%lista.length;draw();e.preventDefault()}else if(e.key==="Enter"||e.key==="Tab"){pick(sel);e.preventDefault();e.stopImmediatePropagation()}else if(e.key==="Escape"){box.hidden=true}});
  tx.addEventListener("blur",()=>setTimeout(()=>box.hidden=true,150));
}

async function importarTrello(f){
  let d;try{d=JSON.parse(await f.text())}catch(e){toast("Arquivo inválido: não é um JSON do Trello.");return}
  if(!d||!Array.isArray(d.lists)||!Array.isArray(d.cards)){toast("Esse JSON não parece ser um quadro exportado do Trello.");return}
  const CORES={green:"#4bce97",yellow:"#e2b203",orange:"#fea362",red:"#f87168",purple:"#9f8fef",blue:"#579dff",sky:"#6cc3e0",lime:"#94c748",pink:"#e774bb",black:"#8590a2"};
  const ESC={green:"#216e4e",yellow:"#946f00",orange:"#a54800",red:"#ae2e24",purple:"#5e4db2",blue:"#0055cc",lime:"#4c6b1f",black:"#44546f"};
  const cor=c=>{if(!c)return"#8590a2";const b=c.split("_")[0];return c.endsWith("_dark")?(ESC[b]||CORES[b]||"#8590a2"):(CORES[b]||"#8590a2")};
  const cap=t=>{t=(t||"").trim();return t===t.toUpperCase()?t.charAt(0)+t.slice(1).toLowerCase():t};
  const guess=n=>{n=n.toLowerCase();if(/compra/.test(n))return"compras";if(/financ|contrato|adm|pagamento|fatur/.test(n))return"adm";if(/drone|levant|projeto|or[cç]a|an[aá]lise|engenh/.test(n))return"engenharia";if(/negoc|proposta|prospec|comercial|lead/.test(n))return"comercial";if(/obra|vistoria|instala|finaliz|pend[eê]ncia|homolog|execu/.test(n))return"obras";return""};
  const temArea=id=>AREAS.some(a=>a.id===id);
  const cards=d.cards.filter(c=>!c.closed);
  const usadas=new Set(cards.map(c=>c.idList));
  const lists=d.lists.filter(l=>usadas.has(l.id)).sort((a,b)=>a.pos-b.pos);
  const LI={};lists.forEach((l,i)=>LI[l.id]=i);
  const etqs=[],EI={},vis={};
  (d.labels||[]).forEach(l=>{if(!l.name)return;const k=l.name.trim().toLowerCase();if(!(k in vis)){vis[k]=etqs.length;etqs.push({nome:cap(l.name),cor:cor(l.color)})}EI[l.id]=vis[k]});
  const mem={};(d.members||[]).forEach(x=>mem[x.id]=x.fullName);
  const porCard={};(d.actions||[]).filter(a=>a.type==="commentCard").forEach(a=>{(porCard[a.data.card.id]=porCard[a.data.card.id]||[]).push({autor:a.memberCreator?a.memberCreator.fullName:"Trello",texto:a.data.text.replace(/!\[[^\]]*\]\(https:\/\/trello\.com[^)]*\)/g,"[imagem no Trello]").trim(),data:a.date})});
  const total=desc=>{const m=(desc||"").match(/Total\s*:?\s*R\$\s*([\d.\s]+,\d{2})/i);return m?+m[1].replace(/[.\s]/g,"").replace(",","."):null};
  const payload={quadro,cols:lists.map(l=>{const a=guess(l.name);return{nome:cap(l.name),area:temArea(a)?a:"",cor:(areaDe(a)||{}).cor||"#8590a2"}}),etqs,
    cards:cards.map(c=>{const m=(c.desc||"").match(/Concession[aá]ria:\s*([^\n]+)/i);return{col:LI[c.idList],ordem:c.pos,titulo:c.name.trim(),cliente:c.name.trim().replace(/^(\d+_|P\d+\s*-\s*)/,"").trim(),conc:m?m[1].trim():"",valor:total(c.desc),
      obs:((c.desc||"").trim()?(c.desc||"").trim()+"\n\n":"")+"Importado do Trello: "+c.shortUrl,chave:c.shortLink,etq:[...new Set((c.labels||[]).map(x=>EI[x.id]).filter(x=>x!=null))],
      membros:(c.idMembers||[]).map(i=>(mem[i]||"").split(" ")[0]).filter(Boolean),criado:new Date(parseInt(c.id.slice(0,8),16)*1000).toISOString(),atualizado:c.dateLastActivity,
      anexos:(c.attachments||[]).map(a=>({nome:a.name,tipo:a.mimeType||"",tam:a.bytes||0,url:a.url,data:a.date})),msgs:(porCard[c.id]||[]).reverse()}})};
  const cont=lists.map((l,i)=>`<li><b>${esc(cap(l.name))}</b> · ${payload.cards.filter(c=>c.col===i).length} cartão(ões) · área: ${esc((areaDe(payload.cols[i].area)||{nome:"todas"}).nome)}</li>`).join("");
  const nm=payload.cards.reduce((a,c)=>a+c.msgs.length,0),na=payload.cards.reduce((a,c)=>a+c.anexos.length,0);
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" style="width:min(640px,100%)"><h2>Importar “${esc(d.name||"Trello")}” no quadro ${esc(QUADROS[quadro].nome)}</h2>
   <p class="note" style="margin:0">${payload.cards.length} cartões · ${etqs.length} etiquetas · ${nm} comentários · ${na} anexos. Listas com o mesmo nome de uma coluna existente são reaproveitadas; as outras viram colunas novas no fim do quadro. A área de cada coluna foi sugerida pelo nome — dá para trocar depois em Colunas e etiquetas.</p>
   <ul style="margin:0;padding-left:18px;font-size:13px;line-height:1.7;max-height:260px;overflow:auto">${cont}</ul>
   <p class="note" style="margin:0">Os anexos ficam como link para o Trello (abrem com o login do Trello). Ninguém recebe notificação pela importação. O Trello só exporta as últimas 1000 ações, então comentários muito antigos podem não vir.</p>
   <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="x">Cancelar</button><button class="btn pri" id="go">Importar</button></div></div>`;
  document.body.appendChild(m);
  $("#x",m).onclick=()=>m.remove();
  $("#go",m).onclick=async()=>{const b=$("#go",m);b.disabled=true;b.textContent="Importando…";
    const {data,error}=await sb.rpc("importar_trello",{p:payload});
    if(error){b.disabled=false;b.textContent="Importar";toast("Erro: "+error.message);return}
    m.remove();toast(`Importado: ${data.negocios} negócios, ${data.colunas} colunas novas, ${data.mensagens} comentários, ${data.anexos} anexos${data.pulados?` (${data.pulados} já existiam)`:""}.`);
    await carregarTudo();render()};
}

    m.querySelectorAll("select[data-u]").forEach(s=>s.onchange=async()=>{const u=s.dataset.u,c=s.dataset.c,v=s.value;
      const r=v==="ver"?await sb.from("neg_permissoes").delete().eq("user_id",u).eq("coluna_id",c):await sb.from("neg_permissoes").upsert({user_id:u,coluna_id:c,nivel:v});
      if(r.error){toast(r.error.message);return}(PERM[u]||(PERM[u]={}))[c]=v;s.className="lv-"+v});
    m.querySelectorAll("[data-pa]").forEach(x=>x.onchange=async()=>{const u=x.dataset.pa,a=x.dataset.aa;const r=x.checked?await sb.from("neg_area_acesso").upsert({user_id:u,area_id:a}):await sb.from("neg_area_acesso").delete().eq("user_id",u).eq("area_id",a);if(r.error){toast(r.error.message);x.checked=!x.checked;return}const st=ACESSO[u]||(ACESSO[u]=new Set());x.checked?st.add(a):st.delete(a);draw()});
    m.querySelectorAll("[data-orc]").forEach(x=>x.onchange=async()=>{const u=x.dataset.orc,v=x.value;const O2=sb.schema("orcarede");const r=v?await O2.from("acesso").upsert({user_id:u,nivel:v,atualizado_em:new Date().toISOString()}):await O2.from("acesso").delete().eq("user_id",u);if(r.error){toast(r.error.message);return}if(v)ORCA[u]=v;else delete ORCA[u];toast(v?`OrçaRede: ${v==="ver"?"só ver":"pode editar"}.`:"Sem acesso ao OrçaRede.")});
    m.querySelectorAll("[data-vt]").forEach(x=>x.onchange=async()=>{const u=x.dataset.vt;const r=x.checked?await sb.from("neg_ver_todos").upsert({user_id:u}):await sb.from("neg_ver_todos").delete().eq("user_id",u);if(r.error){toast(r.error.message);x.checked=!x.checked;return}x.checked?VT.add(u):VT.delete(u);toast(x.checked?"Agora vê todos os cards.":"Agora vê só os próprios cards.")});
    m.querySelectorAll("[data-cr]").forEach(x=>x.onchange=async()=>{const u=x.dataset.cr;const r=x.checked?await sb.from("neg_criadores").upsert({user_id:u,quadro}):await sb.from("neg_criadores").delete().eq("user_id",u).eq("quadro",quadro);if(r.error){toast(r.error.message);x.checked=!x.checked;return}(CRIA[u]||(CRIA[u]={}))[quadro]=x.checked});
    $("#ok",m).onclick=async()=>{m.remove();await recarregar()};};
  draw();document.body.appendChild(m);m.onclick=async e=>{if(e.target===m){m.remove();await recarregar()}};
}
function caixa(){
  const ic={chegou:"📥",mencao:"💬",msg:"✉️",adicionado:"👤"};
  fechar();
  const g=document.createElement("div");g.className="gv lado";
  const draw=()=>{const nl=INBOX.filter(n=>!n.lido).length;
    g.innerHTML=`<div class="gvf"></div><aside class="gvp" style="width:min(460px,100%)"><div class="gvh" style="cursor:default"><div class="row"><div><h2>Caixa de entrada</h2><span class="note">${nl} não lida${nl===1?"":"s"}</span></div><button class="btn" id="x">Fechar</button></div>${nl?'<button class="btn" id="todas" style="justify-self:start">Marcar todas como lidas</button>':""}</div>
     <div class="gvb">${INBOX.length?INBOX.map(n=>`<button class="ib ${n.lido?"":"nl"}" data-n="${n.id}"><span class="ii">${ic[n.tipo]||"•"}</span><span><span class="it">${esc(n.texto)}</span><small>${fdt(n.criado_em)}</small></span></button>`).join(""):'<p class="note">Nada por aqui. Quando um negócio chegar numa etapa sua, alguém te mencionar com @ ou te adicionar num card, aparece aqui.</p>'}</div></aside>`;
    $(".gvf",g).onclick=$("#x",g).onclick=()=>{g.remove();render()};
    if($("#todas",g))$("#todas",g).onclick=async()=>{await sb.from("notificacoes").update({lido:true}).eq("lido",false);INBOX.forEach(n=>n.lido=true);draw()};
    g.querySelectorAll("[data-n]").forEach(b=>b.onclick=async()=>{const n=INBOX.find(x=>x.id===b.dataset.n);if(!n.lido){n.lido=true;sb.from("notificacoes").update({lido:true}).eq("id",n.id)}
      const c=CARDS.find(k=>k.id===n.negocio_id);g.remove();if(c){quadro=c.quadro;abaCard=n.tipo==="mencao"||n.tipo==="msg"?"chat":"resumo";render();abrir(c.id)}else{render();toast("Este negócio não existe mais.")}});
  };
  draw();document.body.appendChild(g);
}

/* ---------- início ---------- */
try{await recarregar()}catch(e){$("#app").innerHTML=`<div class="erro"><h1>Não foi possível carregar</h1><p>${esc(e.message||e)}</p><a href="index.html">Voltar</a></div>`;return}
const abrirId=new URLSearchParams(location.search).get("n");if(abrirId&&CARDS.find(c=>c.id===abrirId)){const c=CARDS.find(x=>x.id===abrirId);quadro=c.quadro;render();abrir(abrirId)}
setInterval(async()=>{if(document.hidden||document.querySelector(".modal"))return;const ab=aberto,aba=abaCard;try{await carregarTudo();await carregarAvisos()}catch(e){return}if(!document.querySelector(".gv"))render();else{const b=$("#bIn");if(b){const nl=INBOX.filter(n=>!n.lido).length;b.innerHTML="🔔 Caixa de entrada"+(nl?`<b class="badge ${INBOX.some(n=>!n.lido&&n.tipo==="mencao")?"pisca":""}">${nl}</b>`:"")}}},25000);
window.addEventListener("on:notif",async()=>{try{await carregarAvisos()}catch(e){return}if(!document.querySelector(".gv")&&!document.querySelector(".modal"))render();else{const b=$("#bIn");if(b){const nl=INBOX.filter(n=>!n.lido).length;b.innerHTML="🔔 Caixa de entrada"+(nl?`<b class="badge ${INBOX.some(n=>!n.lido&&n.tipo==="mencao")?"pisca":""}">${nl}</b>`:"")}}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.querySelector(".gv")&&!document.querySelector(".modal"))fechar()});
})();
</script>
