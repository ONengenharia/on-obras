<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Obras · ON Engenharia</title>
<link rel="icon" href="assets/on-logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: faixa navy no topo; quadro kanban com 4 colunas que rolam na horizontal no celular */
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#1e2f40; --muted:#5a6f83; --line:#d6e1ea;
  --accent:#2f6f9f; --accent-soft:#e8f1f9; --navy:#1e2f40; --navy2:#2b4157; --onblue:#62a8dc;
  --ok:#1f8a4c; --warn:#b7791f; --bad:#b3261e;
  --f-body:Montserrat,system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101b26; --panel:#172534; --ink:#e8f1f9; --muted:#9fb8cc; --line:#2b4157;
  --accent:#62a8dc; --accent-soft:#1d3a52; --navy:#0b141d; --navy2:#1e2f40; --ok:#52c47f; --warn:#e3a94b; --bad:#f2867c; color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--navy);color:#e8f1f9;border-radius:12px;padding:12px 16px}
header img{height:42px;border-radius:4px;display:block}
header h1{margin:0;font-size:18px;font-weight:700;flex:1 1 200px}
header h1 small{display:block;font-size:11px;font-weight:500;color:#9fb8cc;letter-spacing:.06em;text-transform:uppercase}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 12px;font-weight:600;font-size:12.5px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.del{color:var(--bad)}
header .btn{background:var(--navy2);border-color:#3b5670;color:#e8f1f9}
header .btn.pri{background:var(--onblue);border-color:var(--onblue);color:#0f1c28}
.who{font-size:12px;color:#9fb8cc}
.board{display:grid;gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:200px}
.colh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px}
.colh b{font-size:13px}
.colh span{font-family:var(--f-mono);font-size:12px;color:var(--muted);background:var(--bg);border-radius:10px;padding:1px 8px}
.list{display:grid;gap:8px;padding:10px;min-height:80px;align-content:start;flex:1}
.cardo{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:7px;cursor:pointer;text-align:left}
.cardo:hover{border-color:var(--accent)}
.cardo h3{margin:0;font-size:13.5px;line-height:1.3}
.cardo .c{font-size:12px;color:var(--muted)}
.cardo .r{display:flex;align-items:center;gap:8px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}
.bar>b{display:block;height:100%;background:var(--accent)}
.bar.full>b{background:var(--ok)}
.pc{font-family:var(--f-mono);font-size:12px;font-weight:500;min-width:38px;text-align:right}
.cardo .ft{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:12px}
.empty{color:var(--muted);font-size:12.5px;text-align:center;padding:10px}
.sortable-ghost{opacity:.35}
/* login */
.login{max-width:380px;margin:10vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:grid;gap:14px}
.login img{height:64px;border-radius:6px;justify-self:start}
.login h1{margin:0;font-size:20px}
.fld{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.fld input,.fld select{padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-size:14px}
.msg{font-size:12.5px;color:var(--bad);min-height:1em}
.note{font-size:12px;color:var(--muted);margin:0;line-height:1.45}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,16,22,.55);display:grid;place-items:center;padding:16px;z-index:1000}
.box{background:var(--panel);border-radius:12px;padding:18px;width:min(520px,100%);display:grid;gap:12px;max-height:100%;overflow:auto}
.box h2{margin:0;font-size:18px}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.ulist{display:grid;gap:6px}
.urow{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:8px 10px;flex-wrap:wrap}
.urow b{font-size:13px}.urow small{display:block;color:var(--muted);font-size:11.5px}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:8px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.ck{display:flex;gap:8px;align-items:center;font-size:13.5px}
.ck input{width:18px;height:18px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#e8f1f9;padding:9px 14px;border-radius:7px;font-size:13px;z-index:50;max-width:calc(100% - 32px);text-align:center;z-index:1100}
.filt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filt input{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);min-width:220px;flex:1;max-width:360px}

.abas{display:flex;gap:4px;background:var(--navy2);border-radius:9px;padding:3px}
.abas button{border:0;background:none;color:#9fb8cc;font-weight:600;font-size:13px;padding:7px 14px;border-radius:7px}
.abas button.on{background:#e8f1f9;color:#1e2f40}
.abalink{color:#9fb8cc;font-weight:600;font-size:13px;padding:7px 14px;border-radius:7px;text-decoration:none;display:flex;gap:6px;align-items:center}
.abalink:hover{background:#3b5670;color:#e8f1f9}
.nbadge{background:#b3261e;color:#fff;border-radius:9px;font-size:10.5px;padding:1px 6px}
.resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kp{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.kp span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kp b{font-size:24px;font-variant-numeric:tabular-nums}
.kp small{font-size:12px;color:var(--muted)}
button.kp{text-align:left;font:inherit;color:inherit;cursor:pointer}
button.kp:hover{border-color:var(--c)}
.kp.sel{background:var(--accent-soft);outline:2px solid var(--c)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.seg2 button{border:0;background:var(--panel);padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg2 button.on{background:var(--accent);color:#fff}
.kp.main{background:var(--accent);border-color:var(--accent);color:#fff}.kp.main span,.kp.main small{color:#e8f1f9}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:5px 11px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.mapabox{position:relative;z-index:0;isolation:isolate;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#mapa{height:min(62vh,620px);min-height:360px}
.pinsol{filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.pino span{display:grid;place-items:center;width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.pino b{transform:rotate(45deg);color:#fff;font:700 11px/1 var(--f-mono)}
.pop{display:grid;gap:5px;min-width:220px;font-family:var(--f-body)}.pop small{color:#5a6f83}.pop .r{display:flex;gap:8px;align-items:center}
.leaflet-popup-content{margin:12px 14px}
.sem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.sem h2{margin:0;font-size:14px}
.semlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.semi{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.semi i{width:10px;height:10px;border-radius:50%;flex:none}.semi small{display:block;color:var(--muted);font-size:11.5px}
.col{border-top:4px solid var(--c,#8a96a3)}
.tp{justify-self:start;display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--t);border:1px solid var(--t);border-radius:8px;padding:1px 7px}
.crow{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.crow input[data-nome],.inp{flex:1;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.crow input[type=color]{width:34px;height:30px;border:0;padding:0;background:none}
.clist{display:grid;gap:6px}
.lnk:disabled{opacity:.3;cursor:default}
.minimapa{position:relative;z-index:0;isolation:isolate;height:240px;border-radius:8px;border:1px solid var(--line)}
.gaveta{position:fixed;inset:0;z-index:900}
.gfundo{position:absolute;inset:0;background:rgba(10,16,22,.45)}
.gpainel{position:absolute;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);box-shadow:-10px 0 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 18px}
.gtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.gtop h2{margin:4px 0 2px;font-size:18px}
.gacoes{display:flex;gap:6px;flex-wrap:wrap}
.gsub{margin:6px 0 0;font-size:14px}
.comp{display:grid;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.comp textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:8px;background:var(--panel);color:var(--ink);resize:vertical}
.anx{display:flex;flex-wrap:wrap;gap:6px}.ax{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 8px}
.notas{display:grid;gap:10px}
.nota{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.nh{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted)}.nh b{color:var(--ink);font-size:13px}
.nota p{margin:0;white-space:pre-wrap;line-height:1.5;font-size:13.5px}
.nanx{display:flex;flex-wrap:wrap;gap:6px}.nanx img{width:84px;height:84px;object-fit:cover;border-radius:6px;display:block}
.arq{font-size:12.5px;color:var(--accent);font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:5px 8px}
@media (max-width:720px){.abas{order:3;width:100%}.abas button{flex:1}}
@media (max-width:720px){.board{grid-auto-flow:column;grid-template-columns:none!important;grid-auto-columns:82vw;scroll-snap-type:x mandatory}.col{scroll-snap-align:start}}
.nlbls{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px}.nlbls span{color:#fff;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 7px}
.nref{font-size:11.5px;color:var(--muted);margin:3px 0}.nref a{color:var(--accent);font-weight:700;text-decoration:none}
.pn{display:grid;gap:14px}
.pn-hi{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.pn-hi h2{margin:0;font-size:22px}.pn-hi p{margin:2px 0 0;text-transform:none}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mod{position:relative;display:grid;gap:2px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--m);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}
.mod:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.12)}
.mi{font-size:22px}.mt{font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.mb{font-size:32px;font-weight:800;line-height:1.1}.ms{font-size:12.5px;color:var(--muted)}
.mbar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}.mbar b{display:block;height:100%;background:var(--ok)}
.pn-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcx{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.pcx h3{margin:0 0 4px;font-size:15px}.pcx h4{margin:8px 0 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pcx-k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pk{background:var(--bg);border-radius:10px;padding:10px;text-decoration:none;color:var(--ink);display:grid}.pk b{font-size:24px}.pk span{font-size:11.5px;color:var(--muted)}
.li{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:13px}.li:hover{background:var(--accent-soft)}
.li small{display:block;color:var(--muted);font-size:11.5px}.li .lq{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}.li.atr .lq{color:var(--bad);font-weight:700}
.li .ob{flex:1;min-width:0}.li > span:not(.lq){flex:1;min-width:0}
.fl{display:grid;grid-template-columns:minmax(110px,1.3fr) 2fr 26px 90px;gap:8px;align-items:center;text-decoration:none;color:var(--ink);font-size:12.5px;padding:3px 0}
.fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fn i{font-style:normal;font-size:9.5px;font-weight:700;color:var(--a);border:1px solid var(--a);border-radius:5px;padding:0 4px;margin-left:5px;text-transform:uppercase}
.fb{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.fb b{display:block;height:100%;border-radius:5px;min-width:2px}
.fq{font-weight:700;text-align:right}.fv{font-size:11.5px;color:var(--muted);text-align:right}
@media (max-width:900px){.mods{grid-template-columns:1fr 1fr}.pn-grid{grid-template-columns:1fr}}
@media (max-width:520px){.fl{grid-template-columns:1fr 1fr 22px}.fv{display:none}.mb{font-size:26px}}
</style>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/Sortable.min.js"></script>

<body>
<div id="app"></div>
<script>
(async()=>{
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fdate=d=>{if(!d)return"";const x=new Date(d);return x.toLocaleDateString("pt-BR")};
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}
const sb=DB.sb;
let perfil=null,obras=[],filtro="";

async function inicio(){
  const s=await DB.sessao();
  if(!s)return telaLogin();
  perfil=await DB.meuPerfil();
  if(!perfil){toast("Perfil não encontrado.");await sb.auth.signOut();return telaLogin()}
  if(perfil.papel==="pendente"){$("#app").innerHTML=`<div class="login"><img src="assets/on-logo.png" alt="ON Engenharia"><h1>Cadastro aguardando liberação</h1><p class="note">Sua conta (${esc(perfil.email||"")}) foi criada, mas ainda precisa ser liberada por um administrador da ON Engenharia. Avise o administrador e entre de novo depois.</p><button class="btn" id="bS">Sair</button></div>`;$("#bS").onclick=async()=>{await sb.auth.signOut();telaLogin()};return}
  if(window.ON_LINK_TIPO==="invite"||window.ON_LINK_TIPO==="recovery"){const t=window.ON_LINK_TIPO;window.ON_LINK_TIPO="";history.replaceState(null,"",location.pathname);await carregar();novaSenha(t==="invite");return}
  const volta=new URLSearchParams(location.search).get("volta");
  if(volta&&/^\/[^/]/.test(volta)){location.href=volta;return}
  await carregar();
}

/* ---------- login ---------- */
function telaLogin(modo){
  modo=modo||"entrar";
  $("#app").innerHTML=`<form class="login" id="fl"><img src="assets/on-logo.png" alt="ON Engenharia"><h1>${modo==="entrar"?"Entrar no gerenciador de obras":"Primeiro acesso"}</h1>
   ${modo==="primeiro"?'<p class="note">Use apenas na primeira vez, para criar o administrador. Os executores são cadastrados depois, pelo administrador.</p><label class="fld">Seu nome<input id="lN" required autocomplete="name"></label>':""}
   <label class="fld">E-mail<input id="lE" type="email" required autocomplete="email"></label>
   <label class="fld">Senha<input id="lS" type="password" required minlength="6" autocomplete="${modo==="entrar"?"current-password":"new-password"}"></label>
   <div class="msg" id="lM"></div>
   <button class="btn pri" style="justify-content:center;padding:11px">${modo==="entrar"?"Entrar":"Criar administrador"}</button>
   <div class="row"><button type="button" class="lnk" id="lAlt">${modo==="entrar"?"Primeiro acesso":"Já tenho conta"}</button>${modo==="entrar"?'<button type="button" class="lnk" id="lEsq">Esqueci a senha</button>':""}</div></form>`;
  $("#lAlt").onclick=()=>telaLogin(modo==="entrar"?"primeiro":"entrar");
  const esq=$("#lEsq");if(esq)esq.onclick=async()=>{const e=$("#lE").value.trim();if(!e){$("#lM").textContent="Digite seu e-mail acima e toque de novo em Esqueci a senha.";return}
    const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});$("#lM").textContent=error?error.message:"Enviamos um e-mail com o link para criar uma nova senha."};
  $("#fl").onsubmit=async ev=>{ev.preventDefault();const b=ev.submitter;b.disabled=true;$("#lM").textContent="";
    const email=$("#lE").value.trim(),password=$("#lS").value;
    try{
      if(modo==="entrar"){const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw new Error(error.message.includes("Invalid")?"E-mail ou senha incorretos.":error.message.includes("confirm")?"Confirme o e-mail pelo link que enviamos antes de entrar.":error.message)}
      else{const {data,error}=await sb.auth.signUp({email,password,options:{data:{nome:$("#lN").value.trim()},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
        if(!data.session){$("#lM").style.color="var(--ok)";$("#lM").textContent="Conta criada. Abra o e-mail que enviamos e confirme o endereço; depois entre com sua senha.";b.disabled=false;return}}
      inicio();
    }catch(e){$("#lM").textContent=e.message||String(e);b.disabled=false}};
}
sb.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY"&&!window.ON_LINK_TIPO)novaSenha()});
function novaSenha(conv){
  modal(conv?"Bem-vindo! Crie sua senha":"Criar nova senha",(conv?'<p class="note">Você foi convidado para o sistema da ON Engenharia. Crie uma senha para entrar das próximas vezes.</p>':"")+`<label class="fld">Nova senha<input id="nS" type="password" minlength="6" required></label>`,async m=>{const {error}=await sb.auth.updateUser({password:$("#nS",m).value});if(error){toast(error.message);return false}toast("Senha alterada.");inicio()})
}

/* ---------- dados ---------- */

async function mover(ev){
  const id=ev.item.dataset.id,col=ev.to.dataset.col;
  const irmaos=[...ev.to.querySelectorAll(".cardo")].map(x=>x.dataset.id);
  const idx=irmaos.indexOf(id);
  const ord=i=>{const o=obras.find(x=>x.id===irmaos[i]);return o?+o.ordem:null};
  const antes=idx>0?ord(idx-1):null,depois=idx<irmaos.length-1?ord(idx+1):null;
  const nova=antes==null&&depois==null?Date.now()/1000:antes==null?depois-1:depois==null?antes+1:(antes+depois)/2;
  const o=obras.find(x=>x.id===id);const old={coluna:o.coluna,ordem:o.ordem};o.coluna=col;o.ordem=nova;
  const {error}=await sb.from("obras").update({coluna:col,ordem:nova}).eq("id",id);
  if(error){Object.assign(o,old);toast("Não foi possível mover: "+error.message)}
  obras.sort((a,b)=>a.ordem-b.ordem);renderKanban();

async function subir(obraId,file){
  const ext=(/\.[a-z0-9]{1,5}$/i.test(file.name)?file.name.split(".").pop():"bin").toLowerCase();
  const path=obraId+"/notas/"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+"."+ext;
  const {error}=await sb.storage.from(ON_CONFIG.bucket).upload(path,file,{contentType:file.type||"application/octet-stream"});
  if(error)throw error;
  return {nome:file.name,tipo:file.type||"",tam:file.size,url:sb.storage.from(ON_CONFIG.bucket).getPublicUrl(path).data.publicUrl};
}

async function usuarios(){
  const {data:us}=await sb.from("perfis").select("*").order("nome");
  const m=modal("Usuários",`<div class="ulist">${(us||[]).map(u=>`<div class="urow"><div><b>${esc(u.nome||"(sem nome)")}</b><small>${esc(u.email||"")}${u.setor?" · "+esc(u.setor):""}</small></div><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag" ${u.papel==="pendente"?'style="background:#fbf0dc;color:#b7791f"':""}>${u.papel==="admin"?"Administrador":u.papel==="pendente"?"Aguardando liberação":"Usuário"}</span>${u.id!==perfil.id?`<button type="button" class="lnk" data-st="${u.id}">Setor</button><button type="button" class="lnk" data-s="${u.id}">Definir senha</button><button type="button" class="lnk" data-r="${esc(u.email||"")}">Enviar link de senha</button>${u.papel==="pendente"?`<button type="button" class="lnk" data-p="${u.id}" data-v="pendente">Liberar</button>`:`<button type="button" class="lnk" data-p="${u.id}" data-v="${u.papel}">${u.papel==="admin"?"Tirar admin":"Tornar admin"}</button>`}<button type="button" class="lnk" style="color:var(--bad)" data-d="${u.id}">Excluir</button>`:""}</span></div>`).join("")}</div>
   <p class="note">Esqueceram a senha? Use <b>Definir senha</b> para colocar uma nova na hora e passe para a pessoa, ou <b>Enviar link de senha</b> para ela criar sozinha pelo e-mail. Por segurança, o sistema não guarda senhas de forma legível.</p>
   <h2 style="font-size:15px;margin-top:6px">Convidar usuário</h2>
   <label class="fld">Nome<input id="uN"></label><label class="fld">E-mail<input id="uE" type="email"></label>
   <label class="fld">Setor<input id="uT" list="setL" placeholder="Ex.: Comercial"><datalist id="setL">${SETORES_SUG.map(x=>`<option value="${x}">`).join("")}</datalist></label>
   <label class="fld">Perfil<select id="uP"><option value="executor">Usuário (permissões definidas por você)</option><option value="admin">Administrador (acesso total)</option></select></label>
   <label class="ck" style="font-size:13px"><input type="checkbox" id="uSc"> Cadastrar com senha inicial, sem e-mail</label>
   <label class="fld" id="uSw" hidden>Senha inicial (mín. 6)<input id="uS" type="text" minlength="6"></label>
   <div class="row"><span class="note" id="uMsg">A pessoa recebe um e-mail para criar a própria senha.</span><button type="button" class="btn pri" id="uAdd">Enviar convite</button></div>`);
  $("#uSc",m).onchange=e=>{$("#uSw",m).hidden=!e.target.checked;$("#uAdd",m).textContent=e.target.checked?"Cadastrar":"Enviar convite";$("#uMsg",m).textContent=e.target.checked?"Passe o e-mail e a senha para a pessoa entrar.":"A pessoa recebe um e-mail para criar a própria senha."};
  $("#uAdd",m).onclick=async()=>{const comSenha=$("#uSc",m).checked;const b=$("#uAdd",m);b.disabled=true;
    try{await chamarUsuarios({acao:comSenha?"criar":"convidar",nome:$("#uN",m).value,email:$("#uE",m).value,senha:$("#uS",m).value,setor:$("#uT",m).value,papel:$("#uP",m).value});toast(comSenha?"Usuário cadastrado.":"Convite enviado por e-mail.");m.remove();usuarios()}catch(e){toast(e.message);b.disabled=false}};
  m.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{modal("Definir senha",`<label class="fld">Nova senha (mín. 6)<input id="nS" type="text" minlength="6" required></label><p class="note">Passe a senha para a pessoa. Ela pode trocar depois em "Esqueci a senha".</p>`,async x=>{try{await chamarUsuarios({acao:"senha",id:b.dataset.s,senha:$("#nS",x).value});toast("Senha definida.")}catch(e){toast(e.message);return false}})});
  m.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{try{await chamarUsuarios({acao:"reenviar",email:b.dataset.r});toast("Link enviado para "+b.dataset.r+".")}catch(e){toast(e.message)}});
  m.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{const u=us.find(x=>x.id===b.dataset.st);modal("Setor de "+(u.nome||u.email),`<label class="fld">Setor<input id="sT" list="setL2" value="${esc(u.setor||"")}"><datalist id="setL2">${SETORES_SUG.map(x=>`<option value="${x}">`).join("")}</datalist></label>`,async x=>{const {error}=await sb.from("perfis").update({setor:$("#sT",x).value.trim()}).eq("id",u.id);if(error){toast(error.message);return false}m.remove();usuarios()})});
  m.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{const novo=b.dataset.v==="executor"?"admin":"executor";const {error}=await sb.from("perfis").update({papel:novo}).eq("id",b.dataset.p);if(error){toast(error.message);return}m.remove();usuarios()});
  m.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(!b.dataset.c){b.dataset.c=1;b.textContent="Confirmar exclusão";return}try{await chamarUsuarios({acao:"excluir",id:b.dataset.d});toast("Usuário excluído.");m.remove();usuarios()}catch(e){toast(e.message)}});
}

inicio();
})();
</script>
</body>
</html>
