<style>
/* Layout: faixa navy no topo; quadro kanban com 4 colunas que rolam na horizontal no celular */
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#1e2f40; --muted:#5a6f83; --line:#d6e1ea;
  --accent:#2f6f9f; --accent-soft:#e8f1f9; --navy:#1e2f40; --navy2:#2b4157; --onblue:#62a8dc;
  --ok:#1f8a4c; --warn:#b7791f; --bad:#b3261e;
  --f-body:Montserrat,system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#101b26; --panel:#172534; --ink:#e8f1f9; --muted:#9fb8cc; --line:#2b4157;
  --accent:#62a8dc; --accent-soft:#1d3a52; --navy:#0b141d; --navy2:#1e2f40; --ok:#52c47f; --warn:#e3a94b; --bad:#f2867c; color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--navy);color:#e8f1f9;border-radius:12px;padding:12px 16px}

.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:8px 12px;font-weight:600;font-size:12.5px;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.del{color:var(--bad)}
header .btn{background:var(--navy2);border-color:#3b5670;color:#e8f1f9}

.who{font-size:12px;color:#9fb8cc}
.board{display:grid;gap:12px;overflow-x:auto;padding-bottom:6px;align-items:start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:200px}

.cardo{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:7px;cursor:pointer;text-align:left}

.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}

.kp.main{background:var(--accent);border-color:var(--accent);color:#fff}.kp.main span,.kp.main small{color:#e8f1f9}

.comp{display:grid;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}

.anx{display:flex;flex-wrap:wrap;gap:6px}.ax{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 8px}

.fl{display:grid;grid-template-columns:minmax(110px,1.3fr) 2fr 26px 90px;gap:8px;align-items:center;text-decoration:none;color:var(--ink);font-size:12.5px;padding:3px 0}
.fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fn i{font-style:normal;font-size:9.5px;font-weight:700;color:var(--a);border:1px solid var(--a);border-radius:5px;padding:0 4px;margin-left:5px;text-transform:uppercase}

<body>
<div id="app"></div>
<script>
(async()=>{
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fdate=d=>{if(!d)return"";const x=new Date(d);return x.toLocaleDateString("pt-BR")};
function toast(t){document.querySelectorAll(".toast").forEach(x=>x.remove());const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}
const sb=DB.sb;
let perfil=null,obras=[],filtro="";

async function inicio(){
  const s=await DB.sessao();
  if(!s)return telaLogin();
  perfil=await DB.meuPerfil();
  if(!perfil){toast("Perfil não encontrado.");await sb.auth.signOut();return telaLogin()}
  if(perfil.papel==="pendente"){$("#app").innerHTML=`<div class="login"><img src="assets/on-logo.png" alt="ON Engenharia"><h1>Cadastro aguardando liberação</h1><p class="note">Sua conta (${esc(perfil.email||"")}) foi criada, mas ainda precisa ser liberada por um administrador da ON Engenharia. Avise o administrador e entre de novo depois.</p><button class="btn" id="bS">Sair</button></div>`;$("#bS").onclick=async()=>{await sb.auth.signOut();telaLogin()};return}
  if(window.ON_LINK_TIPO==="invite"||window.ON_LINK_TIPO==="recovery"){const t=window.ON_LINK_TIPO;window.ON_LINK_TIPO="";history.replaceState(null,"",location.pathname);await carregar();novaSenha(t==="invite");return}
  const volta=new URLSearchParams(location.search).get("volta");
  if(volta&&/^\/[^/]/.test(volta)){location.href=volta;return}
  await carregar();
}

/* ---------- login ---------- */
function telaLogin(modo){
  modo=modo||"entrar";
  $("#app").innerHTML=`<form class="login" id="fl"><img src="assets/on-logo.png" alt="ON Engenharia"><h1>${modo==="entrar"?"Entrar no gerenciador de obras":"Primeiro acesso"}</h1>
   ${modo==="primeiro"?'<p class="note">Use apenas na primeira vez, para criar o administrador. Os executores são cadastrados depois, pelo administrador.</p><label class="fld">Seu nome<input id="lN" required autocomplete="name"></label>':""}
   <label class="fld">E-mail<input id="lE" type="email" required autocomplete="email"></label>
   <label class="fld">Senha<input id="lS" type="password" required minlength="6" autocomplete="${modo==="entrar"?"current-password":"new-password"}"></label>
   <div class="msg" id="lM"></div>
   <button class="btn pri" style="justify-content:center;padding:11px">${modo==="entrar"?"Entrar":"Criar administrador"}</button>
   <div class="row"><button type="button" class="lnk" id="lAlt">${modo==="entrar"?"Primeiro acesso":"Já tenho conta"}</button>${modo==="entrar"?'<button type="button" class="lnk" id="lEsq">Esqueci a senha</button>':""}</div></form>`;
  $("#lAlt").onclick=()=>telaLogin(modo==="entrar"?"primeiro":"entrar");
  const esq=$("#lEsq");if(esq)esq.onclick=async()=>{const e=$("#lE").value.trim();if(!e){$("#lM").textContent="Digite seu e-mail acima e toque de novo em Esqueci a senha.";return}
    const {error}=await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});$("#lM").textContent=error?error.message:"Enviamos um e-mail com o link para criar uma nova senha."};
  $("#fl").onsubmit=async ev=>{ev.preventDefault();const b=ev.submitter;b.disabled=true;$("#lM").textContent="";
    const email=$("#lE").value.trim(),password=$("#lS").value;
    try{
      if(modo==="entrar"){const {error}=await sb.auth.signInWithPassword({email,password});if(error)throw new Error(error.message.includes("Invalid")?"E-mail ou senha incorretos.":error.message.includes("confirm")?"Confirme o e-mail pelo link que enviamos antes de entrar.":error.message)}
      else{const {data,error}=await sb.auth.signUp({email,password,options:{data:{nome:$("#lN").value.trim()},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;
        if(!data.session){$("#lM").style.color="var(--ok)";$("#lM").textContent="Conta criada. Abra o e-mail que enviamos e confirme o endereço; depois entre com sua senha.";b.disabled=false;return}}
      inicio();
    }catch(e){$("#lM").textContent=e.message||String(e);b.disabled=false}};
}
sb.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY"&&!window.ON_LINK_TIPO)novaSenha()});
function novaSenha(conv){
  modal(conv?"Bem-vindo! Crie sua senha":"Criar nova senha",(conv?'<p class="note">Você foi convidado para o sistema da ON Engenharia. Crie uma senha para entrar das próximas vezes.</p>':"")+`<label class="fld">Nova senha<input id="nS" type="password" minlength="6" required></label>`,async m=>{const {error}=await sb.auth.updateUser({password:$("#nS",m).value});if(error){toast(error.message);return false}toast("Senha alterada.");inicio()})
}

/* ---------- dados ---------- */
let fCol="",corPor=(()=>{try{return localStorage.getItem("on.cor")||"coluna"}catch(e){return"coluna"}})();
let colunas=[],aba=(()=>{try{return"painel"}catch(e){return"painel"}})(),fTipo="",mapa=null,camadaPinos=null;
{const hA=location.hash.replace("#","");if(["kanban","inicio","painel","equipe"].includes(hA))aba=hA;}
const TIPOS_SUG=["Loteamento","Rede urbana","Rede rural","Subestação","Medição em MT","Usina fotovoltaica","Instalação MT/BT","Manutenção","Outro"];
const PAL=["#2f6f9f","#d18b16","#1f8a4c","#c2185b","#6a4fb3","#00897b","#b3261e","#5d6b78","#8c6d1f","#1565c0"];
function corTipo(t){if(!t)return"#8a96a3";let h=0;for(const c of t.toLowerCase())h=(h*31+c.charCodeAt(0))>>>0;const i=TIPOS_SUG.findIndex(x=>x.toLowerCase()===t.toLowerCase());return PAL[(i>=0?i:h)%PAL.length]}
function coordsDe(txt){
  if(!txt)return null;txt=String(txt);
  const pats=[/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/,/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,/[?&](?:q|query|ll|center|destination)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i,/^\s*(-?\d{1,2}\.\d+)\s*[,;]\s*(-?\d{1,3}\.\d+)\s*$/];
  for(const p of pats){const m=txt.match(p);if(m){const a=+m[1],b=+m[2];if(Math.abs(a)<=90&&Math.abs(b)<=180)return{lat:a,lng:b}}}
  return null;
}
async function resolverLink(url){
  try{const {data,error}=await sb.functions.invoke("resolver-link",{body:{url}});if(error||!data||data.lat==null)return null;return{lat:+data.lat,lng:+data.lng}}catch(e){return null}
}
async function autoLocalizar(){
  if(!ADM())return;
  const pend=obras.filter(o=>o.lat==null&&o.mapsLink&&/^https:/.test(o.mapsLink)&&!coordsDe(o.mapsLink));
  let mudou=false;
  for(const o of pend){const c=await resolverLink(o.mapsLink);if(!c)continue;
    const {error}=await sb.from("obras").update({lat:c.lat,lng:c.lng}).eq("id",o.id);if(!error){o.lat=c.lat;o.lng=c.lng;mudou=true}}
  if(mudou&&aba==="inicio")render();
}
const SOL_SVG=`<svg width="38" height="48" viewBox="0 0 50 62" aria-hidden="true"><path d="M25 61 C25 61 4 36 4 22 A21 21 0 1 1 46 22 C46 36 25 61 25 61 Z" fill="#e0a800" stroke="#fff" stroke-width="3"/><g transform="translate(6.5 7) scale(1.15)"><path d="M3 15 L7 5 L25 5 L29 15 Z" fill="#1e3a5f" stroke="#fff" stroke-width="1.3" stroke-linejoin="round"/><path d="M9 5 L7.7 15 M14.3 5 L13.7 15 M19.7 5 L20.3 15 M25 5 L26.3 15 M5 10 L27 10" stroke="#fff" stroke-width="1"/><path d="M14 15 L14 20 M18 15 L18 20 M11 20 L21 20" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="26" cy="0" r="3" fill="#ffd54f" stroke="#fff" stroke-width="1"/></g></svg>`;
const posObra=o=>o.lat!=null&&o.lng!=null?{lat:+o.lat,lng:+o.lng}:coordsDe(o.mapsLink);
const nomeCol=id=>(colunas.find(c=>c.id===id)||{}).nome||"";
const corCol=id=>(colunas.find(c=>c.id===id)||{}).cor||"#8a96a3";
const corPino=o=>corPor==="tipo"?corTipo(o.tipo):corCol(o.coluna);

let negs={},etqs={};
async function carregar(){
  const [rc,ro]=await Promise.all([
    sb.from("colunas").select("*").order("ordem"),

async function mover(ev){
  const id=ev.item.dataset.id,col=ev.to.dataset.col;
  const irmaos=[...ev.to.querySelectorAll(".cardo")].map(x=>x.dataset.id);
  const idx=irmaos.indexOf(id);
  const ord=i=>{const o=obras.find(x=>x.id===irmaos[i]);return o?+o.ordem:null};
  const antes=idx>0?ord(idx-1):null,depois=idx<irmaos.length-1?ord(idx+1):null;
  const nova=antes==null&&depois==null?Date.now()/1000:antes==null?depois-1:depois==null?antes+1:(antes+depois)/2;
  const o=obras.find(x=>x.id===id);const old={coluna:o.coluna,ordem:o.ordem};o.coluna=col;o.ordem=nova;
  const {error}=await sb.from("obras").update({coluna:col,ordem:nova}).eq("id",id);
  if(error){Object.assign(o,old);toast("Não foi possível mover: "+error.message)}
  obras.sort((a,b)=>a.ordem-b.ordem);renderKanban();
}
function gerirColunas(){

  const m=modal("Colunas do kanban",`<p class="note">Renomeie, mude a cor ou a ordem. Só dá para excluir coluna vazia.</p><div class="clist" id="cl">${lista()}</div><div class="row"><input class="inp" id="cN" placeholder="Nome da nova coluna" style="flex:1"><button type="button" class="btn pri" id="cAdd">+ Coluna</button></div>`);
  const salvarCol=async(c,v)=>{const {error}=await sb.from("colunas").update(v).eq("id",c.id);if(error){toast(error.message);return}Object.assign(c,v)};
  const bind=()=>{
    m.querySelectorAll(".crow").forEach(r=>{const c=colunas.find(x=>x.id===r.dataset.c);
      r.querySelector("[data-nome]").onchange=e=>{const n=e.target.value.trim();if(n)salvarCol(c,{nome:n})};
      r.querySelector("[data-cor]").onchange=e=>salvarCol(c,{cor:e.target.value});
      const troca=async d=>{const i=colunas.indexOf(c),j=i+d;if(j<0||j>=colunas.length)return;const o=colunas[j];const a=c.ordem,b=o.ordem;await salvarCol(c,{ordem:b});await salvarCol(o,{ordem:a===b?a+d:a});colunas.sort((x,y)=>x.ordem-y.ordem);$("#cl",m).innerHTML=lista();bind()};
      r.querySelector("[data-up]").onclick=()=>troca(-1);r.querySelector("[data-dn]").onclick=()=>troca(1);
      r.querySelector("[data-del]").onclick=async()=>{const n=obras.filter(o=>o.coluna===c.id).length;if(n){toast(`Mova as ${n} obra(s) desta coluna antes de excluir.`);return}
        const {error}=await sb.from("colunas").delete().eq("id",c.id);if(error){toast(error.message);return}colunas=colunas.filter(x=>x!==c);$("#cl",m).innerHTML=lista();bind()}});
  };bind();
  $("#cAdd",m).onclick=async()=>{const nome=$("#cN",m).value.trim();if(!nome)return;const ordem=(colunas.length?Math.max(...colunas.map(c=>+c.ordem)):0)+1;
    const {data,error}=await sb.from("colunas").insert({nome,ordem,cor:PAL[colunas.length%PAL.length]}).select().single();if(error){toast(error.message);return}
    colunas.push(data);$("#cN",m).value="";$("#cl",m).innerHTML=lista();bind()};
  const fechar=()=>{if(aba==="kanban")renderKanban()};
  $("#mC",m).addEventListener("click",fechar);m.addEventListener("click",e=>{if(e.target===m)fechar()});
}

/* ---------- mural interno ---------- */
async function mural(o){
  if(!o)return;
  document.querySelectorAll(".gaveta").forEach(x=>x.remove());
  const g=document.createElement("div");g.className="gaveta";
  g.innerHTML=`<div class="gfundo"></div><aside class="gpainel" role="dialog" aria-label="Mural da obra">
   <div class="gtop"><div>${o.tipo?`<span class="tp" style="--t:${corTipo(o.tipo)}">${esc(o.tipo)}</span>`:""}<h2>${esc(o.titulo)}</h2><p class="note">${esc(o.cliente||"")}${o.local?" · "+esc(o.local):""} · ${esc(nomeCol(o.coluna))} · ${Math.round(+o.avanco||0)}%</p></div><button class="lnk" id="gX" aria-label="Fechar" style="font-size:20px">×</button></div>
   <div class="gacoes"><a class="btn pri" href="obra.html?id=${o.id}">Abrir painel da obra →</a>${o.negocio?`<a class="btn" href="negocios.html?n=${o.negocio}">💼 Ver negócio</a>`:""}${ADM()?'<button class="btn" id="gE">Editar</button><button class="btn" id="gL">Link do cliente</button>':""}${posObra(o)?`<a class="btn" target="_blank" rel="noopener" href="${esc(o.mapsLink&&/^https:/.test(o.mapsLink)?o.mapsLink:`https://www.google.com/maps?q=${posObra(o).lat},${posObra(o).lng}`)}">Google Maps ↗</a>`:""}</div>
   <h3 class="gsub">Mural interno <span class="note">· só a equipe vê, o cliente não</span></h3>
   <form class="comp" id="gF"><textarea id="gT" placeholder="Escreva um recado, decisão, pendência…" rows="3"></textarea><div id="gA" class="anx"></div>
    <div class="row"><label class="btn" style="position:relative;overflow:hidden">Anexar<input type="file" multiple id="gU" style="position:absolute;inset:0;opacity:0"></label><button class="btn pri" id="gS">Publicar</button></div></form>
   <div id="gN" class="notas"><p class="note">Carregando…</p></div></aside>`;
  document.body.appendChild(g);
  const fechar=()=>g.remove();$("#gX",g).onclick=fechar;$(".gfundo",g).onclick=fechar;
  document.addEventListener("keydown",function k(e){if(e.key==="Escape"){fechar();document.removeEventListener("keydown",k)}});
  if(ADM()){$("#gE",g).onclick=()=>editarObra(o);$("#gL",g).onclick=()=>linkObra(o)}
  let pend=[];
  const drawPend=()=>{$("#gA",g).innerHTML=pend.map((a,i)=>`<span class="ax">${esc(a.nome)} <button type="button" class="lnk" data-rm="${i}">×</button></span>`).join("");g.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{pend.splice(+b.dataset.rm,1);drawPend()})};
  $("#gU",g).onchange=async e=>{const fs=[...e.target.files];e.target.value="";for(const f of fs){toast("Enviando "+f.name+"…");try{pend.push(await subir(o.id,f))}catch(err){toast(f.name+": "+(err.message||"falha no envio"))}}drawPend();toast(fs.length+" arquivo(s) pronto(s) para publicar.")};
  const carregarNotas=async()=>{
    const {data,error}=await sb.from("obra_notas").select("*").eq("obra_id",o.id).order("criado_em",{ascending:false});
    if(error){$("#gN",g).innerHTML=`<p class="note">Erro: ${esc(error.message)}</p>`;return}
    $("#gN",g).innerHTML=data.length?data.map(n=>`<article class="nota"><div class="nh"><b>${esc(n.autor_nome||"—")}</b><span>${new Date(n.criado_em).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}</span>${(ADM()||n.autor===perfil.id)?`<button class="lnk" data-nd="${n.id}" style="color:var(--bad);margin-left:auto">Excluir</button>`:""}</div>${n.texto?`<p>${esc(n.texto)}</p>`:""}${(n.anexos||[]).length?`<div class="nanx">${n.anexos.map(a=>/^image\//.test(a.tipo||"")?`<a href="${esc(a.url)}" target="_blank" rel="noopener"><img src="${esc(a.url)}" alt="${esc(a.nome)}"></a>`:`<a class="arq" href="${esc(a.url)}" target="_blank" rel="noopener">📎 ${esc(a.nome)}</a>`).join("")}</div>`:""}</article>`).join(""):'<p class="note">Nada no mural ainda. Use o campo acima para registrar recados, decisões e pendências da obra.</p>';
    g.querySelectorAll("[data-nd]").forEach(b=>b.onclick=async()=>{if(!b.dataset.c){b.dataset.c=1;b.textContent="Confirmar";return}const {error}=await sb.from("obra_notas").delete().eq("id",b.dataset.nd);if(error){toast(error.message);return}carregarNotas()});
  };
  $("#gF",g).onsubmit=async e=>{e.preventDefault();const texto=$("#gT",g).value.trim();if(!texto&&!pend.length){toast("Escreva algo ou anexe um arquivo.");return}
    const b=$("#gS",g);b.disabled=true;const {error}=await sb.from("obra_notas").insert({obra_id:o.id,texto,anexos:pend});b.disabled=false;
    if(error){toast("Não foi possível publicar: "+error.message);return}$("#gT",g).value="";pend=[];drawPend();carregarNotas()};
  carregarNotas();
}
async function subir(obraId,file){
  const ext=(/\.[a-z0-9]{1,5}$/i.test(file.name)?file.name.split(".").pop():"bin").toLowerCase();
  const path=obraId+"/notas/"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)+"."+ext;
  const {error}=await sb.storage.from(ON_CONFIG.bucket).upload(path,file,{contentType:file.type||"application/octet-stream"});
  if(error)throw error;
  return {nome:file.name,tipo:file.type||"",tam:file.size,url:sb.storage.from(ON_CONFIG.bucket).getPublicUrl(path).data.publicUrl};
}

/* ---------- modais ---------- */
function modal(titulo,html,ok,extra){
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<form class="box"><h2>${esc(titulo)}</h2>${html}<div class="row">${extra?`<button type="button" class="btn del" id="mX">${esc(extra.label)}</button>`:"<span></span>"}<span style="display:flex;gap:8px"><button type="button" class="btn" id="mC">${ok?"Cancelar":"Fechar"}</button>${ok?'<button class="btn pri">Salvar</button>':""}</span></div></form>`;
  document.body.appendChild(m);
  $("#mC",m).onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};
  if(extra)$("#mX",m).onclick=async()=>{if(await extra.fn(m)!==false)m.remove()};
  $("form",m).onsubmit=async e=>{e.preventDefault();if(!ok)return;const b=e.submitter;b.disabled=true;const r=await ok(m);if(r===false){b.disabled=false;return}m.remove()};
  return m;
}
function editarObra(o){
  const novo=!o;o=o||{titulo:"",cliente:"",local:"",coluna:(colunas[0]||{}).id,tipo:"",lat:null,lng:null};
  const pos=posObra(o);
  const m=modal(novo?"Nova obra":"Editar obra",`<label class="fld">Nome da obra<input id="oT" required value="${esc(o.titulo)}" placeholder="Ex.: Loteamento Jardim – Etapa 01"></label>
   <label class="fld">Tipo de obra<input id="oY" list="tiposL" value="${esc(o.tipo||"")}" placeholder="Ex.: Loteamento"><datalist id="tiposL">${[...new Set([...TIPOS_SUG,...obras.map(x=>x.tipo).filter(Boolean)])].map(t=>`<option value="${esc(t)}">`).join("")}</datalist></label>
   <label class="fld">Cliente<input id="oC" value="${esc(o.cliente)}"></label>
   <label class="fld">Cidade / endereço<input id="oL" value="${esc(o.local)}"></label>
   <label class="fld">Coluna<select id="oK">${colunas.map(c=>`<option value="${c.id}" ${c.id===o.coluna?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></label>
   <label class="fld">Localização: cole o link do Google Maps ou as coordenadas<input id="oG" placeholder="https://www.google.com/maps/@-28.63,-53.60,15z  ou  -28.63, -53.60" value="${esc(o.mapsLink||(pos?pos.lat.toFixed(6)+", "+pos.lng.toFixed(6):""))}"></label>
   <p class="note" id="oGm">É o mesmo link do painel da obra: alterar aqui altera lá. Também dá para tocar no mapa para marcar o ponto exato.</p>
   <div id="oMap" class="minimapa"></div>
   ${novo?'<p class="note">Depois de criar, abra o painel da obra para carregar a planta, os quantitativos e a lista de material.</p>':""}`,
  async m=>{const g=$("#oG",m).value.trim();const link=/^https:/i.test(g)?g:"";
    let c=m._ponto||coordsDe(g);
    if(!c&&link){toast("Buscando a localização do link…");c=await resolverLink(link)}
    if(g&&!c&&!link){toast("Não encontrei coordenadas nesse texto. Cole o link do Google Maps ou marque no mapa.");return false}
    if(link&&!c)toast("Link salvo, mas não consegui ler o ponto. Marque no mapa para a obra aparecer na tela inicial.");
    const v={titulo:$("#oT",m).value.trim(),tipo:$("#oY",m).value.trim(),cliente:$("#oC",m).value.trim(),local:$("#oL",m).value.trim(),coluna:$("#oK",m).value,lat:c?c.lat:null,lng:c?c.lng:null};
    if(novo){const d=DB.DADOS_PADRAO();d.obra.mapsLink=link;v.dados=d;v.ordem=Date.now()/1000;const {data,error}=await sb.from("obras").insert(v).select("id").single();if(error){toast(error.message);return false}toast("Obra criada.");location.href="obra.html?id="+data.id;return}
    if(link!==(o.mapsLink||"")){const r=await sb.from("obras").select("dados").eq("id",o.id).single();if(!r.error){const d=r.data.dados||{};d.obra=Object.assign({},d.obra||{},{mapsLink:link});v.dados=d}}
    const {error}=await sb.from("obras").update(v).eq("id",o.id);if(error){toast(error.message);return false}delete v.dados;Object.assign(o,v,{mapsLink:link});render();toast("Obra atualizada.")},
  novo?null:{label:"Excluir obra",fn:async m=>{
    if(!m.dataset.conf){m.dataset.conf=1;$("#mX",m).textContent="Toque de novo para excluir de vez";return false}
    const {error}=await sb.from("obras").delete().eq("id",o.id);if(error){toast(error.message);return false}obras=obras.filter(x=>x.id!==o.id);document.querySelectorAll(".gaveta").forEach(x=>x.remove());render();toast("Obra excluída.")}});
  setTimeout(()=>{
    const mm=L.map($("#oMap",m));L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(mm);
    let mk=null;const por=(lat,lng,mover)=>{if(mk)mk.setLatLng([lat,lng]);else mk=L.marker([lat,lng]).addTo(mm);if(mover)mm.setView([lat,lng],Math.max(mm.getZoom()||0,14))};
    if(!pos&&o.mapsLink)$("#oG",m).onchange({target:$("#oG",m)});
    if(pos){mm.setView([pos.lat,pos.lng],14);por(pos.lat,pos.lng)}else{const p=obras.map(posObra).filter(Boolean);p.length?mm.fitBounds(p.map(x=>[x.lat,x.lng]),{maxZoom:12,padding:[20,20]}):mm.setView([-28.6,-53.5],7)}
    mm.on("click",e=>{por(e.latlng.lat,e.latlng.lng);m._ponto={lat:e.latlng.lat,lng:e.latlng.lng};$("#oGm",m).textContent="Ponto marcado no mapa ("+e.latlng.lat.toFixed(5)+", "+e.latlng.lng.toFixed(5)+"). O link continua salvo para o botão do Google Maps."});
    $("#oG",m).onchange=async e=>{m._ponto=null;let c=coordsDe(e.target.value);if(!c&&/^https:/i.test(e.target.value.trim())){$("#oGm",m).textContent="Buscando a localização do link…";c=await resolverLink(e.target.value.trim());$("#oGm",m).textContent=c?"Localização encontrada pelo link.":"Não consegui ler o ponto desse link. Toque no mapa para marcar."}if(c)por(c.lat,c.lng,true)};
    setTimeout(()=>mm.invalidateSize(),50);
  },30);
}
function linkObra(o){
  const url=DB.linkCliente(o.token);
  const m=modal("Link do cliente",`<p class="note">Quem tiver este link vê a obra "${esc(o.titulo)}" sem login e sem poder alterar nada.</p><label class="fld">Link<input id="kU" readonly value="${esc(url)}"></label><div class="row"><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Abrir ↗</a><button type="button" class="btn pri" id="kC">Copiar link</button></div>`);
  $("#kC",m).onclick=async()=>{try{await navigator.clipboard.writeText(url);toast("Link copiado.")}catch(e){$("#kU",m).select();toast("Selecione e copie o link.")}};
}
async function equipeObra(o){
  const [{data:us},{data:mb}]=await Promise.all([sb.from("perfis").select("id,nome,email,papel").order("nome"),sb.from("obra_membros").select("user_id").eq("obra_id",o.id)]);
  const ex=(us||[]).filter(u=>u.papel==="executor"),tem=new Set((mb||[]).map(x=>x.user_id));
  modal("Equipe da obra",`<p class="note">Marque os executores que podem lançar dados em "${esc(o.titulo)}". Administradores veem todas as obras.</p>
   ${ex.length?ex.map(u=>`<label class="ck"><input type="checkbox" value="${u.id}" ${tem.has(u.id)?"checked":""}> ${esc(u.nome||u.email)} <span class="note">${esc(u.email||"")}</span></label>`).join(""):'<p class="note">Nenhum executor cadastrado. Cadastre em Usuários.</p>'}`,
  async m=>{const sel=new Set([...m.querySelectorAll("input[type=checkbox]:checked")].map(i=>i.value));
    const add=[...sel].filter(x=>!tem.has(x)).map(user_id=>({obra_id:o.id,user_id})),rem=[...tem].filter(x=>!sel.has(x));
    if(add.length){const {error}=await sb.from("obra_membros").insert(add);if(error){toast(error.message);return false}}
    if(rem.length){const {error}=await sb.from("obra_membros").delete().eq("obra_id",o.id).in("user_id",rem);if(error){toast(error.message);return false}}
    toast("Equipe atualizada.")});
}
async function chamarUsuarios(body){
  const {data,error}=await sb.functions.invoke("usuarios",{body});
  if(error){let msg=error.message;try{const j=await error.context.json();msg=j.erro||msg}catch(e){}throw new Error(msg)}
  if(data&&data.erro)throw new Error(data.erro);return data;
}
const SETORES_SUG=["Comercial","Engenharia","Administrativo","Compras","Execução","Diretoria"];
async function usuarios(){
  const {data:us}=await sb.from("perfis").select("*").order("nome");
  const m=modal("Usuários",`<div class="ulist">${(us||[]).map(u=>`<div class="urow"><div><b>${esc(u.nome||"(sem nome)")}</b><small>${esc(u.email||"")}${u.setor?" · "+esc(u.setor):""}</small></div><span style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="tag" ${u.papel==="pendente"?'style="background:#fbf0dc;color:#b7791f"':""}>${u.papel==="admin"?"Administrador":u.papel==="pendente"?"Aguardando liberação":"Usuário"}</span>${u.id!==perfil.id?`<button type="button" class="lnk" data-st="${u.id}">Setor</button><button type="button" class="lnk" data-s="${u.id}">Definir senha</button><button type="button" class="lnk" data-r="${esc(u.email||"")}">Enviar link de senha</button>${u.papel==="pendente"?`<button type="button" class="lnk" data-p="${u.id}" data-v="pendente">Liberar</button>`:`<button type="button" class="lnk" data-p="${u.id}" data-v="${u.papel}">${u.papel==="admin"?"Tirar admin":"Tornar admin"}</button>`}<button type="button" class="lnk" style="color:var(--bad)" data-d="${u.id}">Excluir</button>`:""}</span></div>`).join("")}</div>
   <p class="note">Esqueceram a senha? Use <b>Definir senha</b> para colocar uma nova na hora e passe para a pessoa, ou <b>Enviar link de senha</b> para ela criar sozinha pelo e-mail. Por segurança, o sistema não guarda senhas de forma legível.</p>
   <h2 style="font-size:15px;margin-top:6px">Convidar usuário</h2>
   <label class="fld">Nome<input id="uN"></label><label class="fld">E-mail<input id="uE" type="email"></label>
   <label class="fld">Setor<input id="uT" list="setL" placeholder="Ex.: Comercial"><datalist id="setL">${SETORES_SUG.map(x=>`<option value="${x}">`).join("")}</datalist></label>
   <label class="fld">Perfil<select id="uP"><option value="executor">Usuário (permissões definidas por você)</option><option value="admin">Administrador (acesso total)</option></select></label>
   <label class="ck" style="font-size:13px"><input type="checkbox" id="uSc"> Cadastrar com senha inicial, sem e-mail</label>
   <label class="fld" id="uSw" hidden>Senha inicial (mín. 6)<input id="uS" type="text" minlength="6"></label>
   <div class="row"><span class="note" id="uMsg">A pessoa recebe um e-mail para criar a própria senha.</span><button type="button" class="btn pri" id="uAdd">Enviar convite</button></div>`);
  $("#uSc",m).onchange=e=>{$("#uSw",m).hidden=!e.target.checked;$("#uAdd",m).textContent=e.target.checked?"Cadastrar":"Enviar convite";$("#uMsg",m).textContent=e.target.checked?"Passe o e-mail e a senha para a pessoa entrar.":"A pessoa recebe um e-mail para criar a própria senha."};
  $("#uAdd",m).onclick=async()=>{const comSenha=$("#uSc",m).checked;const b=$("#uAdd",m);b.disabled=true;
    try{await chamarUsuarios({acao:comSenha?"criar":"convidar",nome:$("#uN",m).value,email:$("#uE",m).value,senha:$("#uS",m).value,setor:$("#uT",m).value,papel:$("#uP",m).value});toast(comSenha?"Usuário cadastrado.":"Convite enviado por e-mail.");m.remove();usuarios()}catch(e){toast(e.message);b.disabled=false}};
  m.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{modal("Definir senha",`<label class="fld">Nova senha (mín. 6)<input id="nS" type="text" minlength="6" required></label><p class="note">Passe a senha para a pessoa. Ela pode trocar depois em "Esqueci a senha".</p>`,async x=>{try{await chamarUsuarios({acao:"senha",id:b.dataset.s,senha:$("#nS",x).value});toast("Senha definida.")}catch(e){toast(e.message);return false}})});
  m.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{try{await chamarUsuarios({acao:"reenviar",email:b.dataset.r});toast("Link enviado para "+b.dataset.r+".")}catch(e){toast(e.message)}});
  m.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{const u=us.find(x=>x.id===b.dataset.st);modal("Setor de "+(u.nome||u.email),`<label class="fld">Setor<input id="sT" list="setL2" value="${esc(u.setor||"")}"><datalist id="setL2">${SETORES_SUG.map(x=>`<option value="${x}">`).join("")}</datalist></label>`,async x=>{const {error}=await sb.from("perfis").update({setor:$("#sT",x).value.trim()}).eq("id",u.id);if(error){toast(error.message);return false}m.remove();usuarios()})});
  m.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{const novo=b.dataset.v==="executor"?"admin":"executor";const {error}=await sb.from("perfis").update({papel:novo}).eq("id",b.dataset.p);if(error){toast(error.message);return}m.remove();usuarios()});
  m.querySelectorAll("[data-d]").forEach(b=>b.onclick=async()=>{if(!b.dataset.c){b.dataset.c=1;b.textContent="Confirmar exclusão";return}try{await chamarUsuarios({acao:"excluir",id:b.dataset.d});toast("Usuário excluído.");m.remove();usuarios()}catch(e){toast(e.message)}});
}

inicio();
})();
