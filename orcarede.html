<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OrçaRede · ON Engenharia</title>
<link rel="icon" href="assets/on-logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef2f6; --panel:#ffffff; --ink:#1e2f40; --muted:#5a6f83; --line:#d6e1ea;
  --accent:#2f6f9f; --accent-soft:#e8f1f9; --navy:#1e2f40; --navy2:#2b4157; --onblue:#62a8dc;
  --ok:#1f8a4c; --ok-soft:#e2f4e9; --warn:#b7791f; --warn-soft:#fbf0dc; --idle-soft:#edf1f5; --map:#ffffff; --danger:#b3261e; --danger-soft:#fbe9e7;
  --f-body:Montserrat,system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101b26; --panel:#172534; --ink:#e8f1f9; --muted:#9fb8cc; --line:#2b4157;
  --accent:#62a8dc; --accent-soft:#1d3a52; --navy:#0b141d; --navy2:#1e2f40;
  --ok:#52c47f; --ok-soft:#173326; --warn:#e3a94b; --warn-soft:#3a2d16; --idle-soft:#1e2f40; --map:#e9edf0; --danger:#f2867d; --danger-soft:#3a1d1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101b26; --panel:#172534; --ink:#e8f1f9; --muted:#9fb8cc; --line:#2b4157;
  --accent:#62a8dc; --accent-soft:#1d3a52; --navy:#0b141d; --navy2:#1e2f40;
  --ok:#52c47f; --ok-soft:#173326; --warn:#e3a94b; --warn-soft:#3a2d16; --idle-soft:#1e2f40; --map:#e9edf0; --danger:#f2867d; --danger-soft:#3a1d1b; color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 12px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:inherit;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn.del{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:4px 9px;font-size:12px}
header .btn{background:var(--navy2);border-color:#3b5670;color:#e8f1f9}
header .btn.pri{background:var(--onblue);border-color:var(--onblue);color:#0f1c28}
.lnk{background:none;border:0;color:var(--accent);padding:0;font-size:12.5px;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted);margin:0;line-height:1.45}
.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.erro{max-width:440px;margin:12vh auto;padding:24px;text-align:center}
.erro img{height:56px;border-radius:6px}.erro a{color:var(--accent);font-weight:600}
.inp{padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font-size:13.5px}
.fld{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:13.5px;width:100%}
.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.03em;background:var(--idle-soft);color:var(--muted);white-space:nowrap}
.chip.andamento{background:var(--warn-soft);color:var(--warn)}.chip.finalizado{background:var(--ok-soft);color:var(--ok)}
.chip.vig{background:var(--accent-soft);color:var(--accent)}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--navy);color:#e8f1f9;border-radius:12px;padding:12px 16px}
header.top img{height:44px;border-radius:4px;display:block}
.ttl{min-width:0;flex:1 1 260px}
.eye{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#9fb8cc}
.eye a{color:#9fb8cc;text-decoration:none}.eye a:hover{color:#fff}
.ttl h1{font-weight:700;font-size:19px;line-height:1.2;margin:3px 0 1px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttl h1 .chip{font-size:10px}.ttl h1{flex-wrap:nowrap}#hT{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ttl .sub,.ttl .eye{overflow-wrap:anywhere}
.ttl .sub{color:#9fb8cc;font-size:12.5px}
.tot{text-align:right}
.tot .v{font-family:var(--f-mono);font-size:22px;font-weight:500;color:#fff;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.steps{display:flex;gap:4px;flex-wrap:wrap;width:100%}
.steps button{border:1px solid #3b5670;background:transparent;color:#9fb8cc;border-radius:999px;padding:6px 14px;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:7px}
.steps button b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#2b4157;color:#e8f1f9;font-size:11px}
.steps button.on{background:#e8f1f9;color:#1e2f40;border-color:#e8f1f9}.steps button.on b{background:#2f6f9f;color:#fff}
.steps button:disabled{opacity:.45;cursor:default}
.page{max-width:1180px;margin:0 auto;padding:16px;display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.kpi .k{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.kpi .kx{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.dash2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.rec{display:grid;gap:2px}
.rec button{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;border:0;background:none;padding:8px 6px;border-radius:8px;text-align:left}
.rec button:hover{background:var(--accent-soft)}
.rec .t b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rec .t small,.rec .r small{display:block;font-size:11.5px;color:var(--muted)}
.rec .r{text-align:right;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}.rec .r b{font-weight:500}
.sit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}.sit .k{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.sitb{height:8px;margin-top:4px}
.bar{height:6px;border-radius:3px;background:var(--idle-soft);overflow:hidden}.bar>b{display:block;height:100%;background:var(--ok);border-radius:3px}
.bc{display:flex;gap:6px;align-items:center;font-size:13px;flex-wrap:wrap}
.bc button{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl th,.tbl td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--bg)}
.tbl tr.go{cursor:pointer}.tbl tr.go:hover td{background:var(--accent-soft)}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .sm{display:block;font-size:11.5px;color:var(--muted);font-weight:400;font-family:var(--f-body)}
.ico{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--accent-soft);color:var(--accent);margin-right:10px;font-size:15px;flex:none}
.ico.f{background:var(--warn-soft);color:var(--warn)}
.nm{display:flex;align-items:center}
.app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%;gap:10px;padding:10px max(16px,env(safe-area-inset-left,0px))}
.app header.top{grid-column:1/-1}
.app.maxed{padding:0;gap:0}.app.maxed header.top{display:none}
.proj{display:grid;grid-template-columns:var(--listw,330px) 12px minmax(0,1fr) auto auto;min-height:0}
.proj.max{grid-template-columns:minmax(0,1fr) auto}.proj.max #side,.proj.max .split{display:none}
.app.maxed .mapwrap,.app.maxed #ptpanel{border-radius:0}
.split{cursor:col-resize;display:grid;place-items:center;touch-action:none}
.split::after{content:"";width:4px;height:44px;border-radius:2px;background:var(--line)}
.split:hover::after,.split.on::after{background:var(--accent)}
#ptpanel{width:var(--pw,410px);min-width:0;overflow-x:hidden;container-type:inline-size}
#ptpanel .x{border:0;background:none;font-size:20px;line-height:1;color:var(--muted);padding:0 4px}
.pl.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.resumo{border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.resumo>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:12.5px;font-weight:600}
.resumo>summary::-webkit-details-marker{display:none}
.resumo .segbars{padding:2px 10px 10px;gap:6px;max-height:150px;overflow:auto}.resumo .sb{grid-template-columns:110px minmax(0,1fr) 78px;font-size:11.5px}.resumo .sb .bar{height:7px}
.pin .lp{position:absolute;top:-11px;right:-11px;width:17px;height:17px;border-radius:50%;background:#ffd54f;border:1.5px solid #fff;display:grid;place-items:center;font-size:10px;line-height:1;box-shadow:0 1px 2px rgba(0,0,0,.35)}
.pin .tr{position:absolute;bottom:-12px;right:-10px;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:13px solid #d32f2f;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.pin .lp.no{background:#cfd8dc;filter:grayscale(1);opacity:.85}
.ipbox{border:1px solid var(--line);border-radius:8px;padding:9px 10px;display:grid;gap:8px;background:var(--bg)}
.ipbox .row b{font-size:13px}
.pl .ec{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.pl .ec i{font-style:normal;font-family:var(--f-mono);font-size:10.5px;font-weight:500;background:var(--idle-soft);color:var(--ink);border-radius:4px;padding:0 5px;line-height:17px}
.pl .ec i.ip{background:#fff3c4;color:#7a5a00}.pl .ec i.nada{background:none;color:var(--muted);font-family:var(--f-body)}
.kvwarn{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:7px 10px;font-size:12px;display:grid;gap:2px}
.kvtag{font-size:10px;font-weight:700;color:#fff;background:var(--danger);border-radius:6px;padding:0 5px;vertical-align:middle;font-family:var(--f-body)}
tr.fc td{background:var(--danger-soft)}
.vt{width:100%;border-collapse:collapse;font-size:12.5px}.vt th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:4px}
.vt td{padding:5px 4px;border-top:1px solid var(--line)}.vt select{width:100%;padding:5px;border:1px solid var(--line);border-radius:5px;background:var(--bg)}
.st{font-size:10.5px;font-weight:700;border-radius:8px;padding:1px 7px;white-space:nowrap}.st.ok{background:var(--ok-soft);color:var(--ok)}.st.no{background:var(--danger-soft);color:var(--danger)}.st.m{background:var(--accent-soft);color:var(--accent)}
.leg{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;display:grid;gap:4px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.leg div{display:flex;align-items:center;gap:6px}.leg b{font-family:var(--f-mono);font-weight:500;margin-left:auto;padding-left:12px}
.trl{display:grid;gap:6px}.trl label{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:13px;font-weight:600}
.trl label small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}.trl label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.painel{grid-template-columns:auto minmax(0,1fr) minmax(220px,.8fr);gap:18px;align-items:center}
.pp1{display:flex;gap:14px;align-items:center}.pp1 svg{color:var(--ink);flex:none}
.pp1 .lg{display:grid;gap:4px;font-size:12px;min-width:150px}.pp1 .lg div{display:grid;grid-template-columns:10px 1fr auto;gap:6px;align-items:center}.pp1 .lg i{width:10px;height:10px;border-radius:3px}.pp1 .lg b{font-family:var(--f-mono);font-weight:500}
.pp2{display:grid;gap:7px}.gb{display:grid;grid-template-columns:96px minmax(0,1fr) 110px;gap:8px;align-items:center;font-size:12px}.gb .bar{height:9px}.gb .mono{text-align:right}
.pp3{display:grid;gap:6px;border-left:1px solid var(--line);padding-left:16px}.pp3 div{display:flex;justify-content:space-between;gap:8px;font-size:12.5px}.pp3 span{color:var(--muted)}.pp3 b{font-family:var(--f-mono);font-weight:500}
.extra{border:1px dashed var(--line);border-radius:8px;padding:8px}
.sug{background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:12px;display:grid;gap:6px}
.sug code{font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere}
.full-pane{overflow:auto;min-height:0}
aside{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.ah{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.pane{overflow:auto;padding:12px 14px;display:grid;gap:12px;align-content:start;grid-auto-rows:max-content;flex:1;min-height:0}
.plist{display:grid;gap:1px}
.pl{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 6px;border-radius:7px;cursor:pointer}
.pl:hover{background:var(--accent-soft)}
.pl .n{font-family:var(--f-mono);font-size:11.5px;font-weight:600;min-width:28px;height:22px;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:#fff;padding:0 6px}
.pl .n.v{background:var(--warn)}
.pl .t{font-size:12.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.pl .t small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.pl .r{text-align:right;font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.pl .r small{display:block;font-family:var(--f-body);font-size:10.5px;color:var(--muted)}
.pl input[type=checkbox]{width:16px;height:16px;margin:0}
.segtag{display:inline-block;font-size:10px;font-weight:700;border-radius:8px;padding:1px 6px;margin-left:4px;color:#fff;vertical-align:middle}
.bulk{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:8px;padding:7px 9px;font-size:12.5px}
.est{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.est>summary{list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;background:var(--bg);cursor:pointer;font-weight:600;font-size:13px}
.est>summary::-webkit-details-marker{display:none}
.est .ed{font-size:10px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:1px 6px;margin-left:6px}
.est .seg{font-size:11.5px;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:var(--panel);max-width:120px}
.its{width:100%;border-collapse:collapse;font-size:12px}
.its td{padding:4px 8px;border-top:1px solid var(--line);vertical-align:middle}
.its td.q{width:74px}.its td.v{width:86px;text-align:right}.its td.x{width:22px}
.its input{width:66px;padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--bg);font-family:var(--f-mono);font-size:12px;text-align:right}
.its .m{line-height:1.3}.its .m small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.xb{border:0;background:none;color:var(--muted);font-size:15px;padding:0 2px;line-height:1}
.xb:hover{color:var(--danger)}
.seq{display:flex;gap:6px}.seq input{flex:1;min-width:0;font-family:var(--f-mono);font-size:12.5px}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px}.kv b{font-family:var(--f-mono);font-weight:500}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--map);min-height:0;touch-action:none;cursor:grab}
.mapwrap.drag{cursor:grabbing}.mapwrap.place,.mapwrap.trace,.mapwrap.calib{cursor:crosshair}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.stage img{display:block;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}

.pin{position:absolute;min-width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:13px;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);background:#2f6f9f;color:#fff;padding:0 4px;font:600 11px/21px var(--f-mono);transform:scale(var(--inv,1))}
.pin.vazio{background:#b7791f}
.pin.sel{outline:3px solid #c2185b;outline-offset:2px;z-index:2;cursor:move}
.pin.anchor{outline:3px dashed #c2185b;outline-offset:3px}

.mapbar{position:absolute;left:10px;top:10px;right:56px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}

.mapui{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}

.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--navy);color:#e8f1f9;padding:7px 12px;border-radius:7px;font-size:12.5px;max-width:calc(100% - 20px);text-align:center}
.esc{position:absolute;right:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11.5px;color:var(--muted)}
.dot{display:inline-block;width:14px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}

.card h2{margin:0;font-size:15px}
.wrap2{max-width:1400px;margin:0 auto;display:grid;gap:12px;padding-bottom:20px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px;align-items:start}
.wrap2.wide3{max-width:none;padding-left:12px;padding-right:12px}.cols3{display:grid;grid-template-columns:280px minmax(0,1fr) 340px;gap:12px;align-items:start}

    const md=modal(`<h2>Materiais duplicados</h2><p class="note">Mesmo nome com códigos diferentes. Escolha o código que fica: grupos, orçamentos e histórico de preços passam para ele, e os outros ficam inativos (o código antigo vira apelido, para cotações e orçamentos antigos).</p>
      <div class="dups">${D.map((g,i)=>`<div class="dup"><b>${esc(g[0].nome)}</b>${g.map((m,j)=>`<label><input type="radio" name="d${i}" value="${esc(m.codigo)}" ${j?"":"checked"}> <span class="mono">${esc(m.codigo)}</span> ${PV[m.codigo]?brl(PV[m.codigo].valor):""}</label>`).join("")}<button type="button" class="btn sm" data-uni="${i}">Unificar</button></div>`).join("")||'<p class="note">Nenhum duplicado por nome. 👍</p>'}</div>
      <h3 class="h3">Unificar dois códigos quaisquer</h3><div class="grid3">${optsMat()}<input class="inp" list="dlMat" id="uK" placeholder="Código que fica"><input class="inp" list="dlMat" id="uT" placeholder="Código que sai"><button type="button" class="btn" id="uGo">Unificar</button></div>`,()=>{},"Fechar");
    md.querySelector(".mbox").classList.add("wide");md.querySelector("[data-x]").hidden=true;
    const uni=async(k,t)=>{const r=await chk(O.rpc("unificar_material",{p_manter:k,p_trocar:t}));return r};
    $$("[data-uni]",md).forEach(b=>b.onclick=async()=>{const g=D[+b.dataset.uni];const k=md.querySelector(`input[name=d${b.dataset.uni}]:checked`).value;
      for(const m of g)if(m.codigo!==k)await uni(k,m.codigo);toast("Unificado.");md.remove();await carregaBase();duplicados()});
    $("#uGo",md).onclick=async()=>{const k=codDe($("#uK",md).value),t=codDe($("#uT",md).value);if(!MAT()[k]||!MAT()[t]||k===t){toast("Escolha dois códigos diferentes da base.");return}
      if(!confirm(`Manter ${k} e desativar ${t}?`))return;await uni(k,t);toast("Unificado.");md.remove();await carregaBase();tMateriais()};
  }

  /* ---------- Subgrupos ---------- */
  function tSubgrupos(){
    const cnt={};MATS.filter(m=>m.ativo!==false).forEach(m=>cnt[m.subgrupo||""]=(cnt[m.subgrupo||""]||0)+1);
    frame(`<div class="row"><p class="note">Os subgrupos agrupam os materiais nos resumos e exportações. A ordem aqui é a ordem dos relatórios.</p><button class="btn pri" id="sNovo">+ Subgrupo</button></div>
     <table class="tbl"><thead><tr><th style="width:60px">Ordem</th><th>Subgrupo</th><th class="n">Materiais</th><th></th></tr></thead><tbody>
     ${SUBS.map((s,i)=>`<tr><td><span class="sw" style="background:${s.cor||PALETA[i%PALETA.length]}"></span> ${i+1}</td><td><b>${esc(s.nome)}</b></td><td class="n">${cnt[s.nome]||0}</td>
       <td class="n"><button class="btn sm" data-up="${i}" ${i?"":"disabled"}>↑</button><button class="btn sm" data-dn="${i}" ${i<SUBS.length-1?"":"disabled"}>↓</button><button class="btn sm" data-ed="${s.id}">Editar</button><button class="btn sm" data-del="${s.id}">✕</button></td></tr>`).join("")}
     <tr><td></td><td class="note">— sem subgrupo —</td><td class="n">${cnt[""]||0}</td><td></td></tr></tbody></table>
     <h3 class="h3">Regras aprendidas</h3><p class="note">O sistema aprende com os materiais que você classifica: pelo início do nome, sugere o subgrupo dos materiais novos e dos que estão sem subgrupo. Corrigir um material ajusta a regra.</p>
     <div class="regras">${Object.entries(regrasSub().k2).map(([k,o])=>{const t=Object.values(o).reduce((a,b)=>a+b,0);const [sub,n]=Object.entries(o).sort((a,b)=>b[1]-a[1])[0];return{k,sub,n,t}}).filter(x=>x.n>=2&&x.n/x.t>=.7).sort((a,b)=>b.n-a.n).slice(0,60).map(x=>`<span><code>${esc(x.k)}…</code> → <b>${esc(x.sub)}</b> <small>(${x.n})</small></span>`).join("")||'<span class="note">Classifique alguns materiais para começar.</span>'}</div>`);
    const ord=async()=>{for(let i=0;i<SUBS.length;i++)if(SUBS[i].ordem!==i){SUBS[i].ordem=i;await chk(O.from("subgrupos").update({ordem:i}).eq("id",SUBS[i].id))}tSubgrupos()};
    $$("[data-up]").forEach(b=>b.onclick=()=>{const i=+b.dataset.up;[SUBS[i-1],SUBS[i]]=[SUBS[i],SUBS[i-1]];ord()});
    $$("[data-dn]").forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;[SUBS[i+1],SUBS[i]]=[SUBS[i],SUBS[i+1]];ord()});
    const form=s=>`<h2>${s?"Editar":"Novo"} subgrupo</h2><div class="grid2"><label class="fld">Nome<input name="nome" required value="${esc(s?s.nome:"")}"></label><label class="fld">Cor<input type="color" name="cor" value="${s&&s.cor||PALETA[SUBS.length%PALETA.length]}"></label></div>`;
    $("#sNovo").onclick=()=>modal(form(),async f=>{const r=await chk(O.from("subgrupos").insert({nome:f.nome.trim().toUpperCase(),cor:f.cor,ordem:SUBS.length}).select("*").single());SUBS.push(r);tSubgrupos()},"Criar");
    $$("[data-ed]").forEach(b=>b.onclick=()=>{const s=SUBS.find(x=>x.id==b.dataset.ed);modal(form(s)+`<p class="note">Renomear também atualiza os materiais desse subgrupo.</p>`,async f=>{const nv=f.nome.trim().toUpperCase();
      await chk(O.from("subgrupos").update({nome:nv,cor:f.cor}).eq("id",s.id));if(nv!==s.nome){await chk(O.from("materiais").update({subgrupo:nv}).eq("subgrupo",s.nome));MATS.forEach(m=>{if(m.subgrupo===s.nome)m.subgrupo=nv})}s.nome=nv;s.cor=f.cor;tSubgrupos()},"Salvar")});
    $$("[data-del]").forEach(b=>b.onclick=async()=>{const s=SUBS.find(x=>x.id==b.dataset.del);const n=cnt[s.nome]||0;
      if(!confirm(n?`${n} materiais estão em “${s.nome}” e ficarão sem subgrupo. Excluir?`:`Excluir “${s.nome}”?`))return;
      if(n){await chk(O.from("materiais").update({subgrupo:null}).eq("subgrupo",s.nome));MATS.forEach(m=>{if(m.subgrupo===s.nome)m.subgrupo=null})}
      await chk(O.from("subgrupos").delete().eq("id",s.id));SUBS=SUBS.filter(x=>x!==s);tSubgrupos()});
  }

    const [EST,PST,TRD,EC]=await Promise.all([
      todos(()=>O.from("estruturas").select("id,concessionaria_id")),todos(()=>O.from("postes").select("id,concessionaria_id")),
      todos(()=>O.from("tipos_rede").select("id,concessionaria_id")),todos(()=>O.from("estrutura_conc").select("*"))]);

    frame(`<div class="row"><p class="note">Cadastro das concessionárias. Postes, cabos e iluminação são gerais e ficam nas próprias abas; aqui ficam os padrões de ponto de cada uma.</p><button class="btn pri" id="cNovo">+ Concessionária</button></div>
     <div class="ccards">${CON.map(c=>`<button class="ccard ${c.id===concSel?"on":""}" data-c="${c.id}"><b>${esc(c.sigla)}</b><span>${esc(c.nome||"")}</span><small>${nG(c.id)} grupos de itens</small></button>`).join("")}</div>

       ${PST.map(p=>`<tr><td class="mono">${esc(p.codigo)}</td><td>${p.tipo}</td><td class="n">${num(p.altura_m)} m</td><td class="n">${num(p.esforco_kn)} kN</td><td>${esc(p.material_codigo||"")}<span class="sm">${esc((M[p.material_codigo]||{}).nome||"")}</span></td><td class="n">${PV[p.material_codigo]?brl(PV[p.material_codigo].valor):"—"}</td><td class="n"><button class="btn sm" data-pe="${p.id}">Editar</button><button class="btn sm" data-pd="${p.id}">✕</button></td></tr>`).join("")||'<tr><td colspan="7" class="note">Nenhum poste.</td></tr>'}</tbody></table>
       <div class="row"><span class="note">O código é como o poste aparece na planta, ex.: 12/600 ou 11(300).</span><button class="btn" id="pNovo">+ Poste</button></div>`;
      const form=p=>`<h2>${p?"Editar":"Novo"} poste</h2><div class="grid2"><label class="fld">Código<input name="codigo" required value="${esc(p?p.codigo:"")}"></label><label class="fld">Tipo<select name="tipo">${["DT","TC","FIBRA","OUTRO"].map(t=>`<option ${p&&p.tipo===t?"selected":""}>${t}</option>`).join("")}</select></label>

/* ============ LISTA: pastas e versões ============ */
async function lista(pastaId){
  const [PAS,ORCS,ITS]=await Promise.all([
    todos(()=>O.from("pastas").select("*").order("nome")),
    todos(()=>O.from("orcamentos").select("id,titulo,cliente,cidade,status,concessionaria_id,negocio_id,pasta_id,versao,vigente,atualizado_em").order("atualizado_em",{ascending:false})),
    todos(()=>O.from("v_orc_itens").select("orcamento_id,subtotal"))]);
  const tot={};ITS.forEach(i=>tot[i.orcamento_id]=(tot[i.orcamento_id]||0)+(+i.subtotal||0));
  const filhos=id=>PAS.filter(p=>(p.pai_id||null)===(id||null));
  const descend=id=>{let s=[id];filhos(id).forEach(f=>s=s.concat(descend(f.id)));return s};
  let q="";

  function dash(){
    const vig=ORCS.filter(o=>o.vigente!==false);
    const and=vig.filter(o=>o.status!=="finalizado"),fin=vig.filter(o=>o.status==="finalizado");

    const porC={};vig.forEach(o=>{const k=concSig(o.concessionaria_id)||"—";(porC[k]=porC[k]||{n:0,v:0});porC[k].n++;porC[k].v+=tot[o.id]||0});
    const maxC=Math.max(1,...Object.values(porC).map(x=>x.v));
    const rec=[...ORCS].sort((a,b)=>String(b.atualizado_em).localeCompare(String(a.atualizado_em))).slice(0,6);
    const tx=vig.length?fin.length/vig.length*100:0;
    return `<div class="kpis">
      <div class="kpi"><span class="k">Em andamento</span><span class="v" style="color:var(--warn)">${and.length}</span><span class="kx">${brl(sv(and))} em material</span></div>
      <div class="kpi"><span class="k">Finalizados</span><span class="v" style="color:var(--ok)">${fin.length}</span><span class="kx">${brl(sv(fin))} em material</span></div>
      <div class="kpi"><span class="k">Projetos</span><span class="v">${PAS.filter(p=>ORCS.some(o=>o.pasta_id===p.id)).length}</span><span class="kx">${ORCS.length} versões no total</span></div>
      <div class="kpi"><span class="k">Taxa de conclusão</span><span class="v">${Math.round(tx)}%</span><div class="bar"><b style="width:${tx}%"></b></div></div></div>
     <div class="dash2">
      <div class="card"><div class="row"><h2>Movimentados recentemente</h2></div>
       <div class="rec">${rec.map(o=>`<button data-rec="${o.id}"><span class="ico">⚡</span><span class="t"><b>${esc(o.titulo)} · v${o.versao}</b><small>${esc([o.cliente,o.cidade].filter(Boolean).join(" · "))}</small></span><span class="chip ${o.status}">${stTxt(o.status)}</span><span class="r"><b>${brl(tot[o.id])}</b><small>${quando(o.atualizado_em)}</small></span></button>`).join("")||'<p class="note">Nenhum orçamento ainda.</p>'}</div></div>
      <div class="card"><h2>Por concessionária</h2><p class="note">Versões vigentes · valor de material</p>
       <div class="segbars">${Object.entries(porC).sort((a,b)=>b[1].v-a[1].v).map(([k,x])=>`<div class="sb"><span>${esc(k)} <span class="note">(${x.n})</span></span><div class="bar"><b style="width:${x.v/maxC*100}%;background:var(--accent)"></b></div><span class="n"></span><span></span><span class="v">${brl(x.v)}</span></div>`).join("")||'<p class="note">—</p>'}</div>
       <div class="sit"><div><span class="k">Andamento</span><div class="bar sitb"><b style="width:${100-tx}%;background:var(--warn)"></b></div></div><div><span class="k">Finalizado</span><div class="bar sitb"><b style="width:${tx}%"></b></div></div></div></div></div>
     <div class="row"><h2 style="margin:4px 0 0;font-size:15px">Pastas e orçamentos</h2></div>`;
  }
  function render(){
    const cur=PAS.find(p=>p.id===pastaId)||null;
    const trilha=[];for(let p=cur;p;p=PAS.find(x=>x.id===p.pai_id))trilha.unshift(p);
    const busca=q.trim().toLowerCase();
    let pastas,orcs;
    if(busca){orcs=ORCS.filter(o=>[o.titulo,o.cliente,o.cidade].some(v=>(v||"").toLowerCase().includes(busca)));pastas=PAS.filter(p=>p.nome.toLowerCase().includes(busca))}
    else{pastas=filhos(pastaId);orcs=ORCS.filter(o=>(o.pasta_id||null)===(pastaId||null)).sort((a,b)=>b.versao-a.versao)}
    const cont=p=>{const ids=descend(p.id);const n=ORCS.filter(o=>ids.includes(o.pasta_id)).length,s=filhos(p.id).length;return `${n} ${n===1?"versão":"versões"}${s?` · ${s} ${s===1?"pasta":"pastas"}`:""}`};
    const vig=p=>ORCS.filter(o=>o.pasta_id===p.id).sort((a,b)=>(b.vigente-a.vigente)||(b.versao-a.versao))[0];
    root.innerHTML=`<div class="page">
     <header class="top"><img src="assets/on-logo.jpg" alt="ON Engenharia"><div class="ttl"><div class="eye">ON Engenharia</div><h1>OrçaRede</h1><div class="sub">Projete a rede, consolide os materiais e siga para a precificação</div></div>
      <div class="tools"><span class="navb"><button class="btn" data-nav="-1" title="Voltar" aria-label="Voltar">←</button><button class="btn" data-nav="1" title="Avançar" aria-label="Avançar">→</button></span><a class="btn" href="index.html">← Obras</a><a class="btn" href="negocios.html">Negócios</a><a class="btn" href="orcarede.html?cfg=materiais">⚙ Configurações</a><button class="btn" id="bPasta">+ Pasta</button><button class="btn pri" id="bNovo">+ Novo orçamento</button></div></header>
     ${pastaId||busca?"":dash()}
     <div class="row"><div class="bc"><button data-go="">Todos</button>${trilha.map(p=>`<span>›</span><button data-go="${p.id}">${esc(p.nome)}</button>`).join("")}</div>
      <input class="inp" id="q" placeholder="Buscar por projeto, cliente ou cidade" value="${esc(q)}" style="width:min(360px,100%)"></div>
     ${pastas.length||orcs.length?`<table class="tbl"><thead><tr><th>Nome</th><th class="hm">Cliente</th><th class="hm">Conc.</th><th>Situação</th><th class="n">Material</th></tr></thead><tbody>
      ${pastas.map(p=>{const v=vig(p);return `<tr class="go" data-p="${p.id}"><td><div class="nm"><span class="ico f">▤</span><div><b>${esc(p.nome)}</b><span class="sm">${cont(p)}${p.negocio_id?" · ligada ao negócio":""}</span></div><button class="btn sm mais" data-pm="${p.id}" title="Renomear, mover ou excluir">⋯</button></div></td><td class="hm">${esc(v?v.cliente||"":"")}</td><td class="hm">${v?esc(concSig(v.concessionaria_id)):""}</td><td>${v?`<span class="chip ${v.status}">${stTxt(v.status)}</span>`:""}</td><td class="n">${v?brl(tot[v.id])+`<span class="sm">v${v.versao}${v.vigente?" vigente":""}</span>`:""}</td></tr>`}).join("")}
      ${orcs.map(o=>`<tr class="go" data-o="${o.id}"><td><div class="nm"><span class="ico">⚡</span><div><b>${esc(o.titulo)} · v${o.versao}</b><span class="sm"><button class="btn sm mais" data-om="${o.id}" title="Mover para outra pasta">⋯</button>${o.vigente?"vigente":"versão anterior"}${busca&&o.pasta_id?" · em "+esc((PAS.find(p=>p.id===o.pasta_id)||{}).nome||""):""}</span></div></div></td><td class="hm">${esc(o.cliente||"")}${o.cidade?`<span class="sm">${esc(o.cidade)}</span>`:""}</td><td class="hm">${esc(concSig(o.concessionaria_id))}</td><td><span class="chip ${o.status}">${stTxt(o.status)}</span></td><td class="n">${brl(tot[o.id])}</td></tr>`).join("")}
     </tbody></table>`:`<p class="note">${busca?"Nada encontrado.":"Pasta vazia."}</p>`}</div>`;
    $$("[data-go]").forEach(b=>b.onclick=()=>{pastaId=b.dataset.go||null;q="";history.pushState(null,"",pastaId?"?pasta="+pastaId:"orcarede.html");render()});
    const opPastas=(excl)=>{const out=[];const walk=(pid,d)=>filhos(pid).forEach(p=>{if(excl&&descend(excl).includes(p.id))return;out.push(`<option value="${p.id}">${"— ".repeat(d)}${esc(p.nome)}</option>`);walk(p.id,d+1)});walk(null,0);return `<option value="">(raiz — Todos)</option>`+out.join("")};
    $$("[data-pm]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();const p=PAS.find(x=>x.id===b.dataset.pm);const ids=descend(p.id);const nO=ORCS.filter(o=>ids.includes(o.pasta_id)).length;
      const md=modal(`<h2>Pasta “${esc(p.nome)}”</h2><label class="fld">Nome<input name="nome" required value="${esc(p.nome)}"></label>
        <label class="fld">Dentro de<select name="pai">${opPastas(p.id)}</select></label>
        <div class="row"><span class="note">${nO} ${nO===1?"versão":"versões"} e ${ids.length-1} subpasta(s) dentro</span><button type="button" class="btn sm" id="pDel">Excluir pasta</button></div>`,async f=>{
        await chk(O.from("pastas").update({nome:f.nome.trim(),pai_id:f.pai||null}).eq("id",p.id));p.nome=f.nome.trim();p.pai_id=f.pai||null;render()},"Salvar");
      md.querySelector("[name=pai]").value=p.pai_id||"";
      $("#pDel",md).onclick=async()=>{const pai=p.pai_id||null;
        if(!confirm(nO||ids.length>1?`Excluir “${p.nome}”? O que está dentro (subpastas e orçamentos) passa para a pasta de cima — nada é apagado.`:`Excluir a pasta vazia “${p.nome}”?`))return;

        await chk(O.from("pastas").update({pai_id:pai}).eq("pai_id",p.id));PAS.forEach(x=>{if(x.pai_id===p.id)x.pai_id=pai});
        await chk(O.from("pastas").delete().eq("id",p.id));PAS.splice(PAS.indexOf(p),1);md.remove();render()}});
    $$("[data-om]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();const o=ORCS.find(x=>x.id===b.dataset.om);
      const md=modal(`<h2>Mover “${esc(o.titulo)} · v${o.versao}”</h2><label class="fld">Para a pasta<select name="pasta">${opPastas()}</select></label><p class="note">Só muda onde aparece; o orçamento não é alterado.</p>`,async f=>{

      const r=await chk(O.from("pastas").insert({nome:f.nome.trim(),pai_id:pastaId||null}).select("*").single());PAS.push(r);render()},"Criar");
  }

  const {data:ps}=await O.from("pastas").select("id,nome,negocio_id");const PS={};(ps||[]).forEach(p=>PS[p.id]=p);
  const L=(os||[]).filter(o=>o.vigente!==false);
  const md=document.createElement("div");md.className="modal";
  md.innerHTML=`<div class="mbox wide"><h2>Orçamento do negócio “${esc(n.titulo||"")}”</h2>
    <p class="note">Crie um orçamento novo ou vincule um que já existe no OrçaRede. Vincular não copia nada: o orçamento escolhido passa a ser o deste negócio.</p>
    <div class="row" style="justify-content:flex-start"><button class="btn pri" id="vNovo">+ Criar orçamento novo</button></div>
    <h3 class="h3">Vincular orçamento existente</h3><input class="inp" id="vBusca" placeholder="Buscar por nome, cliente ou cidade" autocomplete="off">
    <div id="vL" style="max-height:50vh;overflow:auto"></div>
    <div class="row"><span></span><button class="btn" id="vX">Cancelar</button></div></div>`;
  document.body.appendChild(md);
  const draw=()=>{const t=norm($("#vBusca",md).value).split(/\s+/).filter(Boolean);
    const F=L.filter(o=>{const h=norm([o.titulo,o.cliente,o.cidade,(PS[o.pasta_id]||{}).nome].join(" "));return t.every(w=>h.includes(w))}).slice(0,80);

  let _RS=null;function sugSubE(nome){if(!_RS){const k1={},k2={};MATS.forEach(m=>{if(!m.subgrupo||m.ativo===false)return;const w=norm(m.nome).split(" ").filter(t=>/^[A-Z]{2,}$/.test(t));if(!w.length)return;(k1[w[0]]=k1[w[0]]||{})[m.subgrupo]=(k1[w[0]][m.subgrupo]||0)+1;if(w[1]){const b=w[0]+" "+w[1];(k2[b]=k2[b]||{})[m.subgrupo]=(k2[b][m.subgrupo]||0)+1}});_RS={k1,k2}}

     ${P.travado?`<div class="lockbar">🔒 Precificação travada por <b>${esc(P.travado_nome||"—")}</b> em ${P.travado_em?new Date(P.travado_em).toLocaleString("pt-BR"):"—"}. Os valores não podem ser alterados até destravar.</div>`:""}
     ${painelPreco(R)}
     ${desat?`<div class="warnbar"><span>Os materiais mudaram desde a última precificação: eram ${brl(P.materiais_ref)}, agora são ${brl(M)}. Os valores abaixo já usam o total atual.</span><button class="btn sm" id="pOkRef">Ciente</button></div>`:""}
     <div class="cols"><div style="display:grid;gap:12px">
      <div class="card"><div class="row"><h2>Método de precificação</h2><span class="tools"><span class="note">${sujoP?'<b style="color:var(--warn)">● alterações não salvas</b>':`Salvo na v${ORC.versao||1}${P.atualizado_em?" · "+quando2(P.atualizado_em):""}`}</span>
         <button class="btn sm ${sujoP?"pri":""}" id="pSalvar" ${P.travado||!sujoP?"disabled":""}>💾 Salvar</button>
         ${P.travado?`<button class="btn sm" id="pDestravar">🔓 Destravar</button>`:`<button class="btn sm" id="pTravar" title="Congela a precificação desta versão">🔒 Travar</button>`}
         <button class="btn sm" id="pDup">Duplicar como nova versão</button><button class="btn sm pri" id="pXls">⬇ Excel para proposta</button></span></div>
       <div class="metodo"><button data-m="A" class="${P.metodo==="A"?"on":""}"><b>A · % sobre materiais</b><span>Você define o percentual (ou o valor) do serviço; o lucro é o resultado.</span></button>
        <button data-m="B" class="${P.metodo==="B"?"on":""}"><b>B · Custos + lucro desejado</b><span>Você define o lucro líquido; o valor do serviço é calculado.</span></button></div>
       ${P.metodo==="A"?`<div class="grid2"><label class="fld">% sobre os materiais<input id="pA" value="${num(M?SA/M*100:P.pct_materiais,2)}" inputmode="decimal"></label><label class="fld">ou valor do serviço (R$)<input id="pAv" value="${P.valor_servico!=null&&P.valor_servico!==""?num(P.valor_servico,2):""}" placeholder="${num(SA,2)}" inputmode="decimal"></label></div>`
        :`<div class="grid2"><label class="fld">Lucro líquido desejado (% do total ao cliente)<input id="pB" value="${num(P.lucro_pct,2)}" inputmode="decimal"></label><div class="box"><span class="k">Serviço calculado</span><span class="big">${isFinite(SB)?brl(SB):"—"}</span><small>${isFinite(SB)&&M?num(SB/M*100,1)+"% sobre os materiais":"os percentuais somam 100% ou mais"}</small></div></div>`}
       <div class="cmp">${P.metodo==="A"?`<b>Comparativo B:</b> para ${num(P.lucro_pct,1)}% de lucro líquido, o serviço seria <b>${isFinite(SB)?brl(SB):"—"}</b>${isFinite(SB)&&M?` (${num(SB/M*100,1)}% sobre os materiais)`:""}. <button class="lnk" id="pUsaB">Usar B</button>`
         :`<b>Comparativo A:</b> com ${num(P.pct_materiais,1)}% sobre os materiais, o serviço seria <b>${brl(SA)}</b> e o lucro <b>${brl(RA.lucro)}</b> (${RA.T?num(RA.lucro/RA.T*100,1):0}% do total). <button class="lnk" id="pUsaA">Usar A</button>`}</div></div>
      <div class="card"><div class="row"><h2>Custos do serviço</h2><div class="tools"><select class="inp" id="pMod" style="padding:5px 8px;font-size:12.5px" aria-label="Aplicar modelo"><option value="">Aplicar modelo…</option><option value="padrao">Padrão ON</option></select><button class="btn sm pri" id="pAdd">+ Custo</button></div></div>
       <div style="overflow:auto"><table class="custos"><thead><tr><th style="min-width:130px">Descrição</th><th>Grupo (DRE)</th><th>Tipo</th><th>Cálculo</th><th style="text-align:right">Total</th><th style="text-align:right">% serv.</th><th></th></tr></thead>
        <tbody>${(P.custos||[]).map(linha).join("")||`<tr><td colspan="7"><p class="note" style="padding:8px 0">Nenhum custo ainda. Use “Aplicar modelo” ou “+ Custo”.</p></td></tr>`}</tbody>
        <tfoot><tr><td colspan="4" style="text-align:right;font-weight:700">Total de custos</td><td class="n"><b>${brl(R.custos)}</b></td><td class="n"><b>${R.S?pct(R.custos/R.S*100):"—"}</b></td><td></td></tr></tfoot></table></div></div>
     </div>
     <div style="display:grid;gap:12px">
      <div class="card"><div class="box"><span class="k">Materiais</span><span class="big">${brl(M)}</span><small>repassados ao cliente sem margem</small></div>
       <div class="box"><span class="k">Valor do serviço · método ${P.metodo}</span><span class="big">${brl(R.S)}</span><small>${M?num(R.S/M*100,2):0}% sobre os materiais</small></div>
       <div class="box"><span class="k">Custos do serviço</span><span class="big">${brl(R.custos)}</span><small>${R.T?num(R.custos/R.T*100,2):0}% do total</small></div>
       <div class="box ${R.lucro>=0?"good":"bad"}"><span class="k">Lucro líquido</span><span class="big">${brl(R.lucro)}</span><small>${R.T?num(R.lucro/R.T*100,2):0}% do total · ${R.S?num(R.lucro/R.S*100,1):0}% do serviço</small></div>
       <div class="box" style="background:var(--accent-soft);border-color:transparent"><span class="k">Total ao cliente</span><span class="big" style="color:var(--accent)">${brl(R.T)}</span></div></div>
      <div class="card"><h2>Detalhamento dos custos</h2>${R.L.map(c=>`<div class="kv"><span>${esc(c.desc||c.grupo)}<span class="note"> · ${esc(c.grupo)}</span></span><b>${brl(c.v)}</b></div>`).join("")||'<p class="note">—</p>'}</div>
     </div></div>
     <details class="card plog" id="pLog"><summary><b>Registro de ajustes</b> <span class="note">quem fez, quando e o que mudou</span></summary><div id="pLogL" class="note">Carregando…</div></details></div>`;
    $("#pLog").ontoggle=async()=>{if(!$("#pLog").open)return;const L=await todos(()=>O.from("precificacao_log").select("*").eq("orcamento_id",ORC.id).order("quando",{ascending:false}));
      $("#pLogL").innerHTML=L.length?`<table class="tbl"><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>O que mudou</th><th class="n">Total antes</th><th class="n">Total depois</th></tr></thead><tbody>${L.map(l=>`<tr><td>${new Date(l.quando).toLocaleString("pt-BR")}</td><td>${esc(l.quem_nome||"")}</td><td><span class="chip ${l.acao==="travar"?"finalizado":l.acao==="destravar"?"andamento":""}">${({salvar:"Salvou",travar:"Travou",destravar:"Destravou"})[l.acao]||esc(l.acao)}</span></td><td>${esc(l.resumo||"")}</td><td class="n">${l.total_antes!=null?brl(l.total_antes):"—"}</td><td class="n">${l.total_depois!=null?brl(l.total_depois):"—"}</td></tr>`).join("")}</tbody></table>`:"Nenhum ajuste registrado ainda."};
    const re=()=>{if(P.travado){toast("Precificação travada. Destrave para alterar.");telaPreco();return}salvarP();telaPreco()};
    $("#pDup").onclick=()=>$("#bVer").click();
    $("#pSalvar").onclick=async()=>{await gravarP("salvar",R.T);toast("Precificação salva.");telaPreco()};
    $("#pTravar")&&($("#pTravar").onclick=()=>modal(`<h2>Travar a precificação da v${ORC.versao||1}?</h2><p class="note">Os valores ficam congelados (total ${brl(R.T)}). Só um administrador destrava, e fica registrado.</p>${sujoP?'<p class="note" style="color:var(--warn)">As alterações não salvas serão salvas antes de travar.</p>':""}`,async()=>{
      if(sujoP)await gravarP("salvar",R.T);P.travado=true;await gravarP("travar",R.T,{travado:true,travado_por:perfil.id,travado_nome:quemSou(),travado_em:new Date().toISOString()});toast("Precificação travada.");telaPreco()},"Travar"));
    $("#pDestravar")&&($("#pDestravar").onclick=()=>{if(perfil.papel!=="admin"){toast("Só um administrador pode destravar.");return}modal(`<h2>Destravar a precificação?</h2><p class="note">Fica registrado quem destravou e quando.</p>`,async()=>{
      P.travado=false;await gravarP("destravar",R.T,{travado:false,travado_por:null,travado_nome:null,travado_em:null});toast("Precificação destravada.");telaPreco()},"Destravar")});
    if(P.travado)$$(".cols input,.cols select,.cols textarea,.cols .xb,.cols #pAdd,.metodo button,#pUsaA,#pUsaB,#pOkRef",el).forEach(x=>x.disabled=true);
    $("#pXls").onclick=()=>excelProposta(R).catch(e=>{console.error(e);toast("Não foi possível gerar o Excel.")});
    $$("[data-m]",el).forEach(b=>b.onclick=()=>{P.metodo=b.dataset.m;re()});
    $("#pUsaB")&&($("#pUsaB").onclick=()=>{P.metodo="B";re()});
    $("#pUsaA")&&($("#pUsaA").onclick=()=>{P.metodo="A";re()});
    $("#pA")&&($("#pA").onchange=e=>{P.pct_materiais=pnum(e.target.value);P.valor_servico=null;P.materiais_ref=M;re()});
    $("#pAv")&&($("#pAv").onchange=e=>{const v=e.target.value.trim();P.valor_servico=v===""?null:pnum(v);if(P.valor_servico!=null&&M)P.pct_materiais=+(P.valor_servico/M*100).toFixed(4);P.materiais_ref=M;re()});
    $("#pB")&&($("#pB").onchange=e=>{P.lucro_pct=pnum(e.target.value);P.materiais_ref=M;re()});
    $("#pOkRef")&&($("#pOkRef").onclick=()=>{P.materiais_ref=M;re()});
    $("#pAdd").onclick=()=>{(P.custos=P.custos||[]).push({desc:"",grupo:"Mão de obra",tipo:"mo",pessoas:1,dias:1,diaria:0});re()};
    $("#pMod").onchange=e=>{if(e.target.value!=="padrao")return;(P.custos=P.custos||[]).push(
      {desc:"Imposto",grupo:"Imposto",tipo:"pct",pct:10,base:"servico"},{desc:"Comissão",grupo:"Comissão",tipo:"pct",pct:5,base:"total"},{desc:"Comissão ON",grupo:"Comissão",tipo:"pct",pct:1.9,base:"servico"},
      {desc:"Mão de obra",grupo:"Mão de obra",tipo:"mo",pessoas:4,dias:5,diaria:250},{desc:"Deslocamento",grupo:"Deslocamento",tipo:"qv",qtd:1,valor:600},{desc:"Frete material",grupo:"Frete",tipo:"pct",pct:.2,base:"total"});re()};
    $$("tr[data-i]",el).forEach(tr=>{const i=+tr.dataset.i;
      $$("[data-k]",tr).forEach(inp=>inp.onchange=()=>{const k=inp.dataset.k,c=P.custos[i];c[k]=["desc","grupo","tipo","base"].includes(k)?inp.value:pnum(inp.value);
        if(k==="tipo")Object.assign(c,inp.value==="pct"?{pct:c.pct||0,base:c.base||"servico"}:inp.value==="mo"?{pessoas:c.pessoas||1,dias:c.dias||1,diaria:c.diaria||0}:{qtd:c.qtd||1,valor:c.valor||0});re()})});
    $$("[data-del]",el).forEach(b=>b.onclick=()=>{P.custos.splice(+b.dataset.del,1);re()});
  }

  shell();
}
})().catch(e=>{console.error(e);document.getElementById("root").innerHTML=`<div class="erro"><h1>OrçaRede</h1><p>Erro inesperado: ${String(e.message||e).replace(/</g,"&lt;")}</p><a href="index.html">Ir para o início</a></div>`});
</script>
</body>
</html>
